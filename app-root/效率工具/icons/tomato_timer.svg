<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4A0E0E" flood-opacity="0.25"/>
    </filter>
    <filter id="inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feOffset dx="0" dy="4"/>
      <feComposite operator="out" in2="SourceAlpha" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.3" result="color"/>
      <feComposite operator="in" in2="inverse" result="shadow"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <radialGradient id="tomato-grad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="40%" stop-color="#EE5253"/>
      <stop offset="85%" stop-color="#C82333"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </radialGradient>
    <linearGradient id="dial-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F2F6"/>
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ED573"/>
      <stop offset="70%" stop-color="#26AF5F"/>
      <stop offset="100%" stop-color="#1E824C"/>
    </linearGradient>
    <linearGradient id="stem-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26AF5F"/>
      <stop offset="100%" stop-color="#145A32"/>
    </linearGradient>
    <linearGradient id="highlight-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#FAF7F2" rx="24"/>

  <g filter="url(#drop-shadow)">
    <path d="M 250,90 C 340,85 430,130 430,260 C 430,380 340,435 250,435 C 160,435 70,380 70,260 C 70,130 160,85 250,90 Z" fill="url(#tomato-grad)" />
    <path d="M 140,140 C 180,110 230,102 270,105 C 220,112 170,128 140,155 C 135,150 138,143 140,140 Z" fill="url(#highlight-grad)"/>
    <ellipse cx="115" cy="230" rx="15" ry="45" transform="rotate(-20 115 230)" fill="url(#highlight-grad)" opacity="0.5"/>
  </g>

  <g id="clock-dial">
    <circle cx="250" cy="275" r="122" fill="#B31B1B" opacity="0.3"/>
    <circle cx="250" cy="275" r="116" fill="#FFFFFF" filter="url(#inner-shadow)"/>
    <circle cx="250" cy="275" r="112" fill="url(#dial-grad)"/>
    <path d="M 250,275 L 250,171 A 104 104 0 0 1 340.06,327 C 310,360 270,370 250,275 Z" fill="#FF6B6B" opacity="0.25"/>
    <line x1="250" y1="167" x2="250" y2="179" stroke="#2F3542" stroke-width="3.5" stroke-linecap="round"/>
    <text x="250" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#2F3542" text-anchor="middle">0</text>
    <line x1="302" y1="181" x2="296" y2="191" stroke="#A4B0BE" stroke-width="2" stroke-linecap="round"/>
    <line x1="341" y1="222" x2="331" y2="228" stroke="#A4B0BE" stroke-width="2" stroke-linecap="round"/>
    <line x1="358" y1="275" x2="346" y2="275" stroke="#2F3542" stroke-width="3.5" stroke-linecap="round"/>
    <text x="334" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#2F3542" text-anchor="middle">15</text>
    <line x1="341" y1="328" x2="331" y2="322" stroke="#A4B0BE" stroke-width="2" stroke-linecap="round"/>
    <line x1="302" y1="369" x2="296" y2="359" stroke="#A4B0BE" stroke-width="2" stroke-linecap="round"/>
    <line x1="250" y1="383" x2="250" y2="371" stroke="#2F3542" stroke-width="3.5" stroke-linecap="round"/>
    <text x="250" y="363" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#2F3542" text-anchor="middle">30</text>
    <line x1="198" y1="369" x2="204" y2="359" stroke="#A4B0BE" stroke-width="2" stroke-linecap="round"/>
    <line x1="159" y1="328" x2="169" y2="322" stroke="#A4B0BE" stroke-width="2" stroke-linecap="round"/>
    <line x1="142" y1="275" x2="154" y2="275" stroke="#2F3542" stroke-width="3.5" stroke-linecap="round"/>
    <text x="166" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#2F3542" text-anchor="middle">45</text>
    <line x1="159" y1="222" x2="169" y2="228" stroke="#A4B0BE" stroke-width="2" stroke-linecap="round"/>
    <line x1="198" y1="181" x2="204" y2="191" stroke="#A4B0BE" stroke-width="2" stroke-linecap="round"/>
    <line x1="250" y1="275" x2="215" y2="235" stroke="#2F3542" stroke-width="6" stroke-linecap="round"/>
    <line x1="250" y1="275" x2="295" y2="352" stroke="#EE5253" stroke-width="4" stroke-linecap="round"/>
    <circle cx="250" cy="275" r="7" fill="#2F3542"/>
    <circle cx="250" cy="275" r="3" fill="#FFFFFF"/>
  </g>

  <g id="leaves" filter="url(#drop-shadow)">
    <path d="M 244,100 C 242,70 248,55 255,45 C 262,55 258,70 256,100 Z" fill="url(#stem-grad)"/>
    <ellipse cx="255" cy="45" rx="6" ry="3" fill="#1E824C"/>
    <path d="M 250,90 C 220,70 170,75 145,85 C 175,100 215,100 250,90 Z" fill="url(#leaf-grad)"/>
    <path d="M 250,90 C 280,68 330,70 355,80 C 325,98 285,100 250,90 Z" fill="url(#leaf-grad)"/>
    <path d="M 250,90 C 290,95 340,115 360,135 C 325,135 280,115 250,90 Z" fill="url(#leaf-grad)"/>
    <path d="M 250,90 C 210,98 160,120 138,140 C 170,135 220,112 250,90 Z" fill="url(#leaf-grad)"/>
    <path d="M 250,85 L 255,93 L 263,90 L 258,97 L 264,102 L 255,101 L 250,108 L 246,101 L 237,102 L 242,97 L 237,90 L 245,93 Z" fill="#1E824C"/>
  </g>
</svg>