<title>付费推广分析</title>
<script>
(function(){
  var WP='wb_theme', WS='wb_theme_auto_start', WE='wb_theme_auto_end';
  function mins(t){ var p=String(t||'00:00').split(':'); return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0); }
  function resolve(mode){
    if(mode==='light'||mode==='dark'||mode==='eye') return mode;
    if(mode!=='auto') return 'light';
    var d=new Date(), m=d.getHours()*60+d.getMinutes(), s=1080, e=360;
    try{ s=mins(localStorage.getItem(WS)||'18:00'); e=mins(localStorage.getItem(WE)||'06:00'); }catch(x){}
    var dark=(s<e)?(m>=s&&m<e):(m>=s||m<e);
    return dark?'dark':'light';
  }
  window.__wbResolveTheme = resolve;
  function apply(){ var mode='light'; try{ mode=localStorage.getItem(WP)||'light'; }catch(e){} document.documentElement.setAttribute('data-theme', resolve(mode)); }
  apply();
  window.addEventListener('message', function(e){
    if(e.data && e.data.type==='wb-theme'){
      var t=e.data.theme||e.data.mode;
      if(t) document.documentElement.setAttribute('data-theme', resolve(t)); else apply();
    }
  });
  try{ window.addEventListener('storage', function(e){ if(!e.key||e.key===WP||e.key===WS||e.key===WE) apply(); }); }catch(e){}
})();
</script>

.act-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:act}

.trend-legend.is-collapsed{display:none}

.kw-cloud-wrap{margin-top:16px;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--paper)}

/* 词条：字号由 --kw-size（∝√展现量）驱动，颜色深浅由 --kw-depth（ROI 组内排名）驱动。
   两个变量都在行内 style 里给出，CSS 只负责把它们翻译成视觉表现。
   position:relative 为悬停浮层提供定位上下文；不设 cursor:help，避免出现问号光标。 */
.kw-chip{position:relative;display:inline-block;font-weight:700;font-size:var(--kw-size,18px);
  padding:2px 4px;border-radius:6px;cursor:default;outline:none;
  max-width:100%;overflow-wrap:anywhere;
  transition:transform .18s cubic-bezier(.34,1.25,.5,1),opacity .18s,background .18s,color .18s}
/* 颜色深浅表达 ROI：--kw-depth 为 0~1 的组内 ROI 排名。
   用「浅色 → 近黑」的色相插值，而不是调透明度 —— opacity 的上限是原色，
   最高 ROI 只能做到"不透明"，无法更深；混入近黑后头部词能真正压到
   蓝得发黑 / 红得发黑，与尾部的差距远大于透明度方案。
   color-mix 在 Chrome 111+/Safari 16.2+ 支持；下面用 @supports 兜底，
   旧内核回退到原来的 opacity 方案，不会出现无色文字。 */
.kw-good .kw-chip{color:#FDBA74;opacity:calc(.55 + var(--kw-depth,1) * .45)}
.kw-bad .kw-chip{color:#f08b8b;opacity:calc(.55 + var(--kw-depth,1) * .45)}
@supports (color:color-mix(in srgb,red 50%,blue)){
  .kw-good .kw-chip{opacity:1;
    color:color-mix(in srgb,#1a1140 calc(var(--kw-depth,1) * 92%),#FDBA74)}
  .kw-bad .kw-chip{opacity:1;
    color:color-mix(in srgb,#3d0a0a calc(var(--kw-depth,1) * 92%),#f5a3a3)}
}
/* 选中动效：放大并回到完全不透明，让当前词从整朵云里"浮"出来。
   focus-visible 与 hover 同款，键盘 Tab 也能获得同样反馈。 */

.kw-good .kw-chip:hover,.kw-good .kw-chip:focus-visible{background:rgba(234,88,12,.12)}
.kw-bad .kw-chip:hover,.kw-bad .kw-chip:focus-visible{background:rgba(220,38,38,.12)}
/* 悬停时其余词整体减淡，突出当前项 */
/* 悬停时其余词整体减淡（乘在既有 opacity 之上会失真，故直接给定值） */

.kw-tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,4px);

  transition:opacity .18s,transform .18s;z-index:30}
.kw-tip:after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;
  border:5px solid transparent;border-top-color:#1f2937}
.kw-chip:hover .kw-tip,.kw-chip:focus-visible .kw-tip{opacity:1;visibility:visible;transform:translate(-50%,0)}
.kw-tip-name{display:block;font-weight:700;font-size:12px;margin-bottom:6px;
  padding-bottom:6px;border-bottom:1px solid rgba(249,250,251,.18);color:#fff}
.kw-tip-row{display:flex;justify-content:space-between;gap:14px;white-space:nowrap}

.kw-cloud .kw-chip:first-child .kw-tip{left:0;transform:translate(0,4px)}
.kw-cloud .kw-chip:first-child:hover .kw-tip,.kw-cloud .kw-chip:first-child:focus-visible .kw-tip{transform:translate(0,0)}
.kw-cloud .kw-chip:last-child .kw-tip{left:auto;right:0;transform:translate(0,4px)}

/* ── 人群模块（淘天专属）─────────────────────────────────
 环形图只画 Top5 + 其他：超过五段后色块过窄，既难辨认也难悬停。

.donut-wrap{margin-top:16px;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--paper)}
.donut-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.donut-head b{font-size:14px;color:var(--ink)}
.donut-head span{color:var(--muted);font-size:12px}
.donut-body{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut-svg{width:180px;height:180px;flex:none}
/* 扇区与图例联动：任一侧被选中时，JS 给 .donut-body 加 is-active 并给

.donut-arc{transition:opacity .15s,stroke-width .15s;cursor:pointer;outline:none}

        /* 总览指标只允许两种布局：≤6 项排一行，正好 8 项排两行每行 4 个。
           用 data-kpi-count 显式声明列数，不再依赖 auto-fit —— auto-fit 会把 8 项

        .hero-kpis[data-kpi-count="1"]{grid-template-columns:repeat(1,minmax(0,1fr))}
        .hero-kpis[data-kpi-count="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}

        .hero-kpis[data-kpi-count="6"]{grid-template-columns:repeat(6,minmax(0,1fr))}

/* ── 分组投入产出对比 ────────────────────────────────────────────────
   每个分组两根条形：上=花费，下=产出。电商族共用金额刻度可直接比长短；
   线索族因产出是计数、与花费不同量纲，两行各自归一（见 render_channel_roi_compare）。 */
.roi-compare{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.roi-compare>h4{margin:0 0 4px;font-size:var(--font-size-small);font-weight:700}
.roi-compare-row{margin-top:16px}
.roi-compare-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.roi-compare-head>b{font-size:var(--font-size-small);font-weight:600}
/* 入选口径徽标：与行动清单的 P0/P1/P2 同一套药丸视觉（淡底 + 同色深字 + 圆角）。
   颜色承载语义：绿=该加投，红=该缩减，靛蓝=中性定位提示。
   inline-block + 右外边距，让它与计划名同基线且不被长名称挤走。 */
.rc-tag{display:inline-block;margin-right:7px;padding:2px 8px;border-radius:6px;
  font-size:11px;font-weight:800;letter-spacing:.2px;line-height:1.5;vertical-align:1px;
  white-space:nowrap}
/* 紫=高投入（只表示预算压在这里，不含好坏判断） */
.rc-tag-spend{background:rgba(249,115,10,.13);color:#EA580C}
/* 绿=正向：高产出与各类高 ROI，值得加投或复制 */
.rc-tag-good{background:rgba(16,185,129,.14);color:#047857}
/* 红=负向：低 ROI 与零成交，该缩减或停投 */
.rc-tag-bad{background:rgba(220,38,38,.12);color:#dc2626}
/* 兜底档：出现未映射的新标签时不至于没样式 */
.rc-tag-neutral{background:rgba(100,116,139,.14);color:#475569}
.roi-compare-eff{font-size:var(--font-size-micro);color:var(--muted)}
.roi-compare-eff>b{margin-left:4px;font-size:var(--font-size-small);color:var(--ink);font-weight:700}
.roi-compare-bar{height:9px;margin-top:6px;border-radius:999px;background:#f1f5f9;overflow:hidden}
.roi-compare-bar>i{display:block;height:100%;border-radius:999px}
.roi-compare-bar.spend>i{background:linear-gradient(90deg,#FDBA74,#F97316)}
.roi-compare-bar.outcome>i{background:linear-gradient(90deg,#6ee7d7,#10b981)}
.roi-compare-meta{display:flex;flex-wrap:wrap;gap:16px;margin-top:7px;
  font-size:var(--font-size-micro);color:var(--muted)}
.roi-compare-legend{display:flex;gap:18px;margin-top:18px;
  font-size:var(--font-size-micro);color:var(--muted)}
.roi-compare-legend>span{display:inline-flex;align-items:center;gap:6px}
.roi-compare-legend>span::before{content:"";width:9px;height:9px;border-radius:50%}
.roi-compare-legend>.spend::before{background:#F97316}
.roi-compare-legend>.outcome::before{background:#10b981}

/* 趋势块的小标题与口径说明并排一行。
   通用 .module-subhead 在窄屏媒体查询里被改成 display:block + span 独占一行
   （长说明在窄容器里更易读），趋势块的说明已精简到一句，无需独占一行。
   这里恢复 flex 行内排列，只作用于 .core-trend，不影响其他模块。
   注意 align-items 用 baseline：标题 15px、说明 11px，按基线对齐比按顶端
   对齐更整齐（两者行高不同，顶端对齐会显得说明文字偏高）。 */
.core-trend .module-subhead{display:flex;align-items:baseline;justify-content:flex-start;
  gap:12px;flex-wrap:nowrap;margin-bottom:10px}
.core-trend .module-subhead h3{flex:none;white-space:nowrap}

  --rp-ink:#3C3229; --rp-ink-2:#4A3D31; --rp-muted:#7A6E5F; --rp-muted-2:#A2957F;
  --rp-accent:#F97316; --rp-accent-d:#EA580C;
  --rp-accent-soft:rgba(249,115,10,.13); --rp-accent-border:rgba(249,115,10,.40);

  --rp-warn:#B45309; --rp-warn-soft:#F7EBD4; --rp-warn-border:#E4CEA6;

  --rp-ink:#F5EFEA; --rp-ink-2:#E4DAD2; --rp-muted:#B4A49A; --rp-muted-2:#8A7A70;
  --rp-accent:#FB923C; --rp-accent-d:#F97316;
  --rp-accent-soft:rgba(251,146,60,.14); --rp-accent-border:rgba(251,146,60,.38);

  --rp-ok:#34D399; --rp-ok-soft:#12251D; --rp-info:#60A5FA; --rp-info-soft:#141F2E;

/* ══════════════════════════════════════════════════════════
   ⑦ 报告目录（吸顶导航） 2026-09-22 新增
   背景：报告 8 模块 / ≈10000px（约 10 屏），此前**无任何内部跳转**。
   层级：.rp-topbar(30) 之下、正文之上，z-index:26（低于 30 避免压住工具条）。
   ★ 所有定位值都用变量，不写死像素：
     --toc-h 由 JS 写入（syncTocHeight），供 scroll-margin-top 计算锚点偏移。
   ══════════════════════════════════════════════════════════ */
:root{ --toc-h:0px; }

.rp-toc{
  position:sticky; z-index:26;
  /* ★ 紧跟 .rp-topbar 之下：top 用工具条的实际高度。

     用 var 兜底 + 实测微调，小屏由媒体查询缩减。 */
  top:var(--topbar-h, 56px);
  display:flex; align-items:center; gap:10px;
  padding:8px max(20px, calc(50% - 520px));
  background:rgba(255,255,255,.86);
  backdrop-filter:saturate(150%) blur(10px);
  border-bottom:1px solid var(--rp-border);
}

.rp-toc-label{
  font-size:12px; font-weight:600; color:var(--rp-muted);
  flex:0 0 auto; letter-spacing:.5px;
}
.rp-toc-track{
  display:flex; align-items:center; gap:4px;
  flex:1 1 auto; min-width:0;
  overflow-x:auto; overflow-y:hidden;
  scrollbar-width:none; -ms-overflow-style:none;
}
.rp-toc-track::-webkit-scrollbar{ height:0; display:none; }

.rp-toc-item{
  appearance:none; border:1px solid transparent; background:transparent;
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 10px; border-radius:999px;
  font-family:inherit; font-size:12.5px; font-weight:600;
  color:var(--rp-muted); white-space:nowrap; cursor:pointer;

}
.rp-toc-item em{

}
.rp-toc-item:hover{ background:var(--rp-accent-soft); color:var(--rp-ink); }
.rp-toc-item.is-active{
  background:var(--rp-accent-soft);
  border-color:var(--rp-accent-border);
  color:var(--rp-accent-d);
}
.rp-toc-item.is-active em{ opacity:1; }

/* 锚点偏移：跳转 / 手动点锚点时，标题不要被吸顶条盖住 */
.report-anchor{ scroll-margin-top: calc(var(--toc-h, 0px) + var(--topbar-h, 56px) + 12px); }

@media (max-width: 720px){
  .rp-toc{ padding:7px 14px; }
  .rp-toc-label{ display:none; }
  .rp-toc-item{ padding:4px 9px; font-size:12px; }
  .rp-toc-item span{ max-width:72px; overflow:hidden; text-overflow:ellipsis; }

     用户看到第 6 节想回对第 2 节的数字只能靠滚轮手找。
     做法：**DOM 后处理** —— 渲染完报告后扫描 .section-title-row 自动生成，
     而不是把目录写死在 renderer 里。好处：某个模块因数据缺失不出现时，目录自动跟着少一项，

<div class="rp-src" id="rpSrc" hidden></div>

<script>/* ══════════════════════════════════════════════════════════════════
   付费推广分析 · 计算引擎
   纯函数、零依赖 —— 同一份代码在 Node（验证口径）与浏览器（渲染）里跑。

   口径（2026-09-20 逆向自一份已生成的原报告，逐项核对过）：
   · 全店 KPI：从「投放计划 / 商品推广 / 关键词分析 / 营销场景」任一张表
     按行求和结果**完全一致**（这几张是同一份数据的平行投影）。
     ⚠️ 「人群分析」只覆盖有人群定向的那部分花费，**不能**用来算全店。
   · 花费=Σ花费，成交金额=Σ「总成交金额」，曝光=Σ展现量，点击=Σ点击量，
     成交订单数=Σ「总成交笔数」，ROI=成交金额÷花费。
     ⚠️ 原报告的口径说明写的是「总预售成交金额」，但那一列实测全是 0 ——
        真值取的是「总成交金额」（= 直接成交 + 间接成交）。这里按**实测**来。
   · 错配度 = 花费占比 − 成交金额占比（负=少花钱多出货，值得加投）。
   ══════════════════════════════════════════════════════════════════ */
(function (root) {
  'use strict';

  /* ── 小工具 ── */
  function n(v) {
    if (v === null || v === undefined) return 0;
    var s = String(v).replace(/,/g, '').replace(/%/g, '').trim();
    if (!s) return 0;
    var f = parseFloat(s);
    return isFinite(f) ? f : 0;
  }
  function div(a, b) { return b ? a / b : 0; }
  function pct(a, b) { return b ? (a / b) * 100 : 0; }
  /* 按表头名取列下标；找不到返回 -1 */
  function col(headers, name) { return headers.indexOf(name); }
  function pick(row, ci) { return ci < 0 ? '' : (row[ci] === undefined ? '' : row[ci]); }

  /* 把一张 sheet 的「行数组」按某个 keyFn 分组并求和 */
  function groupSum(rows, cols, keyFn) {
    var map = new Map();
    rows.forEach(function (r) {
      var k = keyFn(r);
      if (k === null || k === undefined || k === '') return;
      var o = map.get(k);
      if (!o) {
        o = { key: k, spend: 0, gmv: 0, imp: 0, click: 0, orders: 0, carts: 0, newCust: 0, cust: 0, dates: {}, rows: 0 };
        map.set(k, o);
      }
      o.spend += n(pick(r, cols.spend));
      o.gmv += n(pick(r, cols.gmv));
      o.imp += n(pick(r, cols.imp));
      o.click += n(pick(r, cols.click));
      o.orders += n(pick(r, cols.orders));
      o.carts += n(pick(r, cols.cartD)) + n(pick(r, cols.cartI));
      o.newCust += n(pick(r, cols.newCust));
      o.cust += n(pick(r, cols.cust));
      var d = String(pick(r, cols.date) || '').slice(0, 10);
      if (d) o.dates[d] = 1;
      o.rows++;
    });
    return map;
  }
  function finalize(o) {
    o.roi = div(o.gmv, o.spend);
    o.ctr = div(o.click, o.imp);
    o.cpc = div(o.spend, o.click);
    o.cvr = div(o.orders, o.click);
    o.cartRate = div(o.carts, o.click);
    o.days = Object.keys(o.dates).sort();
    o.dayCount = o.days.length;
    o.period = o.dayCount ? (o.days[0] + ' ~ ' + o.days[o.dayCount - 1]) : '';
    return o;
  }

  /* ★ 按「列名特征」判断一张表属于哪个维度 —— 比只认 sheet 名稳得多：
     用户自己合并 / 改过名的报表（sheet 名可能是 Sheet1）也能认出来。
     ⚠️ 判断顺序要紧：「投放计划」表里也有「场景名字」，所以 plan 必须排在 scene 前面。 */
  function classifySheet(sh) {
    var h = (sh && sh.headers) || [];
    function has(n) { return h.indexOf(n) >= 0; }
    if (has('词名字/词包名字') || has('词ID/词包ID')) return 'kw';
    if (has('计划名字') || has('计划ID')) return 'plan';
    if (has('人群名字')) return 'crowd';
    if (has('主体名称') || has('主体ID')) return 'prod';
    if (has('场景名字')) return 'scene';
    return null;
  }

  /* 找一张表：先按标准 sheet 名，找不到再按列名特征兜底 */
  function findSheet(sheets, name, kind) {
    var i;
    for (i = 0; i < sheets.length; i++) {
      if (sheets[i] && sheets[i].name === name) return sheets[i];
    }
    if (kind) {
      for (i = 0; i < sheets.length; i++) {
        if (sheets[i] && classifySheet(sheets[i]) === kind) return sheets[i];
      }
    }
    return null;
  }

  function sheetOf(sheets, name) {
    for (var i = 0; i < sheets.length; i++) {
      if (sheets[i] && sheets[i].name === name) return sheets[i];
    }
    return null;
  }

  /* ── 主入口 ── */
  function analyzeReport(sheets) {
    sheets = sheets || [];
    var plan = findSheet(sheets, '投放计划', 'plan');
    var prod = findSheet(sheets, '商品推广', 'prod');
    var kw = findSheet(sheets, '关键词分析', 'kw');
    var crowd = findSheet(sheets, '人群分析', 'crowd');
    var scene = findSheet(sheets, '营销场景', 'scene');

    /* 全店口径优先用「投放计划」（它一定有），退化到其它表 */
    var base = plan || prod || kw || scene;
    if (!base || !base.rows || !base.rows.length) return null;

    function colsOf(sh) {
      var h = sh.headers;
      return {
        date: col(h, '日期'), scene: col(h, '场景名字'), plan: col(h, '计划名字'), planId: col(h, '计划ID'),
        subject: col(h, '主体名称'), subjectId: col(h, '主体ID'),
        crowd: col(h, '人群名字'), word: col(h, '词名字/词包名字'), wordType: col(h, '词类型'),
        wordId: col(h, '词ID/词包ID'),
        imp: col(h, '展现量'), click: col(h, '点击量'), spend: col(h, '花费'),
        cartD: col(h, '直接购物车数'), cartI: col(h, '间接购物车数'),
        gmv: col(h, '总成交金额'), orders: col(h, '总成交笔数'), carts: col(h, '总购物车数'),
        newCust: col(h, '成交新客数'), cust: col(h, '成交人数')
      };
    }
    var C = colsOf(base);

    /* ── 全店汇总 ── */
    var total = { spend: 0, gmv: 0, imp: 0, click: 0, orders: 0, carts: 0 };
    base.rows.forEach(function (r) {
      total.spend += n(pick(r, C.spend));
      total.gmv += n(pick(r, C.gmv));
      total.imp += n(pick(r, C.imp));
      total.click += n(pick(r, C.click));
      total.orders += n(pick(r, C.orders));
      /* ★ 加购数 = 直接购物车数 + 间接购物车数。
         「总购物车数」那一列口径不同（实测 581 vs 报告 1033），别用。 */
      total.carts += n(pick(r, C.cartD)) + n(pick(r, C.cartI));
    });
    total.roi = div(total.gmv, total.spend);
    total.ctr = div(total.click, total.imp);
    total.cpc = div(total.spend, total.click);
    total.cvr = div(total.orders, total.click);
    total.cartRate = div(total.carts, total.click);

    /* 分析周期 */
    var dates = {};
    base.rows.forEach(function (r) { var d = String(pick(r, C.date) || '').slice(0, 10); if (d) dates[d] = 1; });
    var dayList = Object.keys(dates).sort();
    var period = { from: dayList[0] || '', to: dayList[dayList.length - 1] || '', days: dayList.length, list: dayList };

    /* ── 日趋势（全店） ── */
    var byDate = new Map();
    base.rows.forEach(function (r) {
      var d = String(pick(r, C.date) || '').slice(0, 10);
      if (!d) return;
      var o = byDate.get(d) || { d: d, spend: 0, gmv: 0, imp: 0, click: 0, orders: 0, carts: 0 };
      o.spend += n(pick(r, C.spend)); o.gmv += n(pick(r, C.gmv));
      o.imp += n(pick(r, C.imp)); o.click += n(pick(r, C.click));
      o.orders += n(pick(r, C.orders)); o.carts += n(pick(r, C.cartD)) + n(pick(r, C.cartI));
      byDate.set(d, o);
    });
    var trend = dayList.map(function (d) {
      var o = byDate.get(d);
      o.roi = div(o.gmv, o.spend); o.ctr = div(o.click, o.imp);
      o.cvr = div(o.orders, o.click); o.cpc = div(o.spend, o.click);
      o.cartRate = div(o.carts, o.click);
      return o;
    });

    /* ── 营销场景（分场景日趋势） ── */
    var scenes = [];
    if (base === scene && C.scene >= 0) {
      var scMap = groupSum(base.rows, C, function (r) { return String(pick(r, C.scene) || '').trim(); });
      scMap.forEach(function (o, k) {
        finalize(o); o.name = k;
        /* 该场景的逐日 */
        var dm = new Map();
        base.rows.forEach(function (r) {
          if (String(pick(r, C.scene) || '').trim() !== k) return;
          var d = String(pick(r, C.date) || '').slice(0, 10); if (!d) return;
          var x = dm.get(d) || { d: d, spend: 0, gmv: 0 };
          x.spend += n(pick(r, C.spend)); x.gmv += n(pick(r, C.gmv));
          dm.set(d, x);
        });
        o.daily = dayList.map(function (d) { return dm.get(d) || { d: d, spend: 0, gmv: 0 }; });
        scenes.push(o);
      });
      scenes.sort(function (a, b) { return b.spend - a.spend; });
    }

    /* ── 03 投放计划 ── */
    var planReport = null;
    if (plan && plan.rows.length) {
      var P = colsOf(plan);
      var planName = {};
      var pm = groupSum(plan.rows, P, function (r) {
        var id = String(pick(r, P.planId) || '').trim();
        var nm = String(pick(r, P.plan) || '').trim();
        var key = id || nm;
        if (key && !planName[key]) planName[key] = nm;
        return key;
      });
      var items = [];
      pm.forEach(function (o, k) {
        finalize(o);
        o.name = planName[k] || k;
        o.id = k;
        o.scene = '';
        plan.rows.forEach(function (r) { if (!o.scene && String(pick(r, P.planId) || '').trim() === k) o.scene = String(pick(r, P.scene) || ''); });
        items.push(o);
      });
      items.sort(function (a, b) { return b.spend - a.spend; });

      var withGmv = items.filter(function (x) { return x.gmv > 0; });
      var zero = items.filter(function (x) { return x.gmv <= 0; });
      var rois = withGmv.map(function (x) { return x.roi; }).sort(function (a, b) { return a - b; });

      /* 按渠道（场景）分组 */
      var gmap = new Map();
      items.forEach(function (x) {
        var k = x.scene || '未标注场景';
        if (!gmap.has(k)) gmap.set(k, []);
        gmap.get(k).push(x);
      });
      var groups = [];
      gmap.forEach(function (arr, k) {
        var g = { scene: k, items: arr, spend: 0, gmv: 0 };
        arr.forEach(function (x) { g.spend += x.spend; g.gmv += x.gmv; });
        g.roi = div(g.gmv, g.spend);
        g.share = pct(g.spend, total.spend);
        groups.push(g);
      });
      groups.sort(function (a, b) { return b.spend - a.spend; });

      /* 代表性计划：5 类各取 1（原报告的取法） */
      var reps = [];
      function takeRep(label, hint, arr) {
        if (!arr.length) return;
        var x = arr[0];
        reps.push({ label: label, hint: hint, item: x });
      }
      var bySpend = items.slice().sort(function (a, b) { return b.spend - a.spend; });
      var byGmv = items.slice().sort(function (a, b) { return b.gmv - a.gmv; });
      var byRoi = withGmv.slice().sort(function (a, b) { return b.roi - a.roi; });
      var byRoiAsc = withGmv.slice().sort(function (a, b) { return a.roi - b.roi; });
      var byImp = items.slice().sort(function (a, b) { return b.imp - a.imp; });
      var used = {};
      function firstUnused(arr) {
        for (var i = 0; i < arr.length; i++) { if (!used[arr[i].name]) { used[arr[i].name] = 1; return arr[i]; } }
        return arr[0] || null;
      }
      var r1 = firstUnused(bySpend); if (r1) reps.push({ label: '高投入', hint: '花费最多', item: r1 });
      var r2 = firstUnused(byImp.filter(function (x) { return x.roi < total.roi; })); if (r2) reps.push({ label: '规模化低 ROI', hint: '曝光大但效率低', item: r2 });
      var r3 = firstUnused(byImp.filter(function (x) { return x.roi >= total.roi; })); if (r3) reps.push({ label: '规模化高 ROI', hint: '曝光大且效率高', item: r3 });
      var r4 = firstUnused(byRoi); if (r4) reps.push({ label: '高 ROI', hint: '效率最高', item: r4 });
      var r5 = firstUnused(byGmv); if (r5) reps.push({ label: '高产出', hint: '成交金额最多', item: r5 });

      planReport = {
        total: items.length, withGmv: withGmv.length, zero: zero.length,
        zeroSpend: zero.reduce(function (a, x) { return a + x.spend; }, 0),
        zeroClick: zero.reduce(function (a, x) { return a + x.click; }, 0),
        roiMin: rois.length ? rois[0] : 0, roiMax: rois.length ? rois[rois.length - 1] : 0,
        groups: groups, items: items, reps: reps
      };
    }

    /* ── 04/05 商品 ── */
    var prodReport = null;
    if (prod && prod.rows.length) {
      var D = colsOf(prod);
      var prodName = {};
      var dm2 = groupSum(prod.rows, D, function (r) {
        var id = String(pick(r, D.subjectId) || '').trim();
        var nm = String(pick(r, D.subject) || '').trim();
        var key = id || nm;
        if (key && !prodName[key]) prodName[key] = nm;
        return key;
      });
      var pitems = [];
      dm2.forEach(function (o, k) {
        finalize(o);
        o.name = prodName[k] || k; o.id = k;
        o.spendPct = pct(o.spend, total.spend);
        o.gmvPct = pct(o.gmv, total.gmv);
        o.diff = o.spendPct - o.gmvPct;   /* 错配度 */
        pitems.push(o);
      });
      /* 错配榜：按 |错配度| 排序，但分别给出超配（正）与欠配（负） */
      var mism = pitems.slice().sort(function (a, b) { return Math.abs(b.diff) - Math.abs(a.diff); });
      var spenders = pitems.filter(function (x) { return x.spend > 0; }).sort(function (a, b) { return b.spend - a.spend; });

      /* 四象限：以「有花费且有 ROI」的商品集合的**中位数**划分 */
      var quad = spenders.filter(function (x) { return x.spend > 0 && x.gmv > 0; });
      var medSpend = median(quad.map(function (x) { return x.spend; }));
      var medRoi = median(quad.map(function (x) { return x.roi; }));
      var quads = { hh: [], hl: [], lh: [], ll: [] };
      quad.forEach(function (x) {
        var hi = x.spend >= medSpend, good = x.roi >= medRoi;
        (hi ? (good ? quads.hh : quads.hl) : (good ? quads.lh : quads.ll)).push(x);
      });
      ['hh', 'hl', 'lh', 'll'].forEach(function (k) { quads[k].sort(function (a, b) { return b.spend - a.spend; }); });

      prodReport = {
        total: pitems.length, spenders: spenders.length,
        mismatch: mism.slice(0, 30), items: pitems,
        quad: quads, medSpend: medSpend, medRoi: medRoi
      };
    }

    /* ── 06 关键词 ── */
    var kwReport = null;
    if (kw && kw.rows.length) {
      var K = colsOf(kw);
      /* ★ 按「词ID/词包ID」分组 —— 词包名会重复（如两个「流量智选-好词优选」），
         按名字分会把它们并成一个（实测 9 个 vs 报告 32 个）。显示名另存 name。 */
      var kwName = {};
      var km = groupSum(kw.rows, K, function (r) {
        var id = String(pick(r, K.wordId) || '').trim();
        var nm = String(pick(r, K.word) || '').trim();
        var key = id || nm;
        if (key && !kwName[key]) kwName[key] = nm;
        return key;
      });
      var kitems = [];
      km.forEach(function (o, k) {
        finalize(o);
        o.name = kwName[k] || k;
        o.id = k;
        o.type = '';
        kw.rows.forEach(function (r) { if (!o.type && String(pick(r, K.wordId) || '').trim() === k) o.type = String(pick(r, K.wordType) || ''); });
        kitems.push(o);
      });
      kitems.sort(function (a, b) { return b.spend - a.spend; });

      var typeMap = new Map();
      kitems.forEach(function (x) {
        var t = x.type || '未标注';
        var o = typeMap.get(t) || { type: t, spend: 0, gmv: 0, n: 0 };
        o.spend += x.spend; o.gmv += x.gmv; o.n++;
        typeMap.set(t, o);
      });
      var types = [];
      typeMap.forEach(function (o) { o.pct = pct(o.spend, total.spend); o.roi = div(o.gmv, o.spend); types.push(o); });
      types.sort(function (a, b) { return b.spend - a.spend; });

      var kwWithGmv = kitems.filter(function (x) { return x.gmv > 0; });
      var kwZero = kitems.filter(function (x) { return x.gmv <= 0 && x.spend > 0; });

      /* 词云：按展现量缩放字号、按 ROI 染色。两朵云共用同一刻度。 */
      var impMax = Math.max.apply(null, kitems.map(function (x) { return x.imp; }).concat([1]));
      var good = kwWithGmv.slice().sort(function (a, b) { return b.roi - a.roi; });
      var bad = kitems.filter(function (x) { return x.spend > 0 && x.roi < total.roi; })
                      .sort(function (a, b) { return b.spend - a.spend; });

      kwReport = {
        total: kitems.length, withGmv: kwWithGmv.length,
        zeroCount: kwZero.length,
        zeroSpend: kwZero.reduce(function (a, x) { return a + x.spend; }, 0),
        zeroClick: kwZero.reduce(function (a, x) { return a + x.click; }, 0),
        types: types, items: kitems,
        cloud: { impMax: impMax, good: good.slice(0, 14), bad: bad.slice(0, 14) }
      };
    }

    /* ── 07 人群 ── */
    var crowdReport = null;
    if (crowd && crowd.rows.length) {
      var W = colsOf(crowd);
      var wm = groupSum(crowd.rows, W, function (r) { return String(pick(r, W.crowd) || '').trim(); });
      var witems = [];
      wm.forEach(function (o, k) { finalize(o); o.name = k; witems.push(o); });
      witems.sort(function (a, b) { return b.spend - a.spend; });
      var wSpend = witems.reduce(function (a, x) { return a + x.spend; }, 0);
      var wGmv = witems.reduce(function (a, x) { return a + x.gmv; }, 0);
      var wNew = witems.reduce(function (a, x) { return a + x.newCust; }, 0);
      var wCust = witems.reduce(function (a, x) { return a + x.cust; }, 0);
      var wRois = witems.filter(function (x) { return x.gmv > 0; }).map(function (x) { return x.roi; }).sort(function (a, b) { return a - b; });
      witems.forEach(function (x) { x.share = pct(x.spend, wSpend); });
      crowdReport = {
        total: witems.length, items: witems,
        spend: wSpend, gmv: wGmv, roi: div(wGmv, wSpend),
        share: pct(wSpend, total.spend),
        newRatio: div(wNew, wCust),
        roiMin: wRois.length ? wRois[0] : 0, roiMax: wRois.length ? wRois[wRois.length - 1] : 0
      };
    }

    /* ── 01 数据洞察（规则生成） ── */
    var insights = buildInsights({ total: total, prod: prodReport, kw: kwReport, crowd: crowdReport, plan: planReport });

    /* ── 08 行动清单（规则生成） ── */
    var actions = buildActions({ total: total, prod: prodReport, kw: kwReport, crowd: crowdReport, plan: planReport });

    /* 数据覆盖了哪些维度 —— 有些文件只有一张表（比如单独导出的关键词报表），
       报告只渲染有数据的那几章，并在页面上说明覆盖范围，免得用户以为「少了几章」。 */
    var coverage = [];
    if (plan) coverage.push('投放计划');
    if (prod) coverage.push('商品');
    if (kw) coverage.push('关键词');
    if (crowd) coverage.push('人群');
    if (scene) coverage.push('营销场景');

    return {
      coverage: coverage, baseKind: classifySheet(base),
      period: period, kpi: total, trend: trend, scenes: scenes,
      plan: planReport, prod: prodReport, kw: kwReport, crowd: crowdReport,
      insights: insights, actions: actions
    };
  }

  function median(arr) {
    if (!arr || !arr.length) return 0;
    var a = arr.slice().sort(function (x, y) { return x - y; });
    var m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }
  function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
  function fPct(v) { return (Math.round(v * 100) / 100).toFixed(2) + '%'; }
  function fPp(v) { return (v >= 0 ? '+' : '') + (Math.round(v * 100) / 100).toFixed(2) + 'pp'; }

  /* 数据洞察：从已算好的各维度里挑「最值得说的三条」 */
  function buildInsights(x) {
    var out = [];

    /* 洞察一：商品错配（挑绝对值最大的欠配与超配） */
    if (x.prod && x.prod.mismatch && x.prod.mismatch.length >= 3) {
      var under = x.prod.mismatch.filter(function (m) { return m.diff < 0; }).slice(0, 1)[0];
      var overs = x.prod.mismatch.filter(function (m) { return m.diff > 0; }).slice(0, 3);
      var pts = [];
      if (under) {
        pts.push(short(under.name) + '花费占比 ' + fPct(under.spendPct) + '、成交占比 ' + fPct(under.gmvPct) +
                 '，错配度 ' + fPp(under.diff) + '，ROI ' + f2(under.roi));
      }
      if (overs.length) {
        pts.push(overs.map(function (m) { return short(m.name); }).join('、') + ' 错配 ' +
                 overs.map(function (m) { return fPp(m.diff); }).join('、') + '，ROI 分别 ' +
                 overs.map(function (m) { return f2(m.roi); }).join('、'));
      }
      if (pts.length) {
        out.push({
          title: '钱压错了商品：' + (overs.length ? short(overs[0].name) : '部分商品') + '超配，' +
                 (under ? short(under.name) : '高回报款') + '欠配',
          points: pts
        });
      }
    }

    /* 洞察二：关键词类型效率 */
    if (x.kw && x.kw.types && x.kw.types.length) {
      var top = x.kw.types[0];
      var pts2 = [];
      if (top) {
        pts2.push(top.type + '花费 ' + f2(top.spend) + '、成交 ' + f2(top.gmv) + '，ROI ' + f2(top.roi) +
                  (top.roi < x.total.roi ? '，低于全店 ' + f2(x.total.roi) : '，高于全店 ' + f2(x.total.roi)));
      }
      x.kw.types.slice(1, 4).forEach(function (t) {
        pts2.push(t.type + '花费 ' + f2(t.spend) + ' 带来 ' + f2(t.gmv) + '，ROI ' + f2(t.roi));
      });
      if (x.kw.zeroCount) {
        pts2.push('另有 ' + x.kw.zeroCount + ' 个零成交词消耗 ' + f2(x.kw.zeroSpend) + ' 元、' +
                  Math.round(x.kw.zeroClick).toLocaleString('en-US') + ' 次点击');
      }
      if (pts2.length) {
        out.push({
          title: '近 ' + fPct(top ? top.pct : 0) + ' 预算走「' + (top ? top.type : '主要词类型') + '」，其中效率分化明显',
          points: pts2
        });
      }
    }

    /* 洞察三：人群 */
    if (x.crowd && x.crowd.items && x.crowd.items.length) {
      var c0 = x.crowd.items[0];
      var pts3 = [];
      if (c0) pts3.push(c0.name + '花费 ' + f2(c0.spend) + '、成交 ' + f2(c0.gmv) + '，ROI ' + f2(c0.roi));
      pts3.push(x.crowd.total + ' 个人群合计花费 ' + f2(x.crowd.spend) + '、成交 ' + f2(x.crowd.gmv) +
                '，仅占全店花费 ' + fPct(x.crowd.share));
      var good = x.crowd.items.filter(function (c) { return c.gmv > 0; })
                    .sort(function (a, b) { return b.roi - a.roi; }).slice(0, 2);
      if (good.length) {
        pts3.push(good.map(function (c) { return c.name + ' ROI ' + f2(c.roi); }).join('、') +
                  '，是人群层里相对可用的' + (good.length > 1 ? '两档' : '一档'));
      }
      out.push({
        title: x.crowd.roi < x.total.roi
          ? '人群定向效率偏低：覆盖花费仅 ' + fPct(x.crowd.share) + '，ROI ' + f2(x.crowd.roi) + ' 低于全店'
          : '人群定向：覆盖花费 ' + fPct(x.crowd.share) + '，ROI ' + f2(x.crowd.roi) + ' 高于全店',
        points: pts3
      });
    }
    return out;
  }

  /* 行动清单：从诊断里产出「做什么 + 佐证数字」 */
  function buildActions(x) {
    var acts = [];
    var t = x.total;

    /* 1) 零成交计划 */
    if (x.plan && x.plan.zero > 0) {
      acts.push({
        level: 'high',
        title: '暂停 ' + x.plan.zero + ' 个零成交计划',
        detail: '共消耗 ¥' + f2(x.plan.zeroSpend) + '、' + Math.round(x.plan.zeroClick).toLocaleString('en-US') + ' 次点击，0 成交'
      });
    }

    /* 2) 高花费低 ROI 商品 */
    if (x.prod && x.prod.quad && x.prod.quad.hl && x.prod.quad.hl.length) {
      var hl = x.prod.quad.hl.slice(0, 3);
      acts.push({
        level: 'high',
        title: '压降 ' + hl.length + ' 个「高投入 / 低 ROI」商品',
        detail: hl.map(function (p) { return short(p.name) + '（花费 ¥' + f2(p.spend) + '，ROI ' + f2(p.roi) + '）'; }).join('；')
      });
    }

    /* 3) 欠配（该加钱） */
    if (x.prod && x.prod.mismatch) {
      var under = x.prod.mismatch.filter(function (m) { return m.diff < 0 && m.gmv > 0; }).slice(0, 3);
      if (under.length) {
        acts.push({
          level: 'high',
          title: '给 ' + under.length + ' 个欠配商品加预算',
          detail: under.map(function (p) { return short(p.name) + '（错配 ' + fPp(p.diff) + '，ROI ' + f2(p.roi) + '）'; }).join('；')
        });
      }
    }

    /* 4) 零成交词 */
    if (x.kw && x.kw.zeroCount > 0) {
      acts.push({
        level: 'mid',
        title: '清理 ' + x.kw.zeroCount + ' 个零成交词',
        detail: '消耗 ¥' + f2(x.kw.zeroSpend) + '、' + Math.round(x.kw.zeroClick).toLocaleString('en-US') + ' 次点击，建议加否词或降价'
      });
    }

    /* 5) 低效词类型 */
    if (x.kw && x.kw.types && x.kw.types.length > 1) {
      var badType = x.kw.types.filter(function (t2) { return t2.spend > 0 && t2.roi < t.roi; })
                              .sort(function (a, b) { return b.spend - a.spend; })[0];
      if (badType) {
        acts.push({
          level: 'mid',
          title: '收紧「' + badType.type + '」的预算',
          detail: '花费 ¥' + f2(badType.spend) + '、ROI ' + f2(badType.roi) + '，低于全店 ' + f2(t.roi)
        });
      }
    }

    /* 6) 人群 */
    if (x.crowd && x.crowd.items && x.crowd.items.length) {
      var bad = x.crowd.items.filter(function (c) { return c.gmv > 0 && c.roi < 1.5; });
      if (bad.length) {
        acts.push({
          level: 'mid',
          title: '缩减 ' + bad.length + ' 个低回报人群包',
          detail: bad.slice(0, 3).map(function (c) { return c.name + '（ROI ' + f2(c.roi) + '）'; }).join('；')
        });
      }
      var best = x.crowd.items.filter(function (c) { return c.gmv > 0; })
                    .sort(function (a, b) { return b.roi - a.roi; })[0];
      if (best && best.roi > t.roi) {
        acts.push({
          level: 'low',
          title: '给「' + best.name + '」加预算测试',
          detail: 'ROI ' + f2(best.roi) + ' 高于全店 ' + f2(t.roi) + '，当前花费仅 ¥' + f2(best.spend)
        });
      }
    }

    /* 7) 高 ROI 计划 */
    if (x.plan && x.plan.reps) {
      var hi = x.plan.reps.filter(function (r) { return r.label === '高 ROI'; })[0];
      if (hi && hi.item) {
        acts.push({
          level: 'low',
          title: '给高 ROI 计划「' + short(hi.item.name) + '」加量',
          detail: 'ROI ' + f2(hi.item.roi) + '，花费 ¥' + f2(hi.item.spend) + '，曝光 ' + Math.round(hi.item.imp).toLocaleString('en-US')
        });
      }
    }
    return acts;
  }

  function short(s) {
    s = String(s || '');
    return s.length > 18 ? s.slice(0, 18) + '…' : s;
  }

  /* classifySheet 也导出 —— 报告页要用它给多份数据「按维度去重合并」 */
  var api = { analyzeReport: analyzeReport, classifySheet: classifySheet, median: median, fmt: { f2: f2, pct: fPct, pp: fPp } };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.WBReportEngine = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* 付费推广分析 · 渲染器
   输入：analyzeReport() 的输出 → 输出 HTML 字符串。
   复用原报告的 CSS 类名（.hero / .section / .card / .plan-group / .act-item …），
   所以样式层不用动。 */
(function (root) {
  'use strict';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function money(v) { return '¥' + (Math.round(v * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function money0(v) { return '¥' + Math.round(v).toLocaleString('en-US'); }
  function int(v) { return Math.round(v).toLocaleString('en-US'); }
  function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
  function pct1(v) { return (Math.round(v * 1000) / 10).toFixed(1) + '%'; }
  function pct2(v) { return (Math.round(v * 10000) / 100).toFixed(2) + '%'; }
  function pp(v) { return (v >= 0 ? '+' : '') + f2(v) + 'pp'; }
  function roiCls(v, base) { return v >= base ? 'good-cell' : (v <= 0 ? 'bad-cell' : ''); }
  function shortName(s, n) { s = String(s || ''); n = n || 22; return s.length > n ? s.slice(0, n) + '…' : s; }

  function help(text) {
    return '<button type="button" class="metric-help" aria-label="查看计算口径" aria-expanded="false">?' +
           '<span class="metric-help-tip" aria-hidden="true">' + esc(text) + '</span></button>';
  }

  /* ── 折线图（纯 SVG，不引图表库） ── */
  function lineChart(points, opts) {
    opts = opts || {};
    var w = 720, h = opts.h || 150, pad = { t: 12, r: 12, b: 22, l: 44 };
    var vals = points.map(function (p) { return p.v; });
    var max = Math.max.apply(null, vals.concat([0.0001]));
    var min = Math.min.apply(null, vals.concat([0]));
    var span = (max - min) || 1;
    var iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
    var step = points.length > 1 ? iw / (points.length - 1) : 0;
    function X(i) { return pad.l + i * step; }
    function Y(v) { return pad.t + ih - ((v - min) / span) * ih; }
    var d = points.map(function (p, i) { return (i ? 'L' : 'M') + f2(X(i)) + ' ' + f2(Y(p.v)); }).join(' ');
    var area = d + ' L' + f2(X(points.length - 1)) + ' ' + (pad.t + ih) + ' L' + f2(X(0)) + ' ' + (pad.t + ih) + ' Z';
    var s = '<svg class="trend-svg" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" role="img">';
    /* 网格 + 刻度 */
    for (var g = 0; g <= 3; g++) {
      var y = pad.t + (ih / 3) * g;
      var v = max - (span / 3) * g;
      s += '<line x1="' + pad.l + '" y1="' + f2(y) + '" x2="' + (w - pad.r) + '" y2="' + f2(y) + '" stroke="currentColor" stroke-opacity=".12"/>';
      s += '<text x="' + (pad.l - 6) + '" y="' + f2(y + 4) + '" text-anchor="end" font-size="10" fill="currentColor" fill-opacity=".55">' +
           (opts.money ? money0(v) : int(v)) + '</text>';
    }
    s += '<path d="' + area + '" fill="var(--primary)" fill-opacity=".10"/>';
    s += '<path d="' + d + '" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round"/>';
    points.forEach(function (p, i) {
      s += '<circle cx="' + f2(X(i)) + '" cy="' + f2(Y(p.v)) + '" r="3" fill="var(--primary)"><title>' + esc(p.label + '：' + (opts.money ? money(p.v) : int(p.v))) + '</title></circle>';
      s += '<text x="' + f2(X(i)) + '" y="' + (h - 6) + '" text-anchor="middle" font-size="10" fill="currentColor" fill-opacity=".55">' + esc(p.label) + '</text>';
    });
    s += '</svg>';
    return s;
  }

  /* ── 主渲染 ── */
  function renderReport(R, meta) {
    meta = meta || {};
    var k = R.kpi, out = [];

    /* ── Hero ──
       版式对齐「沟通分析报告」：.hero 是透明容器，渐变在 .hero-inner 上（居中卡），
       顶部带一行 eyebrow 小标签。2026-09-20 用户要求两个报告页视觉一致。 */
    out.push('<section class="hero report-anchor" id="overview">');
    out.push('<div class="hero-inner">');
    out.push('<div class="hero-eyebrow">PAID PROMOTION ANALYSIS</div>');
    out.push('<div class="hero-left">');
    out.push('<div class="product-title">付费推广分析</div>');
    out.push('<div class="meta">分析周期：' + esc(R.period.from) + ' 至 ' + esc(R.period.to) +
             '（共 ' + R.period.days + ' 天）' + (meta.fileName ? ' · 数据源：' + esc(meta.fileName) : '') + '</div>');
    out.push('<div class="hero-tags">');
    out.push('<span class="tag">广告花费 ' + money(k.spend) + '</span>');
    out.push('<span class="tag">成交 ' + money(k.gmv) + '</span>');
    out.push('<span class="tag' + (k.roi >= 3 ? '' : ' danger') + '">ROI ' + f2(k.roi) + '</span>');
    out.push('<span class="tag">' + R.period.days + ' 天数据</span>');
    /* 只覆盖部分维度时明说 —— 否则用户会以为「怎么少了几章」 */
    if (R.coverage && R.coverage.length && R.coverage.length < 5) {
      out.push('<span class="tag">仅含 ' + esc(R.coverage.join(' / ')) + ' 维度</span>');
    }
    out.push('</div>');
    if (R.coverage && R.coverage.length && R.coverage.length < 5) {
      out.push('<div class="meta" style="opacity:.75;margin-top:4px;">' +
        '这份数据只包含 ' + esc(R.coverage.join(' / ')) + ' 维度，报告只展示有数据对应的章节。' +
        '想看完整分析（投放计划 / 商品 / 人群 / 营销场景），请上传完整的「店铺推广数据汇总」。</div>');
    }
    out.push('</div>');
    out.push('<div class="hero-kpis" data-kpi-count="6">');
    var heroKpi = [
      ['广告总花费', money(k.spend), '广告实际扣费金额（源报表「花费」列求和）。'],
      ['总成交金额', money(k.gmv), '广告点击后的归因成交金额 = 直接成交金额 + 间接成交金额。注意与生意参谋的支付金额口径不同，不可直接互相印证。'],
      ['曝光', int(k.imp), '源自「展现量」，统计全部广告位的展现次数。'],
      ['点击量', int(k.click), '源自「点击量」，统计全部广告位的点击次数。'],
      ['成交订单数', int(k.orders), '源自「总成交笔数」，广告归因口径的成交笔数。'],
      ['投产比 ROI', f2(k.roi), '成交金额 ÷ 广告花费；表示每 1 元广告带来的归因成交金额。']
    ];
    heroKpi.forEach(function (x) {
      out.push('<div class="hero-kpi"><div class="hero-kpi-label"><span>' + x[0] + '</span>' + help(x[2]) + '</div><b>' + x[1] + '</b></div>');
    });
    out.push('</div>');        /* 关 .hero-kpis */
    out.push('</div>');        /* 关 .hero-inner */
    out.push('</section>');

    /* ── 01 数据洞察 ── */
    if (R.insights && R.insights.length) {
      out.push('<section class="section report-anchor" id="mod1">');
      out.push('<div class="section-title-row"><div class="section-no">01</div><div class="section-title">数据洞察</div></div>');
      out.push('<div class="insight-block">');
      R.insights.forEach(function (ins, i) {
        out.push('<div class="insight-box">');
        out.push('<div class="c-title">洞察' + '一二三四五'[i] + '：' + esc(ins.title) + '</div>');
        out.push('<ul class="c-points">');
        ins.points.forEach(function (p) { out.push('<li>' + esc(p) + '</li>'); });
        out.push('</ul></div>');
      });
      out.push('</div></section>');
    }

    /* ── 02 店铺总览：ROI ── */
    out.push('<section class="section report-anchor" id="mod2">');
    out.push('<div class="section-title-row"><div class="section-no">02</div><div class="section-title">店铺总览：ROI</div></div>');
    out.push('<div class="card"><div class="kpi-row">');
    [
      ['投产比 ROI', f2(k.roi), '成交金额 ÷ 广告花费。'],
      ['成交订单数', int(k.orders), '源自「总成交笔数」。'],
      ['加购数', int(k.carts), '直接购物车数 + 间接购物车数（次数口径，不等同于去重加购人数）。'],
      ['点击到加购率', pct2(k.cartRate * 100), '加购数 ÷ 点击量 × 100%。']
    ].forEach(function (x) {
      out.push('<div class="kpi-card"><div class="kpi-card-label"><span>' + x[0] + '</span>' + help(x[2]) + '</div><b>' + x[1] + '</b></div>');
    });
    out.push('</div>');

    /* 日趋势 */
    if (R.trend && R.trend.length > 1) {
      out.push('<div class="trend-block core-trend">');
      out.push('<div class="chart-title">效率趋势</div>');
      out.push('<div class="chart-wrap">');
      out.push(lineChart(R.trend.map(function (t) { return { label: t.d.slice(5), v: t.spend }; }), { money: true }));
      out.push('</div>');
      out.push('<div class="table-caption">花费日趋势（' + R.period.from + ' ~ ' + R.period.to + '）</div>');
      out.push('<div class="table-wrap"><table class="data-table sortable-table"><thead><tr>' +
        '<th>日期</th><th class="num">花费</th><th class="num">成交金额</th><th class="num">展现量</th>' +
        '<th class="num">点击量</th><th class="num">成交笔数</th><th class="num">ROI</th><th class="num">CTR</th>' +
        '<th class="num">CVR</th><th class="num">CPC</th></tr></thead><tbody>');
      R.trend.forEach(function (t) {
        out.push('<tr><td>' + esc(t.d) + '</td>' +
          '<td class="num">' + money(t.spend) + '</td>' +
          '<td class="num">' + money(t.gmv) + '</td>' +
          '<td class="num">' + int(t.imp) + '</td>' +
          '<td class="num">' + int(t.click) + '</td>' +
          '<td class="num">' + int(t.orders) + '</td>' +
          '<td class="num ' + roiCls(t.roi, k.roi) + '">' + f2(t.roi) + '</td>' +
          '<td class="num">' + pct2(t.ctr * 100) + '</td>' +
          '<td class="num">' + pct2(t.cvr * 100) + '</td>' +
          '<td class="num">' + money(t.cpc) + '</td></tr>');
      });
      out.push('<tr class="is-total"><td>总计</td><td class="num">' + money(k.spend) + '</td><td class="num">' + money(k.gmv) +
        '</td><td class="num">' + int(k.imp) + '</td><td class="num">' + int(k.click) + '</td><td class="num">' + int(k.orders) +
        '</td><td class="num">' + f2(k.roi) + '</td><td class="num">' + pct2(k.ctr * 100) + '</td><td class="num">' +
        pct2(k.cvr * 100) + '</td><td class="num">' + money(k.cpc) + '</td></tr>');
      out.push('</tbody></table></div>');
      out.push('<div class="glossary-note">比率类指标的总计按「合计分子 ÷ 合计分母」重算，不是各日简单相加。</div>');
      out.push('</div>');
    }

    /* 分营销场景下钻 */
    if (R.scenes && R.scenes.length > 1) {
      out.push('<div class="module-subhead">分营销场景下钻</div>');
      out.push('<div class="table-wrap"><table class="data-table sortable-table"><thead><tr>' +
        '<th>营销场景</th><th class="num">花费</th><th class="num">占比</th><th class="num">成交金额</th>' +
        '<th class="num">展现量</th><th class="num">点击量</th><th class="num">ROI</th><th class="num">CTR</th></tr></thead><tbody>');
      R.scenes.forEach(function (s) {
        out.push('<tr><td>' + esc(s.name) + '</td>' +
          '<td class="num">' + money(s.spend) + '</td>' +
          '<td class="num">' + pct1(s.spend / k.spend * 100) + '</td>' +
          '<td class="num">' + money(s.gmv) + '</td>' +
          '<td class="num">' + int(s.imp) + '</td>' +
          '<td class="num">' + int(s.click) + '</td>' +
          '<td class="num ' + roiCls(s.roi, k.roi) + '">' + f2(s.roi) + '</td>' +
          '<td class="num">' + pct2(s.ctr * 100) + '</td></tr>');
      });
      out.push('</tbody></table></div>');
    }
    out.push('</div></section>');

    /* ── 03 投放计划 ── */
    if (R.plan) {
      var P = R.plan;
      out.push('<section class="section report-anchor" id="modplan">');
      out.push('<div class="section-title-row"><div class="section-no">03</div><div class="section-title">投放计划：钱压在哪些计划上</div></div>');
      out.push('<div class="card">');
      out.push('<p class="section-intro">按渠道分组展示 ' + P.total + ' 个投放计划的表现，店铺整体 ROI ' + f2(k.roi) +
               '。渠道汇总会掩盖计划级差异，本模块用于定位同一渠道内部的效率落差与零成交漏损。</p>');
      out.push('<div class="kpi-row">');
      out.push('<div class="kpi-card"><div class="kpi-card-label"><span>计划总数</span></div><b>' + P.total + '</b>' +
               '<div class="mini-note">' + P.groups.length + ' 个渠道</div></div>');
      out.push('<div class="kpi-card"><div class="kpi-card-label"><span>有成交计划</span></div><b>' + P.withGmv + '</b>' +
               '<div class="mini-note">零成交 ' + P.zero + ' 个</div></div>');
      out.push('<div class="kpi-card"><div class="kpi-card-label"><span>零成交计划花费</span></div><b>' + money(P.zeroSpend) + '</b>' +
               '<div class="mini-note">占总花费 ' + pct1(P.zeroSpend / k.spend * 100) + '</div></div>');
      out.push('<div class="kpi-card"><div class="kpi-card-label"><span>计划 ROI 区间</span></div><b>' +
               (P.withGmv ? (f2(P.roiMin) + ' ~ ' + f2(P.roiMax)) : '—') + '</b>' +
               '<div class="mini-note">仅统计有成交计划</div></div>');
      out.push('</div>');

      /* 代表性计划 */
      if (P.reps && P.reps.length) {
        out.push('<div class="module-subhead">代表性计划投入产出对比 · ' + P.reps.length + '/' + P.total + ' 个</div>');
        out.push('<div class="roi-compare">');
        P.reps.forEach(function (r) {
          var it = r.item;
          out.push('<div class="roi-compare-row">');
          out.push('<div class="roi-compare-head"><span class="rc-tag ' +
                   (r.label === '高投入' || r.label === '规模化低 ROI' ? 'rc-tag-bad' : 'rc-tag-good') + '">' +
                   esc(r.label) + '</span>' +
                   '<span class="roi-compare-meta">' + esc(r.hint) + '</span></div>');
          out.push('<div class="roi-compare-meta">' + esc(shortName(it.name, 40)) + '（' + esc(it.scene || '—') + '）</div>');
          out.push('<div class="roi-compare-eff"><span>投产比 ROI</span><b>' + f2(it.roi) + '</b></div>');
          out.push('<div class="roi-compare-meta">花费 ' + money(it.spend) + ' · 成交金额 ' + money(it.gmv) +
                   ' · 曝光 ' + int(it.imp) + ' · 平均点击花费 ' + money(it.cpc) + '</div>');
          out.push('</div>');
        });
        out.push('</div>');
      }

      /* 按渠道折叠 */
      P.groups.forEach(function (g) {
        out.push('<details class="plan-group" open>');
        out.push('<summary class="plan-group-head"><span class="plan-group-name">' + esc(g.scene) + '</span>' +
                 '<span class="plan-group-meta">' + g.items.length + ' 个计划 · 花费 ' + money(g.spend) +
                 '（占 ' + pct1(g.share) + '） · ROI ' + f2(g.roi) + '</span></summary>');
        out.push('<div class="table-wrap"><table class="plan-table sortable-table"><thead><tr>' +
          '<th>计划名称</th><th>投放周期</th><th class="num">展现量</th><th class="num">点击量</th>' +
          '<th class="num">花费</th><th class="num">点击率</th><th class="num">平均点击花费</th>' +
          '<th class="num">成交金额</th><th class="num">成交笔数</th><th class="num">点击转化率</th>' +
          '<th class="num">投产比 ROI</th></tr></thead><tbody>');
        g.items.forEach(function (it) {
          out.push('<tr' + (it.gmv <= 0 ? ' class="is-zero"' : '') + '>' +
            '<td class="plan-name" title="' + esc(it.name) + '"><div>' + esc(shortName(it.name, 26)) + '</div>' +
            '<div class="entity-id">ID: ' + esc(it.id) + '</div></td>' +
            '<td class="plan-period"><div class="plan-period-range">' + esc(it.period) + '</div>' +
            '<div class="plan-period-days">共 ' + it.dayCount + ' 天</div></td>' +
            '<td class="num">' + int(it.imp) + '</td>' +
            '<td class="num">' + int(it.click) + '</td>' +
            '<td class="num">' + money(it.spend) + '</td>' +
            '<td class="num">' + pct2(it.ctr * 100) + '</td>' +
            '<td class="num">' + money(it.cpc) + '</td>' +
            '<td class="num">' + money(it.gmv) + '</td>' +
            '<td class="num">' + int(it.orders) + '</td>' +
            '<td class="num">' + pct2(it.cvr * 100) + '</td>' +
            '<td class="num ' + roiCls(it.roi, k.roi) + '">' + f2(it.roi) + '</td></tr>');
        });
        out.push('<tr class="is-total"><td>合计</td><td></td><td class="num">' + int(g.items.reduce(function (a, x) { return a + x.imp; }, 0)) +
          '</td><td class="num">' + int(g.items.reduce(function (a, x) { return a + x.click; }, 0)) +
          '</td><td class="num">' + money(g.spend) + '</td><td></td><td></td>' +
          '<td class="num">' + money(g.gmv) + '</td><td class="num">' +
          int(g.items.reduce(function (a, x) { return a + x.orders; }, 0)) + '</td><td></td>' +
          '<td class="num">' + f2(g.roi) + '</td></tr>');
        out.push('</tbody></table></div></details>');
      });
      out.push('</div></section>');
    }

    /* ── 04 预算错配 ── */
    if (R.prod && R.prod.mismatch && R.prod.mismatch.length) {
      out.push('<section class="section report-anchor" id="mod3">');
      out.push('<div class="section-title-row"><div class="section-no">04</div><div class="section-title">预算错配：钱花在哪 vs 钱赚在哪</div></div>');
      out.push('<div class="card">');
      out.push('<p class="section-intro"><b>错配度 = 花费占比 − 成交金额占比</b>。' +
               '<span class="neg">负得越多越好</span>：少花钱多出货，值得加投；' +
               '<span class="pos">正得越多越差</span>：钱花出去没换回相应产出。</p>');
      out.push('<div class="table-wrap"><table class="data-table sortable-table"><thead><tr>' +
        '<th>商品</th><th class="num">花费</th><th class="num">花费占比</th><th class="num">成交金额</th>' +
        '<th class="num">成交占比</th><th class="num">错配度</th><th class="num">ROI</th></tr></thead><tbody>');
      R.prod.mismatch.slice(0, 20).forEach(function (m) {
        out.push('<tr><td class="product-cell" title="' + esc(m.name) + '"><div class="product-cell-main">' +
          esc(shortName(m.name, 30)) + '</div><div class="entity-id">ID: ' + esc(m.id) + '</div></td>' +
          '<td class="num">' + money(m.spend) + '</td>' +
          '<td class="num">' + pct1(m.spendPct) + '</td>' +
          '<td class="num">' + money(m.gmv) + '</td>' +
          '<td class="num">' + pct1(m.gmvPct) + '</td>' +
          '<td class="num ' + (m.diff < 0 ? 'good-cell' : 'bad-cell') + '">' + pp(m.diff) + '</td>' +
          '<td class="num ' + roiCls(m.roi, k.roi) + '">' + f2(m.roi) + '</td></tr>');
      });
      out.push('</tbody></table></div>');
      out.push('<div class="glossary-note">按 |错配度| 从大到小排前 20 个商品。</div>');
      out.push('</div></section>');
    }

    /* ── 05 商品维度：四象限 ── */
    if (R.prod && R.prod.quad) {
      var q = R.prod.quad;
      out.push('<section class="section report-anchor" id="mod4">');
      out.push('<div class="section-title-row"><div class="section-no">05</div><div class="section-title">商品维度：谁该加钱，谁该停</div></div>');
      out.push('<div class="card">');
      out.push('<p class="section-intro">按「有花费且有成交」的商品集合<b>中位数</b>划分四象限：' +
               '花费中位数 ' + money(R.prod.medSpend) + '，ROI 中位数 ' + f2(R.prod.medRoi) + '。</p>');
      out.push('<div class="kpi-row">');
      [['高投入 / 高 ROI', q.hh, '加量'], ['高投入 / 低 ROI', q.hl, '压降'],
       ['低投入 / 高 ROI', q.lh, '加钱测试'], ['低投入 / 低 ROI', q.ll, '观察']].forEach(function (x) {
        out.push('<div class="kpi-card"><div class="kpi-card-label"><span>' + x[0] + '</span></div><b>' + x[1].length + '</b>' +
                 '<div class="mini-note">' + x[2] + '</div></div>');
      });
      out.push('</div>');
      [['高投入 / 低 ROI（优先压降）', q.hl, 'bad'], ['低投入 / 高 ROI（值得加钱）', q.lh, 'good'],
       ['高投入 / 高 ROI（保持）', q.hh, 'neutral']].forEach(function (x) {
        if (!x[1].length) return;
        out.push('<div class="module-subhead">' + x[0] + ' · ' + x[1].length + ' 个</div>');
        out.push('<div class="table-wrap"><table class="data-table"><thead><tr>' +
          '<th>商品</th><th class="num">花费</th><th class="num">成交金额</th><th class="num">ROI</th>' +
          '<th class="num">展现量</th><th class="num">点击量</th></tr></thead><tbody>');
        x[1].slice(0, 10).forEach(function (p) {
          out.push('<tr><td class="product-cell" title="' + esc(p.name) + '">' + esc(shortName(p.name, 30)) + '</td>' +
            '<td class="num">' + money(p.spend) + '</td><td class="num">' + money(p.gmv) + '</td>' +
            '<td class="num ' + roiCls(p.roi, k.roi) + '">' + f2(p.roi) + '</td>' +
            '<td class="num">' + int(p.imp) + '</td><td class="num">' + int(p.click) + '</td></tr>');
        });
        out.push('</tbody></table></div>');
      });
      out.push('</div></section>');
    }

    /* ── 06 关键词 ── */
    if (R.kw) {
      var K = R.kw;
      out.push('<section class="section report-anchor" id="modkw">');
      out.push('<div class="section-title-row"><div class="section-no">06</div><div class="section-title">关键词维度：哪些词在花钱，哪些词在出货</div></div>');
      out.push('<div class="card">');
      out.push('<p class="section-intro">共 ' + K.total + ' 个词对象，其中 ' + K.withGmv + ' 个有成交。' +
               '关键词报表只覆盖关键词推广场景，是与营销场景平行的观察投影，不与全店花费相加。</p>');
      out.push('<div class="kpi-row">');
      out.push('<div class="kpi-card"><div class="kpi-card-label"><span>关键词数</span></div><b>' + K.total + '</b>' +
               '<div class="mini-note">含关键词与词包</div></div>');
      out.push('<div class="kpi-card"><div class="kpi-card-label"><span>有成交词数</span></div><b>' + K.withGmv + '</b>' +
               '<div class="mini-note">占 ' + pct1(K.total ? K.withGmv / K.total * 100 : 0) + '</div></div>');
      out.push('<div class="kpi-card"><div class="kpi-card-label"><span>零成交词花费</span></div><b>' + money(K.zeroSpend) + '</b>' +
               '<div class="mini-note">' + K.zeroCount + ' 个词有花费无成交</div></div>');
      out.push('<div class="kpi-card"><div class="kpi-card-label"><span>零成交词点击</span></div><b>' + int(K.zeroClick) + '</b>' +
               '<div class="mini-note">白花的点击</div></div>');
      out.push('</div>');

      if (K.types && K.types.length) {
        out.push('<div class="module-subhead">词类型花费占比</div>');
        out.push('<div class="kw-share">');
        K.types.forEach(function (t) {
          out.push('<div class="kw-share-row"><i>' + esc(t.type) + '</i>' +
                   '<span class="kw-share-pct">' + pct1(t.pct) + '</span></div>');
        });
        out.push('</div>');
      }

      /* 明细表 */
      out.push('<div class="module-subhead">词明细 · 按花费倒序</div>');
      out.push('<div class="table-wrap"><table class="data-table sortable-table"><thead><tr>' +
        '<th>词 / 词包</th><th>类型</th><th class="num">展现量</th><th class="num">点击量</th><th class="num">花费</th>' +
        '<th class="num">点击率</th><th class="num">平均点击花费</th><th class="num">成交金额</th>' +
        '<th class="num">成交笔数</th><th class="num">ROI</th></tr></thead><tbody>');
      K.items.slice(0, 60).forEach(function (it) {
        out.push('<tr' + (it.gmv <= 0 && it.spend > 0 ? ' class="is-zero"' : '') + '>' +
          '<td class="plan-name" title="' + esc(it.name) + '">' + esc(shortName(it.name, 26)) + '</td>' +
          '<td>' + esc(it.type || '—') + '</td>' +
          '<td class="num">' + int(it.imp) + '</td><td class="num">' + int(it.click) + '</td>' +
          '<td class="num">' + money(it.spend) + '</td><td class="num">' + pct2(it.ctr * 100) + '</td>' +
          '<td class="num">' + money(it.cpc) + '</td><td class="num">' + money(it.gmv) + '</td>' +
          '<td class="num">' + int(it.orders) + '</td>' +
          '<td class="num ' + roiCls(it.roi, k.roi) + '">' + f2(it.roi) + '</td></tr>');
      });
      out.push('</tbody></table></div>');
      if (K.items.length > 60) {
        out.push('<div class="glossary-note">共 ' + K.items.length + ' 个词对象，此处按花费展示前 60 个。完整明细见「经营分析 → 店铺推广」。</div>');
      }
      out.push('</div></section>');
    }

    /* ── 07 人群 ── */
    if (R.crowd && R.crowd.items.length) {
      var W = R.crowd;
      out.push('<section class="section report-anchor" id="modcrowd">');
      out.push('<div class="section-title-row"><div class="section-no">07</div><div class="section-title">人群维度：钱花在拉新还是复购</div></div>');
      out.push('<div class="card">');
      out.push('<p class="section-intro">人群定向覆盖 ' + money(W.spend) + ' 花费（占全店花费 ' + pct1(W.share) +
               '），其余为无人群定向的流量；人群层 ROI ' + f2(W.roi) +
               '。人群报表是与营销场景平行的观察投影，不与全店花费相加。</p>');
      out.push('<div class="kpi-row">');
      out.push('<div class="kpi-card"><div class="kpi-card-label"><span>人群包数</span></div><b>' + W.total + '</b>' +
               '<div class="mini-note">有展现或花费的人群</div></div>');
      out.push('<div class="kpi-card"><div class="kpi-card-label"><span>人群覆盖花费</span></div><b>' + money(W.spend) + '</b>' +
               '<div class="mini-note">占全店花费 ' + pct1(W.share) + '</div></div>');
      out.push('<div class="kpi-card"><div class="kpi-card-label"><span>新客成交占比</span></div><b>' + pct1(W.newRatio * 100) + '</b>' +
               '<div class="mini-note">人群层成交新客占比</div></div>');
      out.push('<div class="kpi-card"><div class="kpi-card-label"><span>人群 ROI 区间</span></div><b>' +
               (W.roiMax ? (f2(W.roiMin) + ' ~ ' + f2(W.roiMax)) : '—') + '</b>' +
               '<div class="mini-note">仅统计有成交人群</div></div>');
      out.push('</div>');
      out.push('<div class="table-wrap"><table class="data-table sortable-table"><thead><tr>' +
        '<th>人群</th><th class="num">花费</th><th class="num">占比</th><th class="num">展现量</th>' +
        '<th class="num">点击量</th><th class="num">成交金额</th><th class="num">成交笔数</th>' +
        '<th class="num">ROI</th><th class="num">加购数</th></tr></thead><tbody>');
      W.items.forEach(function (it) {
        out.push('<tr><td title="' + esc(it.name) + '">' + esc(shortName(it.name, 24)) + '</td>' +
          '<td class="num">' + money(it.spend) + '</td><td class="num">' + pct1(it.share) + '</td>' +
          '<td class="num">' + int(it.imp) + '</td><td class="num">' + int(it.click) + '</td>' +
          '<td class="num">' + money(it.gmv) + '</td><td class="num">' + int(it.orders) + '</td>' +
          '<td class="num ' + roiCls(it.roi, k.roi) + '">' + f2(it.roi) + '</td>' +
          '<td class="num">' + int(it.carts) + '</td></tr>');
      });
      out.push('</tbody></table></div>');
      out.push('</div></section>');
    }

    /* ── 08 行动清单 ── */
    if (R.actions && R.actions.length) {
      out.push('<section class="section report-anchor" id="modact">');
      out.push('<div class="section-title-row"><div class="section-no">08</div><div class="section-title">行动清单</div></div>');
      out.push('<div class="card">');
      out.push('<ol class="act-list">');
      R.actions.forEach(function (a, i) {
        var cls = a.level === 'high' ? 'act-p0' : (a.level === 'mid' ? 'act-p1' : 'act-p2');
        var lbl = a.level === 'high' ? 'P0' : (a.level === 'mid' ? 'P1' : 'P2');
        out.push('<li class="act-item"><div class="act-flag ' + cls + '">' + lbl + '</div>' +
          '<div class="act-body"><div class="act-title">' + esc(a.title) + '</div>' +
          '<div class="act-desc">' + esc(a.detail) + '</div></div></li>');
      });
      out.push('</ol>');
      out.push('</div></section>');
    }

    return out.join('\n');
  }

  var api = { renderReport: renderReport };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.WBReportRender = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
(function(){
  'use strict';
  var APP = 'promo';
  var root = document.getElementById('reportRoot');
  var srcBox = document.getElementById('rpSrc');
  var picker = document.getElementById('srcPicker');
  var spTables = document.getElementById('spTables');
  var periodEl = document.getElementById('rpPeriod');
  var printBtn = document.getElementById('rpPrint');
  var rpToc = document.getElementById('rpToc');
  var rpTocTrack = document.getElementById('rpTocTrack');
  printBtn.addEventListener('click', function(){ window.print(); });

  /* 维度中文名（跟引擎的 classifySheet 返回值对应） */
  var KIND_NAME = { plan:'投放计划', kw:'关键词', crowd:'人群', prod:'商品', scene:'营销场景' };

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtTime(iso){
    var d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    function p(n){ return String(n).padStart(2,'0'); }
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }
  function rowsOf(sh){ return (sh && sh.rows && sh.rows.length) || 0; }

  /* ★★★ 把**所有**数据源的表合并起来一起分析（2026-09-20 改）
     用户的真实用法：把同一批数据的多个维度**导成多个文件**
     （计划报表.csv / 关键词报表.csv / 商品报表.csv / 人群报表.csv / 营销场景报表.csv），
     这些要一起进引擎才能出一份完整报告 —— 之前做成「下拉单选」是理解错了需求。
     去重规则：同一个维度只取**最新上传**的那份（sources 已按上传时间倒序，
     防止重复导出累积成重复数据）。 */
  function collectSheets(sources){
    var seen = {}, used = [];
    sources.forEach(function(s){
      (s.sheets || []).forEach(function(sh){
        var kind = null;
        try{ kind = WBReportEngine.classifySheet(sh); }catch(e){}
        var key = kind || ('sheet:' + sh.name);
        if(seen[key]) return;
        seen[key] = 1;
        used.push({ kind: kind, key: key, sheet: sh, from: s.name, at: s.uploadedAt });
      });
    });
    return used;
  }

  function empty(msg, hintHtml){
    root.innerHTML =
      '<section class="hero report-anchor"><div class="hero-left">' +
      '<div class="product-title">付费推广分析</div>' +
      '<div class="meta">这一页会根据你上传的推广数据自动生成分析报告</div>' +
      '</div></section>' +
      '<section class="section"><div class="card" style="padding:44px 24px;text-align:center;">' +
      '<div style="font-size:15px;font-weight:600;margin-bottom:10px;">' + esc(msg) + '</div>' +
      '<div style="color:var(--muted);font-size:13.5px;line-height:1.9;">' + hintHtml + '</div>' +
      '</div></section>';
  }
  var LINK_PROMO = '<a href="店铺推广.html" style="color:var(--primary);text-decoration:underline;">经营分析 → 店铺推广</a>';
  var HINT_NO_DATA = '请先到 ' + LINK_PROMO +
    ' 上传淘宝「店铺推广数据汇总」导出的表格（Excel 或 CSV，<b>多个文件可以一起传</b>），<br>回来这里就能看到完整分析报告。';
  var HINT_BAD_DATA = '这些文件里没有找到推广口径的数据表（需要「投放计划 / 关键词 / 商品 / 人群 / 营销场景」这类表）。<br>' +
    '请确认上传的是淘宝「店铺推广数据汇总」导出的文件。也可以到 ' + LINK_PROMO + ' 核对一下。';

  /* 口径提示：点「?」展开 —— DOM 是动态生成的，所以用事件委托 */
  document.addEventListener('click', function(ev){
    var btn = ev.target.closest ? ev.target.closest('.metric-help') : null;
    var opened = document.querySelectorAll('.metric-help[aria-expanded="true"]');
    if(btn){
      var wasOn = btn.getAttribute('aria-expanded') === 'true';
      opened.forEach(function(b){ b.setAttribute('aria-expanded','false'); });
      if(!wasOn) btn.setAttribute('aria-expanded','true');
      ev.stopPropagation();
      return;
    }
    opened.forEach(function(b){ b.setAttribute('aria-expanded','false'); });
  });

  function renderSourceBar(used){
    if(!used.length){ picker.hidden = true; return; }
    picker.hidden = false;
    var total = used.reduce(function(a, x){ return a + rowsOf(x.sheet); }, 0);
    var parts = used.map(function(x){
      var label = x.kind ? KIND_NAME[x.kind] : x.sheet.name;
      return '<span class="sp-tag">' + esc(label) + '<i>' + rowsOf(x.sheet).toLocaleString('en-US') + '</i></span>';
    });
    spTables.innerHTML = parts.join('') +
      '<span class="sp-sum">合并分析 ' + used.length + ' 张表 · 共 ' +
      total.toLocaleString('en-US') + ' 行</span>';
  }

  function render(){
    var used = collectSheets(sources);
    if(!used.length){
      empty('还没有推广数据', HINT_NO_DATA);
      picker.hidden = true;
      if(periodEl) periodEl.textContent = '暂无数据';
      return;
    }

    var sheets = used.map(function(x){ return x.sheet; });
    var R = null;
    try{ R = WBReportEngine.analyzeReport(sheets); }
    catch(e){ console.error('分析失败', e); empty('分析时出错：' + (e && e.message), HINT_BAD_DATA); return; }
    if(!R){ empty('这些数据算不出报告', HINT_BAD_DATA); return; }

    var first = used[0];
    root.innerHTML = WBReportRender.renderReport(R, { fileName: used.map(function(x){ return x.from; }).join('、') });
    renderSourceBar(used);
    if(periodEl){
      periodEl.textContent = R.period.from + ' ~ ' + R.period.to + '（' + R.period.days + ' 天）';
    }

    srcBox.hidden = false;
    srcBox.innerHTML =
      '<b>数据来源</b>：' + used.length + ' 个文件合并分析（' +
      used.map(function(x){ return esc(x.from); }).join('、') + '）' +
      '<br>覆盖维度：' + esc(R.coverage.join(' / ')) +
      ' · 分析周期 ' + esc(R.period.from) + ' ~ ' + esc(R.period.to) + '（' + R.period.days + ' 天）' +
      ' · 最近上传 ' + esc(fmtTime(first.at)) +
      '<br>报告由本机根据原始表格实时计算生成，不调用任何模型；' +
      '原始表格可在 ' + '<a href="店铺推广.html">经营分析 → 店铺推广</a> 里查看与更新。';
  }

  var sources = [];
  function load(){
    fetch('/api/backup?app=' + APP, { cache: 'no-store' })
      .then(function(r){ return r.status === 204 ? null : r.json(); })
      .then(function(j){
        sources = (j && j.sources) || [];
        if(!sources.length){ empty('还没有推广数据', HINT_NO_DATA); picker.hidden = true; return; }
        render();
      })
      .catch(function(e){
        console.error(e);
        empty('读取数据失败：' + (e && e.message), HINT_NO_DATA);
      });
  }

  /* ═══════════ 报告目录（吸顶导航）═══════════
     2026-09-22：报告约 10 屏且无任何内部跳转 → 加目录。
     设计要点：
     1) 目录项**从 DOM 反推**（扫描 .section-title-row），不是写死的数组 →
        模块随数据缺失而消失时目录自动同步，杜绝死链。
     2) 当前章节高亮：统一用「最后一个标题越过吸顶线下沿」的算法
        （scroll 事件实现；不用 IntersectionObserver —— 多节同时可见时
         它的回调顺序不稳定，反而会闪）。
     3) 点击目录项平滑滚动；目标 section 已有 .report-anchor，配合 CSS scroll-margin-top
        避开吸顶条遮挡。吸顶条高度由 JS 写进 --toc-h / --topbar-h，不写死像素。 */

  /* 收集「章节」：每个 .section-title-row 属于哪个 section */
  function collectToc(){
    var items = [];
    var rows = root.querySelectorAll('.section-title-row');
    Array.prototype.forEach.call(rows, function(row){
      var sec = row.closest('section');
      if(!sec) return;
      var no = row.querySelector('.section-no');
      var title = row.querySelector('.section-title');
      if(!sec.id) sec.id = 'autosec-' + items.length;
      items.push({
        id: sec.id,
        no: no ? no.textContent.trim() : '',
        title: title ? title.textContent.trim() : sec.id,
        el: sec
      });
    });
    return items;
  }

  var tocItems = [], tocActive = -1;

  function buildToc(){
    tocItems = collectToc();
    if(tocItems.length < 2){ rpToc.hidden = true; return; }  /* 只有 1 节就没必要做目录 */

    rpToc.hidden = false;
    rpTocTrack.innerHTML = tocItems.map(function(it){
      /* 目录标签取标题冒号前的主干（如「店铺总览：ROI」→「店铺总览」），太长会撑爆吸顶条 */
      var short = it.title.split(/[：:（(]/)[0].slice(0, 10);
      return '<button class="rp-toc-item" type="button" data-toc="' + it.id + '"' +
        ' title="' + esc(it.title) + '">' +
        (it.no ? '<em>' + esc(it.no) + '</em>' : '') +
        '<span>' + esc(short) + '</span></button>';
    }).join('');
  }

  function setTocActive(idx){
    if(idx === tocActive || idx < 0) return;
    tocActive = idx;
    var nodes = rpTocTrack.querySelectorAll('.rp-toc-item');
    Array.prototype.forEach.call(nodes, function(n, i){
      n.classList.toggle('is-active', i === idx);
    });
    /* 让当前项始终露在吸顶条视野内（目录项多时横向滚动） */
    var cur = nodes[idx];
    if(cur && cur.scrollIntoView){
      try{ cur.scrollIntoView({ block:'nearest', inline:'nearest' }); }catch(e){}
    }
  }

  /* 吸顶条实际高度 → 写进 CSS 变量，给 scroll-margin-top 用，避免写死像素 */
  function syncTocHeight(){
    var bar = document.querySelector('.rp-topbar');
    var tb = bar ? Math.round(bar.getBoundingClientRect().height) : 56;
    document.documentElement.style.setProperty('--topbar-h', tb + 'px');
    var h = rpToc.hidden ? 0 : Math.round(rpToc.getBoundingClientRect().height);
    document.documentElement.style.setProperty('--toc-h', h + 'px');
  }

  function tocScrollHandler(){
    /* ★ 判定「当前章节」的规则（2026-09-22 修）：
       取「最后一个 顶部已越过判定线 的章节」，判定线 = 两条吸顶条下沿 + 一点余量。
       早先版本用 `top - barH <= 0` 且余量只给 4px → 点击跳转后目标章节的 top
       刚好落在 121px（略低于 111px 的条高），**差几像素就判给了上一节**；
       滚到底时最后一节也可能因高度不足而永远点不亮。所以：
       ① 余量放宽到 24px（给平滑滚动的落点误差留空间）；
       ② **到底强制选中最后一节** —— 页面已滚到底就没有「下一节」可切了。 */
    var margin = (rpToc.getBoundingClientRect().height +
                  (document.querySelector('.rp-topbar') ? document.querySelector('.rp-topbar').getBoundingClientRect().height : 56) + 24);
    var atBottom = window.pageYOffset + window.innerHeight >= document.body.scrollHeight - 4;
    if(atBottom){ setTocActive(tocItems.length - 1); return; }
    var best = 0;
    for(var i = 0; i < tocItems.length; i++){
      if(tocItems[i].el.getBoundingClientRect().top <= margin) best = i;
    }
    setTocActive(best);
  }

  function setupToc(){
    buildToc();
    syncTocHeight();
    if(rpToc.hidden) return;

    /* 点击跳转 */
    rpTocTrack.addEventListener('click', function(ev){
      var btn = ev.target.closest ? ev.target.closest('.rp-toc-item') : null;
      if(!btn) return;
      var id = btn.getAttribute('data-toc');
      var target = document.getElementById(id);
      if(!target) return;
      var off = rpToc.getBoundingClientRect().height +
                (document.querySelector('.rp-topbar') ? document.querySelector('.rp-topbar').getBoundingClientRect().height : 56) + 10;
      var top = target.getBoundingClientRect().top + window.pageYOffset - off;
      window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
      /* 立即高亮，不等滚动事件（否则平滑滚动期间高亮会来回跳） */
      var idx = -1;
      tocItems.forEach(function(it, i){ if(it.id === id) idx = i; });
      setTocActive(idx);
    });

    window.addEventListener('scroll', tocScrollHandler, { passive: true });
    window.addEventListener('resize', function(){ syncTocHeight(); tocScrollHandler(); });
    tocScrollHandler();
  }

  /* render() 里生成完 innerHTML 后调用 */
  var _renderInner = render;
  render = function(){
    _renderInner();
    try{ setupToc(); }catch(e){ console.warn('目录生成失败（不影响正文）', e); rpToc.hidden = true; }
  };

  load();
})();
</script>
<script src="mobile-adapter.js"></script>
</body>
</html>
