<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运营工作台悬浮球</title>
<style>
  :root{
    --fab-ai-bg:linear-gradient(145deg,#FFA45C 0%,#F97316 55%,#E4660A 100%);
    --fab-glow:rgba(249,115,22,.42);
    --card-bg:rgba(255,255,255,.96);
    --card-border:rgba(249,115,22,.16);
    --ink:#2B2B2B; --ink-2:#7A7A7A; --line:rgba(0,0,0,.07);
    --orange:#F97316; --blue:#3B82F6; --red:#EF4444;
  }
  *{ box-sizing:border-box; }
  /* hidden 必须显式 !important：.ball/.badge 等作者样式设了 display:flex/inline，
     会盖掉 UA 默认的 [hidden]{display:none}，把一个球 hidden 后仍会显示（两个球挤在 80px 窗口里被压成椭圆）。 */
  [hidden]{ display:none !important; }
  html,body{ margin:0; padding:0; background:transparent; overflow:hidden; }
  body{ width:100vw; height:100vh; }
  .wrap{
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center;
    padding-top:12px;
  }
  .ball{
    position:relative; width:56px; height:56px; border-radius:50%;
    background:var(--fab-ai-bg); color:#fff; border:none; cursor:grab; outline:none;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    box-shadow:0 6px 16px var(--fab-glow), 0 2px 6px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.34);
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  .ball:hover{ transform:scale(1.05); }
  .ball:active{ cursor:grabbing; transform:scale(.96); }
  .ball svg{ width:26px; height:26px; display:block; }
  .fab-label{ font-size:15px; font-weight:700; letter-spacing:1px; line-height:1; }
  .todo.idle{ opacity:.55; }
  .badge, .doing{
    position:absolute; top:-4px; min-width:20px; height:20px; padding:0 5px;
    border-radius:999px; color:#fff; font-size:11.5px; font-weight:700;
    line-height:20px; text-align:center; box-shadow:0 0 0 2px #fff; pointer-events:none;
  }
  .badge{ right:-4px; background:#F97316; }
  .doing{ left:-4px; background:#3B82F6; }
  .badge[hidden], .doing[hidden]{ display:none; }

  /* ---- 展开的卡片 ---- */
  .card{
    display:none; width:272px; margin-top:10px; flex:1 1 auto; overflow:hidden;
    background:var(--card-bg); border:1px solid var(--card-border);
    border-radius:14px; box-shadow:0 14px 34px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.10);
    flex-direction:column; color:var(--ink);
  }
  body.expanded .card{ display:flex; }
  .card-head{
    display:flex; align-items:center; gap:8px; padding:11px 14px 9px;
    border-bottom:1px solid var(--line); font-size:13.5px; font-weight:700;
  }
  .card-head .dot{ width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .card-head .sub{ margin-left:auto; font-weight:500; font-size:11.5px; color:var(--ink-2); }
  .card-head .close{
    margin-left:6px; border:none; background:none; color:var(--ink-2);
    font-size:16px; line-height:1; cursor:pointer; padding:0 3px; border-radius:6px;
  }
  .card-head .close:hover{ background:rgba(0,0,0,.06); color:var(--ink); }
  .card-body{ flex:1 1 auto; overflow-y:auto; padding:6px 0; }

  /* 待办列表 */
  .titem{
    display:flex; align-items:flex-start; gap:9px; padding:9px 14px;
    border-bottom:1px solid var(--line); font-size:12.5px; line-height:1.45; cursor:pointer;
  }
  .titem:last-child{ border-bottom:none; }
  .titem:hover{ background:rgba(249,115,22,.05); }
  .titem .pri{ width:8px; height:8px; border-radius:50%; margin-top:4px; flex:0 0 auto; }
  .titem .pri.p1{ background:var(--red); } .titem .pri.p2{ background:var(--orange); }
  .titem .pri.p3{ background:var(--blue); } .titem .pri.p4{ background:#D1D5DB; }
  .titem .mt{ flex:1 1 auto; min-width:0; }
  .titem .tt{ font-weight:600; word-break:break-word; }
  .titem .em{ color:var(--red); font-size:11px; font-weight:700; margin-left:4px; }
  .titem .dd{ font-size:11px; color:var(--ink-2); margin-top:2px; }
  .titem .tag{ flex:0 0 auto; font-size:10.5px; padding:1px 7px; border-radius:999px; color:#fff; }
  .titem .tag.doing{ background:var(--blue); }
  .empty{
    padding:26px 16px; text-align:center; color:var(--ink-2); font-size:12.5px;
  }
  .empty b{ display:block; color:var(--ink); font-size:13px; margin-bottom:4px; }

  /* AI 快捷入口 */
  .ai-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; padding:12px; }
  .ai-item{
    display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 6px;
    border:1px solid var(--line); border-radius:11px; background:#fff; cursor:pointer;
    font-size:11.5px; color:var(--ink); transition:background .12s, transform .08s;
  }
  .ai-item:hover{ background:rgba(249,115,22,.06); border-color:var(--card-border); transform:translateY(-1px); }
  .ai-item svg{ width:22px; height:22px; }
  .ai-foot{
    padding:9px 12px; border-top:1px solid var(--line);
    text-align:center; font-size:11.5px; color:var(--ink-2);
  }
  .ai-foot b{ color:var(--orange); cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ball ai" id="aiBall" role="button" tabindex="0" title="AI 助手" aria-label="AI 助手" data-tauri-drag-region>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/>
      <path d="M8.5 12.5h.01M12 12.5h.01M15.5 12.5h.01"/>
    </svg>
  </div>
  <div class="ball todo" id="todoBall" role="button" tabindex="0" title="待办事项" aria-label="待办事项" data-tauri-drag-region>
    <span class="fab-label">待办</span>
    <span class="badge" id="todoBadge" hidden>0</span>
    <span class="doing" id="todoDoing" hidden>0</span>
  </div>

  <!-- 待办球展开卡片 -->
  <div class="card" id="todoCard">
    <div class="card-head">
      <span class="dot" style="background:var(--orange)"></span>今日待办
      <span class="sub" id="todoCardSub"></span>
      <button class="close" title="收起">✕</button>
    </div>
    <div class="card-body" id="todoCardBody"></div>
  </div>

  <!-- AI 球展开卡片 -->
  <div class="card" id="aiCard">
    <div class="card-head">
      <span class="dot" style="background:var(--orange)"></span>AI 助手
      <button class="close" title="收起">✕</button>
    </div>
    <div class="ai-grid">
      <div class="ai-item" data-go="ai-main">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
        AI 对话
      </div>
      <div class="ai-item" data-go="ai-ask">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4h5l3 3v13a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1V7z"/><path d="M9.5 4v3h5v-3M9 14l2 2 4-4"/></svg>
        问大家
      </div>
      <div class="ai-item" data-go="ai-todo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        智能待办
      </div>
      <div class="ai-item" data-go="ai-report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-5"/><path d="M19 9V6h-3"/></svg>
        经营总结
      </div>
    </div>
    <div class="ai-foot">打开完整 <b data-go="ai-main">AI 面板</b></div>
  </div>
</div>
<script>
(function(){
  var hasTauri = !!(window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke);
  var which = ((location.search.match(/[?&]which=([^&]+)/) || [])[1] || 'ai').toLowerCase();
  var aiBall = document.getElementById('aiBall');
  var todoBall = document.getElementById('todoBall');
  var badge = document.getElementById('todoBadge');
  var doing = document.getElementById('todoDoing');
  var card = null, bodyEl = document.getElementById('todoCardBody');

  var CARD_W = 272;
  var TODO_H = 348, AI_H = 272;
  var BASE_H = 80;  /* 收起时窗口包含球(56)+上边距 */

  if(which === 'todo'){
    if(aiBall) aiBall.hidden = true;
    card = document.getElementById('todoCard');
  } else {
    if(todoBall) todoBall.hidden = true;
    which = 'ai';
    card = document.getElementById('aiCard');
  }

  function invoke(cmd, args){ return window.__TAURI__.core.invoke(cmd, args || {}); }
  function taWin(){ try{ return window.__TAURI__.window.getCurrentWindow(); }catch(e){ return null; } }

  /* 输入法：全部文本就地生成，无任何外部输入 → 无需防注入，仅负责展示 */

  /* 单击展开 / 双击直达 —— 用 mousedown/up 完成拖动与点击语义区分 */
  var downX=0, downY=0, downT=0, dragStarted=false, lastClickT=0;

  function openMain(){
    refresh();
    if(hasTauri){ invoke('fab_action', { action: which }).catch(function(){}); }
    else { try{ window.open('/工作台.html', '_blank'); }catch(e){} }
  }

  function expand(){
    document.body.classList.add('expanded');
    if(which === 'todo') loadTodoCard();
    var h = which==='todo' ? TODO_H : AI_H;
    resizeWin(CARD_W, h);
  }
  function collapse(){
    document.body.classList.remove('expanded');
    resizeWin(80, BASE_H);
    dragReset();
  }
  function resizeWin(w, h){
    var win = taWin();
    if(!win) return;
    try{
      var L = window.__TAURI__.window.LogicalSize;
      win.setSize(new L(w, h)).catch(function(){});
    }catch(e){}
  }
  function dragReset(){ var el = which==='todo'? todoBall : aiBall; if(el) el.style.cursor='grab'; }

  var currentBall = which === 'todo' ? todoBall : aiBall;

  currentBall.addEventListener('mousedown', function(e){
    if(e.button !== 0) return;
    downX=e.clientX; downY=e.clientY; downT=Date.now(); dragStarted=false;
    var el = currentBall;
    var move = function(ev){
      if(dragStarted) return;
      var dx=Math.abs(ev.clientX-downX), dy=Math.abs(ev.clientY-downY);
      if(dx<6 && dy<6) return;
      dragStarted=true;
      if(hasTauri){ try{ invoke('plugin:window|start_dragging'); }catch(err){} el.style.cursor='grabbing'; }
    };
    var up = function(ev){
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      if(dragStarted){ dragReset(); return; }   /* 拖了就不算点击 */
      handleClick();
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });

  function handleClick(){
    var nowTime = Date.now();
    var expanded = document.body.classList.contains('expanded');
    if(expanded){
      /* 已展开：单击收起 */
      collapse();
      lastClickT = 0;
      return;
    }
    if(lastClickT && nowTime - lastClickT <= 330){
      /* 双击：直达主面板 */
      lastClickT = 0;
      openMain();
      return;
    }
    lastClickT = nowTime;
    setTimeout(function(){ if(lastClickT && (Date.now()-lastClickT)>350) lastClickT=0; }, 400);
    expand();
  }

  /* 卡片内收起按钮 */
  var closes = card ? card.querySelectorAll('.close') : [];
  closes.forEach(function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); collapse(); }); });

  /* Esc 收起 */
  document.body.addEventListener('keydown', function(e){
    if(e.key === 'Escape') collapse();
  });

  /* AI 卡快捷项 → 直达对应页面 */
  if(card) card.querySelectorAll('[data-go]').forEach(function(el){
    el.addEventListener('click', function(e){
      var go = el.getAttribute('data-go');
      openMain();  /* 目前统一打开主面板；未来可细分目标页 */
    });
  });

  /* 待办卡片内容 */
  function loadTodoCard(){
    var sub = document.getElementById('todoCardSub');
    var list = bodyEl;
    sub.textContent='加载中…'; list.innerHTML='<div class="empty">读取中…</div>';
    fetch('/api/todo-mini', { cache:'no-store' })
      .then(function(r){ if(!r.ok) throw new Error('bad'); return r.json(); })
      .then(function(d){
        var items = Array.isArray(d.items) ? d.items : [];
        sub.textContent = items.length + ' 项';
        if(!items.length){
          list.innerHTML = '<div class="empty"><b>今天没有待办</b>松一口气，去做别的吧</div>';
          return;
        }
        var html = [];
        items.forEach(function(t){
          var pri = ('p'+(Number(t.priority)||4));
          var tag = t.status==='doing' ? '<span class="tag doing">进行中</span>' : '';
          var em = '';
          if(t.urgent) em = '<span class="em">紧急</span>';
          var dd = '';
          if(t.dueAt){
            try{ dd = '截止 ' + new Date(t.dueAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(err){}
          }
          html.push(
            '<div class="titem" data-tip="' + esc(t.title) + '">' +
              '<span class="pri ' + pri + '"></span>' +
              '<span class="mt">' +
                '<span class="tt">' + esc(t.title) + em + '</span>' +
                (dd ? '<div class="dd">' + dd + '</div>' : '') +
              '</span>' +
              tag +
            '</div>'
          );
        });
        list.innerHTML = html.join('');
        list.querySelectorAll('.titem').forEach(function(el){
          el.addEventListener('click', function(){ openMain(); });
        });
      })
      .catch(function(){ sub.textContent=''; list.innerHTML='<div class="empty"><b>读取失败</b>请检查服务是否在运行</div>'; });
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* badge 轮询 */
  function refresh(){
    if(which !== 'todo') return;
    fetch('/api/todo-count', { cache:'no-store' })
      .then(function(r){ if(!r.ok) throw new Error('bad'); return r.json(); })
      .then(function(d){
        var t=d.today||0, dn=d.doing||0, over=d.overdue||0;
        if(badge){ badge.hidden=t<=0; badge.textContent=t>99?'99+':String(t); }
        if(doing){ doing.hidden=dn<=0; doing.textContent=dn>99?'99+':String(dn); }
        if(todoBall){
          todoBall.classList.toggle('alert', over>0);
          todoBall.classList.toggle('idle', t===0 && dn===0);
        }
      })
      .catch(function(){});
  }

  function fabMenu(ev){
    ev.preventDefault();
    if(hasTauri){ invoke('fab_menu', { which: which }).catch(function(){}); }
  }
  currentBall.addEventListener('contextmenu', fabMenu);
  currentBall.addEventListener('keydown', function(e){
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); handleClick(); }
  });

  refresh();
  setInterval(refresh, 60000);
})();
</script>
</body>
</html>
