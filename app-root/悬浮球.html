<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运营工作台悬浮球</title>
<style>
  :root{
    --orange:#F97316; --orange-deep:#E4660A;
    --blue:#3B82F6; --blue-deep:#2563EB;
    --card-bg:#FFFFFF;
    --ink:#2B2B2B; --ink-2:#8A8A8A; --line:rgba(0,0,0,.06);
    --red:#EF4444;
  }
  *{ box-sizing:border-box; }
  /* hidden 必须显式 !important：.ball/.card 等作者样式设了 display，会盖掉 UA 默认的 [hidden]{display:none} */
  [hidden]{ display:none !important; }
  html,body{ margin:0; padding:0; background:transparent; overflow:hidden; }
  body{ width:100vw; height:100vh; }
  .wrap{ width:100%; height:100%; display:flex; flex-direction:column; align-items:flex-end; padding-top:12px; padding-right:12px; }

  /* ---- 球（56px 圆形）---- */
  .ball{
    position:relative; width:56px; height:56px; border-radius:50%;
    color:#fff; border:none; cursor:pointer; outline:none; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    box-shadow:0 3px 10px rgba(0,0,0,.22), 0 1px 3px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.32);
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  .ball:hover{ transform:scale(1.05); }
  .ball:active{ cursor:grabbing; transform:scale(.97); }
  .ball.ai{ background:linear-gradient(145deg,#FFA45C 0%,#F97316 55%,#E4660A 100%); }
  .ball.todo{ background:linear-gradient(145deg,#FFA45C 0%,#F97316 55%,#E4660A 100%); }
  .ball.todo.idle{ opacity:.55; }
  /* ★ 呼吸「灯」（光环）：球保持统一橙色，只让外圈光环配色闪烁。
     今天有要做的→黄灯，有逾期→红灯（更高一级，写在后面覆盖）。 */
  .ball.todo.today{ animation:ballBreatheYellow 1.6s ease-in-out infinite; }
  .ball.todo.alert{ animation:ballBreatheRed 1.6s ease-in-out infinite; }
  @keyframes ballBreatheYellow{
    0%,100%{ box-shadow:0 3px 10px rgba(0,0,0,.22), 0 1px 3px rgba(0,0,0,.16), 0 0 0 0 rgba(250,204,21,.60), inset 0 1px 0 rgba(255,255,255,.32); }
    50%    { box-shadow:0 3px 10px rgba(0,0,0,.22), 0 1px 3px rgba(0,0,0,.16), 0 0 0 13px rgba(250,204,21,0), inset 0 1px 0 rgba(255,255,255,.32); }
  }
  @keyframes ballBreatheRed{
    0%,100%{ box-shadow:0 3px 10px rgba(0,0,0,.22), 0 1px 3px rgba(0,0,0,.16), 0 0 0 0 rgba(239,68,68,.60), inset 0 1px 0 rgba(255,255,255,.32); }
    50%    { box-shadow:0 3px 10px rgba(0,0,0,.22), 0 1px 3px rgba(0,0,0,.16), 0 0 0 13px rgba(239,68,68,0), inset 0 1px 0 rgba(255,255,255,.32); }
  }
  @media (prefers-reduced-motion: reduce){
    .ball.todo.today, .ball.todo.alert{ animation:none; }
  }
  .ball svg{ width:26px; height:26px; display:block; }
  .fab-num{ font-size:21px; font-weight:800; line-height:1; }
  .fab-cap{ font-size:10px; font-weight:600; margin-top:3px; opacity:.92; letter-spacing:1px; }

  .badge, .doing{
    position:absolute; top:-5px; min-width:20px; height:20px; padding:0 5px;
    border-radius:999px; color:#fff; font-size:11.5px; font-weight:700;
    line-height:20px; text-align:center; box-shadow:0 0 0 2px #fff; pointer-events:none;
  }
  .badge{ right:-5px; background:var(--orange-deep); }
  .doing{ left:-5px; background:var(--blue); }

  /* ---- 气泡卡片（从球下方弹出，带小三角指向球）---- */
  .card{
    position:relative; width:300px; margin-top:12px; flex:0 0 auto;
    background:var(--card-bg); border:1px solid rgba(0,0,0,.06);
    border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,.20), 0 2px 8px rgba(0,0,0,.08);
    display:flex; flex-direction:column; color:var(--ink);
  }
  .card::before{
    content:''; position:absolute; top:-8px; right:28px;
    border:8px solid transparent; border-top:none; border-bottom-color:#fff;
    filter:drop-shadow(0 -1px 1px rgba(0,0,0,.10));
  }
  .card-head{ display:flex; align-items:center; gap:8px; padding:12px 14px 10px; font-size:13.5px; font-weight:700; border-bottom:1px solid var(--line); }
  .card-head .dot{ width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .todo-card .card-head .dot{ background:var(--orange); }
  .ai-card .card-head .dot{ background:var(--orange); }
  .card-head .sub{ margin-left:auto; font-weight:500; font-size:11.5px; color:var(--ink-2); }
  .card-head .close{ margin-left:4px; border:none; background:none; color:var(--ink-2); font-size:16px; line-height:1; cursor:pointer; padding:0 3px; border-radius:6px; }
  .card-head .close:hover{ background:rgba(0,0,0,.06); color:var(--ink); }
  .card-body{ overflow-y:auto; padding:4px 0; }
  .card-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 14px; border-top:1px solid var(--line); }
  .card-foot .hint{ font-size:10.5px; color:var(--ink-2); }
  .card-foot .link{ font-size:12px; font-weight:600; cursor:pointer; }
  .todo-card .card-foot .link{ color:var(--orange); }
  .ai-card .card-foot .link{ color:var(--orange); }

  /* 待办列表 */
  .titem{ display:flex; align-items:flex-start; gap:9px; padding:10px 14px; border-bottom:1px solid var(--line); font-size:12.5px; line-height:1.45; cursor:pointer; }
  .titem:last-child{ border-bottom:none; }
  .titem:hover{ background:rgba(249,115,22,.06); }
  .titem .pri{ width:8px; height:8px; border-radius:50%; margin-top:5px; flex:0 0 auto; }
  .titem .pri.p1{ background:var(--red); } .titem .pri.p2{ background:var(--orange); }
  .titem .pri.p3{ background:var(--blue); } .titem .pri.p4{ background:#D1D5DB; }
  .titem .mt{ flex:1 1 auto; min-width:0; }
  .titem .tt{ font-weight:600; word-break:break-word; }
  .titem .em{ color:var(--red); font-size:11px; font-weight:700; margin-left:4px; }
  .titem .dd{ font-size:11px; color:var(--ink-2); margin-top:2px; }
  .titem .tag{ flex:0 0 auto; font-size:10.5px; padding:1px 8px; border-radius:999px; color:#fff; background:var(--blue); }
  .titem .tag.pending{ background:#E5E7EB; color:#6B7280; }
  .empty{ padding:28px 16px; text-align:center; color:var(--ink-2); font-size:12.5px; }
  .empty b{ display:block; color:var(--ink); font-size:13px; margin-bottom:4px; }

  /* AI 快捷入口 */
  .ai-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; padding:12px 12px 14px; }
  .ai-item{ display:flex; flex-direction:column; align-items:center; gap:7px; padding:14px 6px; border:1px solid var(--line); border-radius:12px; background:#fff; cursor:pointer; font-size:11.5px; color:var(--ink); transition:background .12s, transform .08s, border-color .12s; }
  .ai-item:hover{ background:rgba(249,115,22,.10); border-color:rgba(249,115,22,.35); transform:translateY(-1px); }
  .ai-item svg{ width:22px; height:22px; color:var(--orange); }
</style>
</head>
<body>
<div class="wrap">
  <div class="ball ai" id="aiBall" role="button" tabindex="0" title="单击展开AI助手，双击打开主面板" aria-label="AI 助手" data-tauri-drag-region>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/>
      <path d="M8.5 12.5h.01M12 12.5h.01M15.5 12.5h.01"/>
    </svg>
  </div>
  <div class="ball todo" id="todoBall" role="button" tabindex="0" title="单击展开待办事项，双击打开主面板" aria-label="待办事项" data-tauri-drag-region>
    <span class="fab-num" id="todoNum">0</span>
    <span class="fab-cap">待办</span>
    <span class="doing" id="todoDoing" hidden>0</span>
  </div>

  <!-- 待办球展开气泡（橙色主题） -->
  <div class="card todo-card" id="todoCard" hidden>
    <div class="card-head">
      <span class="dot"></span>今日待办
      <span class="sub" id="todoCardSub"></span>
      <button class="close" title="收起">✕</button>
    </div>
    <div class="card-body" id="todoCardBody"></div>
    <div class="card-foot"><span class="hint">单击收起待办事项 · 双击打开主面板</span><span class="link">查看全部 →</span></div>
  </div>

  <!-- AI 球展开气泡（蓝色主题） -->
  <div class="card ai-card" id="aiCard" hidden>
    <div class="card-head">
      <span class="dot"></span>AI 助手
      <button class="close" title="收起">✕</button>
    </div>
    <div class="ai-grid">
      <div class="ai-item" data-go="ai-main">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
        AI 对话
      </div>
      <div class="ai-item" data-go="ai-ask">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4h5l3 3v13a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1V7z"/><path d="M9.5 4v3h5v-3M9 14l2 2 4-4"/></svg>
        问大家
      </div>
      <div class="ai-item" data-go="ai-todo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        智能待办
      </div>
      <div class="ai-item" data-go="ai-report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-5"/><path d="M19 9V6h-3"/></svg>
        经营总结
      </div>
    </div>
    <div class="card-foot"><span class="hint">单击收起AI助手 · 双击打开主面板</span><span class="link">打开完整 AI 面板</span></div>
  </div>
</div>
<script>
(function(){
  var hasTauri = !!(window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke);
  var which = ((location.search.match(/[?&]which=([^&]+)/) || [])[1] || 'ai').toLowerCase();
  var aiBall = document.getElementById('aiBall');
  var todoBall = document.getElementById('todoBall');
  var todoNum = document.getElementById('todoNum');
  var doing = document.getElementById('todoDoing');
  var bodyEl = document.getElementById('todoCardBody');
  var aiCardEl = document.getElementById('aiCard');
  var todoCardEl = document.getElementById('todoCard');

  var CARD_W = 300;
  var WIN_W = CARD_W + 12;
  var TODO_H = 340, AI_H = 282;
  var BASE_H = 80;

  var card = null;
  if(which === 'todo'){
    if(aiBall) aiBall.hidden = true;
    card = todoCardEl;
  } else {
    if(todoBall) todoBall.hidden = true;
    which = 'ai';
    card = aiCardEl;
  }
  /* 关键修复：每个窗口只保留自己那个气泡，另一个彻底隐藏——
     否则两个 .card 都在同一窗口内，旧 CSS 会把两个气泡一起显示，导致「AI/待办混在一起」。 */
  /* 初始均为收起状态（只显示球），展开时才通过 card.hidden=false 显示对应卡片。 */
  if(aiCardEl) aiCardEl.hidden = true;
  if(todoCardEl) todoCardEl.hidden = true;

  function invoke(cmd, args){ return window.__TAURI__.core.invoke(cmd, args || {}); }
  function taWin(){ try{ return window.__TAURI__.window.getCurrentWindow(); }catch(e){ return null; } }

  var expanded = false;
  var downX=0, downY=0, dragStarted=false, lastClickT=0, clickTimer=null;

  function openMain(){
    refresh();
    if(hasTauri){ invoke('fab_action', { action: which }).catch(function(){}); }
    else { try{ window.open('/工作台.html', '_blank'); }catch(e){} }
  }

  function resizeWin(w, h){
    var win = taWin();
    if(!win) return;
    try{
      var T = window.__TAURI__.window;
      Promise.all([win.outerPosition(), win.outerSize(), win.scaleFactor()]).then(function(r){
        var pos = r[0], sz = r[1], scale = r[2] || 1;
        var pw = Math.round(w * scale), ph = Math.round(h * scale);
        var newX = pos.x + sz.width - pw;
        win.setPosition(new T.PhysicalPosition(newX, pos.y)).then(function(){
          return win.setSize(new T.PhysicalSize(pw, ph));
        }).catch(function(){});
      }).catch(function(){});
    }catch(e){}
  }
  function expand(){
    expanded = true;
    setBallTitle(true);
    if(card) card.hidden = false;
    if(which === 'todo') loadTodoCard();
    resizeWin(WIN_W, which==='todo' ? TODO_H : AI_H);
  }
  function collapse(){
    expanded = false;
    setBallTitle(false);
    if(card) card.hidden = true;
    resizeWin(80, BASE_H);
    dragReset();
  }
  function dragReset(){ var el = which==='todo'? todoBall : aiBall; if(el) el.style.cursor='pointer'; }

  var currentBall = which === 'todo' ? todoBall : aiBall;
  var ballName = which === 'todo' ? '待办事项' : 'AI助手';
  function setBallTitle(open){
    var t = (open ? '单击收起' : '单击展开') + ballName + '，双击打开主面板';
    if(currentBall) currentBall.setAttribute('title', t);
  }

  currentBall.addEventListener('mousedown', function(e){
    if(e.button !== 0) return;
    downX=e.clientX; downY=e.clientY; dragStarted=false;
    var el = currentBall;
    var move = function(ev){
      if(dragStarted) return;
      var dx=Math.abs(ev.clientX-downX), dy=Math.abs(ev.clientY-downY);
      if(dx<6 && dy<6) return;
      dragStarted=true;
      if(hasTauri){ try{ invoke('plugin:window|start_dragging'); }catch(err){} el.style.cursor='grabbing'; }
    };
    var up = function(){
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      if(dragStarted){ dragReset(); return; }
      handleClick();
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });

  function handleClick(){
    var nowTime = Date.now();
    if(expanded){
      collapse();
      lastClickT = 0;
      return;
    }
    if(lastClickT && nowTime - lastClickT <= 330){
      clearTimeout(clickTimer);
      lastClickT = 0;
      openMain();
      return;
    }
    lastClickT = nowTime;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(function(){
      clickTimer = null;
      lastClickT = 0;
      expand();
    }, 330);
  }

  /* 卡片内收起按钮 */
  if(card){
    card.querySelectorAll('.close').forEach(function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); collapse(); }); });
  }

  /* Esc 收起 */
  document.body.addEventListener('keydown', function(e){
    if(e.key === 'Escape') collapse();
  });

  /* 卡片底部「查看全部 / 打开完整面板」→ 打开主面板 */
  if(card){
    var footLink = card.querySelector('.card-foot .link');
    if(footLink) footLink.addEventListener('click', function(){ openMain(); });
  }

  /* AI 卡快捷项 → 直达主面板 */
  if(card) card.querySelectorAll('[data-go]').forEach(function(el){
    el.addEventListener('click', function(){ openMain(); });
  });

  /* 待办卡片内容 */
  function loadTodoCard(){
    var sub = document.getElementById('todoCardSub');
    var list = bodyEl;
    sub.textContent='加载中…'; list.innerHTML='<div class="empty">读取中…</div>';
    fetch('/api/todo-mini', { cache:'no-store' })
      .then(function(r){ if(!r.ok) throw new Error('bad'); return r.json(); })
      .then(function(d){
        var items = Array.isArray(d.items) ? d.items : [];
        sub.textContent = items.length + ' 项';
        if(!items.length){
          list.innerHTML = '<div class="empty"><b>今天没有待办</b>松一口气，去做别的吧</div>';
          return;
        }
        var html = [];
        items.forEach(function(t){
          var pri = ('p'+(Number(t.priority)||4));
          var tag = t.status==='doing' ? '<span class="tag">进行中</span>' : '<span class="tag pending">未完成</span>';
          var em = t.urgent ? '<span class="em">紧急</span>' : '';
          var dd = '';
          if(t.dueAt){
            try{ dd = '截止 ' + new Date(t.dueAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(err){}
          }
          html.push(
            '<div class="titem">' +
              '<span class="pri ' + pri + '"></span>' +
              '<span class="mt">' +
                '<span class="tt">' + esc(t.title) + em + '</span>' +
                (dd ? '<div class="dd">' + dd + '</div>' : '') +
              '</span>' +
              tag +
            '</div>'
          );
        });
        list.innerHTML = html.join('');
        list.querySelectorAll('.titem').forEach(function(el){
          el.addEventListener('click', function(){ openMain(); });
        });
      })
      .catch(function(){ sub.textContent=''; list.innerHTML='<div class="empty"><b>读取失败</b>请检查服务是否在运行</div>'; });
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* badge 轮询 */
  function refresh(){
    if(which !== 'todo') return;
    fetch('/api/todo-count', { cache:'no-store' })
      .then(function(r){ if(!r.ok) throw new Error('bad'); return r.json(); })
      .then(function(d){
        var t=d.today||0, dn=d.doing||0, over=d.overdue||0;
        if(todoNum) todoNum.textContent = t>99?'99+':String(t);
        if(doing){ doing.hidden=dn<=0; doing.textContent=dn>99?'99+':String(dn); }
        if(todoBall){
          todoBall.classList.toggle('today', t>0);
          todoBall.classList.toggle('alert', over>0);
          todoBall.classList.toggle('idle', t===0 && dn===0);
        }
      })
      .catch(function(){});
  }

  function fabMenu(ev){
    ev.preventDefault();
    if(hasTauri){ invoke('fab_menu', { which: which }).catch(function(){}); }
  }
  currentBall.addEventListener('contextmenu', fabMenu);
  currentBall.addEventListener('keydown', function(e){
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); handleClick(); }
  });

  refresh();
  setInterval(refresh, 60000);
})();
</script>
</body>
</html>
