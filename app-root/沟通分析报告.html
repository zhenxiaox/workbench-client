<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
(function(){
  var WP='wb_theme', WS='wb_theme_auto_start', WE='wb_theme_auto_end';
  function mins(t){ var p=String(t||'00:00').split(':'); return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0); }
  function resolve(mode){
    if(mode==='light'||mode==='dark'||mode==='eye') return mode;
    if(mode!=='auto') return 'light';
    var d=new Date(), m=d.getHours()*60+d.getMinutes(), s=1080, e=360;
    try{ s=mins(localStorage.getItem(WS)||'18:00'); e=mins(localStorage.getItem(WE)||'06:00'); }catch(x){}
    var dark=(s<e)?(m>=s&&m<e):(m>=s||m<e);
    return dark?'dark':'light';
  }
  window.__wbResolveTheme = resolve;
  function apply(){
    var mode='light'; try{ mode=localStorage.getItem(WP)||'light'; }catch(e){}
    document.documentElement.setAttribute('data-theme', resolve(mode));
  }
  apply();
  window.addEventListener('message', function(e){
    if(e.data && e.data.type==='wb-theme'){
      var t=e.data.theme||e.data.mode;
      if(t) document.documentElement.setAttribute('data-theme', resolve(t));
      else apply();
    }
  });
  try{ window.addEventListener('storage', function(e){ if(!e.key||e.key===WP||e.key===WS||e.key===WE) apply(); }); }catch(e){}
})();
</script>

<style>

/* ============ Design System (single source of truth) ============
   Chapter 4 content is rendered by scripts/render_report.py:
   general quality taxonomy + model-annotated named accessories.
   ============ */
:root {
  /* Typography scale */
  --fs-h1: 34px;
  --fs-h2: 24px;   /* section titles */
  --fs-h3: 17px;   /* sub-section titles (聚类标题) */
  --fs-h4: 15px;   /* card sub-headers */
  --fs-body: 15px;
  --fs-sm: 14px;
  --fs-xs: 12px;
  --fs-mono: 12.5px;
  --lh-body: 1.7;
  --lh-tight: 1.5;

  /* Neutrals */
  --c-bg: #f9fafb;
  --c-surface: #ffffff;
  --c-surface-soft: #f8fafc;
  --c-border: #e2e8f0;
  --c-border-strong: #cbd5e1;
  --c-text: #0f172a;
  --c-text-2: #1f2937;
  --c-text-3: #64748b;
  --c-text-4: #94a3b8;

  /* Accent */
  --c-brand: #6366f1;
  --c-brand-2: #8b5cf6;
  --c-navy: #1e1b4b;
  --c-brand-soft: #eef2ff;
  --c-brand-border: #c7d2fe;

  /* Semantic */
  --c-danger: #ef4444;
  --c-danger-soft: #fef2f2;
  --c-danger-border: #fca5a5;
  --c-warn: #f59e0b;
  --c-warn-soft: #fef3c7;
  --c-warn-border: #fde68a;
  --c-ok: #10b981;
  --c-info: #2563eb;

  /* Layout tokens */
  --gap-1: 4px;
  --gap-2: 8px;
  --gap-3: 12px;
  --gap-4: 16px;
  --gap-5: 20px;
  --gap-6: 24px;
  --gap-8: 32px;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;

  --shadow-1: 0 1px 2px rgba(15,23,42,0.04);
  --shadow-2: 0 4px 12px rgba(15,23,42,0.06);
}

/* ============ Reset & base ============ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
  background: var(--c-bg);
  color: #1f2937;
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
a { color: var(--c-brand); text-decoration: none; transition: color 0.15s; }
a:hover { color: #4f46e5; text-decoration: underline; }
p { margin: 0; }
p + p { margin-top: var(--gap-2); }
strong { font-weight: 700; color: var(--c-text); }
code { font-family: 'SF Mono', 'Menlo', 'Consolas', monospace; font-size: var(--fs-mono); }

/* ============ Hero ============ */
.hero {
  background: transparent;
  color: #fff;
  padding: 32px 20px 0;
}
.hero-inner {
  max-width: 1040px;
  margin: 0 auto;
  background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
  border-radius: 20px;
  padding: 48px 48px 40px;
}
.hero-eyebrow { font-size: 12px; letter-spacing: 3px; opacity: 0.7; margin-bottom: 10px; }
.hero h1 { font-size: var(--fs-h1); font-weight: 800; letter-spacing: 0.5px; }
.hero-sub { font-size: 15px; opacity: 0.85; margin: 8px 0 12px; line-height: 1.7; }
.report-periods { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 28px; }
.report-period-chip { display:inline-flex; align-items:center; padding:5px 10px; border-radius:999px; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.24); color:#fff; font-size:12.5px; line-height:1.4; }
.report-period-chip--warn { background:rgba(255,176,32,0.22); border-color:rgba(255,176,32,0.55); color:#ffe4b0; font-weight:600; }
.metric-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.metric-card {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 12px;
  padding: 14px 16px;
  min-width: 0;
}
.metric-num { font-size: 26px; font-weight: 700; line-height: 1.2; color: #fff; word-break: break-word; font-variant-numeric: tabular-nums; }
.metric-label { font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 2px; }

/* ============ Page layout ============ */
.page { max-width: 1080px; margin: 0 auto; padding: 32px 20px 80px; }
.main-content { min-width: 0; display: flex; flex-direction: column; gap: var(--gap-8); }

/* ============ Section card ============ */
.section {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-lg);
  padding: 40px;
  box-shadow: var(--shadow-1);
  scroll-margin-top: var(--gap-6);
}
.section > h2 {
  font-size: var(--fs-h2);
  font-weight: 700;
  color: var(--c-text);
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 24px;
  padding: 0;
  border-bottom: none;
  line-height: 1.3;
}
.num-badge {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--c-brand); color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; flex-shrink: 0;
}
.section > h2 + *,
.section > h3:first-child { margin-top: 0; }
.section h3 { font-size: var(--fs-h3); font-weight: 700; color: var(--c-text); margin: 28px 0 10px; line-height: 1.4; }

/* 章节导语（对齐参考报告 .section-intro） */
.section-intro { color: var(--c-text-3); font-size: 14.5px; margin-bottom: 24px; line-height: 1.7; }

/* ============ Overview pies（diagram 卡壳） ============ */
.pie-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-5); margin: 20px 0; }
.pie-card { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--r-lg); padding: 28px 20px 16px; box-shadow: var(--shadow-1); min-width: 0; }
.pie-title { font-size: 15px; font-weight: 700; color: var(--c-text); margin-bottom: var(--gap-4); }
.pie-body { display: flex; align-items: center; gap: var(--gap-5); flex-wrap: wrap; }
.pie-card svg { width: 180px; height: 180px; flex-shrink: 0; }
.pie-legend { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 8px; }
.pie-legend-row { display: flex; align-items: center; font-size: 13px; color: var(--c-text-2); gap: 8px; line-height: 1.4; }
.pie-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.pie-legend-label { flex: 1; font-weight: 500; word-break: break-word; }
.pie-legend-value { color: var(--c-text-3); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.pie-empty { color: var(--c-text-4); font-style: italic; font-size: 12.5px; }

/* ============ Diagram（宽幅图表卡壳，对齐参考报告 .diagram） ============ */
.diagram {
  border: 1px solid var(--c-border);
  border-radius: var(--r-lg);
  background: var(--c-surface);
  padding: 28px 20px 16px;
  margin: 20px 0;
  box-shadow: var(--shadow-1);
}
.diagram svg { display: block; margin: 0 auto; width: 100%; max-width: 100%; height: auto; }

/* ============ 抱怨主题频次榜 ============ */
.rank-card {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-lg);
  padding: 28px 20px 16px;
  box-shadow: var(--shadow-1);
  margin: 20px 0;
}
.rank-title { font-size: 15px; font-weight: 700; color: var(--c-text); }
.rank-table { margin: 12px 0 0; background: var(--c-surface); }
.rank-table th:nth-child(1) { width: 190px; }
.rank-table th:nth-child(2) { width: 88px; }
.rank-table th:nth-child(3) { width: 190px; }
.rank-table td { vertical-align: middle; }
.rk-dim { font-weight: 700; color: var(--c-text); white-space: nowrap; }
.rk-no {
  display: inline-flex; align-items: center; justify-content: center;
  width: 19px; height: 19px; margin-right: 7px;
  border-radius: 4px; background: var(--c-brand-soft); border: 1px solid var(--c-brand-border);
  font-size: 11.5px; font-weight: 700; color: #4338ca;
}
.rk-freq { font-weight: 700; font-size: 17px; color: var(--c-text); font-variant-numeric: tabular-nums; }
.rk-share { display: flex; align-items: center; gap: 8px; }
.rk-track { flex: 1; min-width: 60px; height: 8px; border-radius: 999px; background: #eef2f7; overflow: hidden; }
.rk-fill { display: block; height: 100%; border-radius: 999px; background: var(--c-brand); }
.rk-pct { font-size: 13px; font-weight: 700; color: var(--c-brand); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.rk-voices { display: flex; flex-wrap: wrap; gap: 6px; }
.alert-box { border: 1px solid #fecaca; border-left: 4px solid var(--c-danger); border-radius: 10px; background: #fef2f2; padding: 18px 20px 14px; margin: 16px 0 8px; }
.alert-lead { color: #991b1b; font-weight: 700; font-size: var(--fs-body); line-height: 1.6; margin-bottom: 12px; }
.alert-box .rank-note { color: #b91c1c; }
.alert-box th { background: #991b1b; }
.alert-box tr:nth-child(even) td { background: #fff1f2; }
.alert-box table { background: #fff; }
.rank-note { margin: 12px 0 0; font-size: 12.5px; color: var(--c-text-4); line-height: 1.6; }
/* 质量/问题部位证据口径：强调主体、置信度与去重口径，不作为告警卡。 */
.evidence-scope-note {
  margin: 12px 0 0; padding: 10px 12px; border-left: 3px solid var(--c-brand-border);
  background: var(--c-surface-soft); color: var(--c-text-3); font-size: 12.5px; line-height: 1.65;
}

/* ============ 响应与断档 ============ */
.callout {
  background: var(--c-warn-soft); border: none; border-left: 4px solid var(--c-warn);
  border-radius: var(--r-md); padding: 16px 20px; margin: 16px 0;
}
.callout-title { font-size: 17px; font-weight: 700; color: #92400e; margin-bottom: 8px; }
.callout p { font-size: 14px; color: #92400e; line-height: 1.8; margin: 4px 0; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin: 18px 0; }
.stat-card { background: var(--c-surface-soft); border: 1px solid var(--c-border); border-radius: var(--r-md); padding: 14px 16px; min-width: 0; text-align: center; }
.stat-num { font-size: 22px; font-weight: 700; color: var(--c-text); line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat-num.is-bad { color: var(--c-danger); }
.stat-num.is-ok { color: var(--c-ok); }
.stat-unit { font-size: 12px; font-weight: 600; color: var(--c-text-4); margin-left: 3px; }
.stat-label { font-size: 12px; color: var(--c-text-3); margin-top: 2px; line-height: 1.5; }
.section > h3 { font-size: var(--fs-h3); font-weight: 700; color: var(--c-text); margin: 28px 0 10px; }
.wait-cell { font-weight: 700; color: var(--c-danger); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ============ 客户原声墙（严格对齐参考报告 .issue-card：加粗深红标题 + 14px 正文） ============ */
.voice-wall { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap-4); }
.voice-card {
  border: 1px solid #fecaca;
  border-left: 4px solid var(--c-danger);
  border-radius: 10px;
  padding: 16px 20px;
  background: #fff;
  min-width: 0;
}
.voice-text {
  display: block;
  color: #991b1b;
  font-weight: 700;
  font-size: var(--fs-body);
  line-height: 1.6;
  margin-bottom: 4px;
  word-break: break-word;
}
.voice-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: #7f1d1d; font-size: 14px; }
.voice-dim {
  display: inline-block; padding: 2px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap;
  background: #fee2e2; color: #991b1b;
}

/* ============ Number cell（表格数字列对齐） ============ */
td.num-cell { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ============ Ticket table（待回访工单） ============ */
.tk-kind {
  display: inline-block; padding: 2px 10px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; white-space: nowrap;
  color: var(--c-text-2); background: #f1f5f9; border: none;
}
.tk-kind.is-bad { color: #991b1b; background: #fee2e2; }
.tk-kind.is-warn { color: #92400e; background: var(--c-warn-soft); }
.tk-act { color: var(--c-text-2); line-height: 1.7; }

/* ============ Badges (pill tags) ============ */
.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  background: #f1f5f9;
  color: var(--c-text-2);
  line-height: 1.6;
  white-space: nowrap;
}
.badge-emotion { background: #fee2e2; color: #991b1b; }

/* ============ Optimization plan cards ============ */
.plan-card {
  background: var(--c-surface);
  border: 1px solid var(--c-brand-border);
  border-left: 4px solid var(--c-brand);
  border-radius: var(--r-md);
  padding: 20px 24px;
  margin: 16px 0;
  box-shadow: none;
}
.plan-head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid #f1f5f9;
}
.plan-priority {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: #fff;
  line-height: 1.6;
}
.plan-title { flex: 1; font-size: var(--fs-h3); font-weight: 700; color: #312e81; line-height: 1.4; min-width: 200px; }
.plan-title a { color: #312e81; text-decoration: none; border-bottom: 1px dashed var(--c-brand-border); }
.plan-title a:hover { color: var(--c-brand); border-bottom-color: var(--c-brand); text-decoration: none; }
.plan-row { display: grid; grid-template-columns: 92px 1fr; gap: var(--gap-3); margin: 10px 0; align-items: flex-start; }
.plan-row-label { font-size: var(--fs-sm); font-weight: 700; color: var(--c-text-2); padding-top: 2px; }
.plan-row-body { font-size: 14px; color: var(--c-text-2); line-height: 1.7; }
.plan-row-body strong { color: var(--c-text); }
.plan-actions { margin: 0; padding-left: 18px; }
.plan-actions li { margin: 4px 0; line-height: 1.7; font-size: 14px; }
/* 典型原声：买家原话小标签 */
.plan-voices { display: flex; flex-wrap: wrap; gap: 6px; }
.plan-voice {
  background: #f1f5f9;
  color: #475569;
  padding: 4px 12px;
  border-radius: var(--r-sm);
  font-size: 13.5px;
  line-height: 1.6;
  word-break: break-word;
}
/* 建议话术：可直接复制的草稿框 */
.plan-script {
  background: #dbeafe;
  border: none;
  border-left: 4px solid #3b82f6;
  border-radius: var(--r-md);
  padding: 14px 18px;
  color: #1e40af;
  font-weight: 600;
  line-height: 1.8;
}

/* ============ Appendix / files / tables ============ */
.table-wrap { width: 100%; overflow-x: auto; }
/* 列多的表在窄屏下横向滚动，不要把末列压成竖排单字 */
.table-wrap > table { min-width: 760px; }
table { width: 100%; border-collapse: collapse; border-spacing: 0; font-size: 14.5px; margin: 16px 0; border: none; border-radius: 0; overflow: visible; }
th, td { padding: 10px 12px; text-align: left; vertical-align: middle; line-height: 1.7; }
th { background: var(--c-navy); font-weight: 600; color: #fff; font-size: 14.5px; border-bottom: none; white-space: nowrap; }
td { border-bottom: 1px solid #f1f5f9; }
td:first-child { font-weight: 600; color: var(--c-text); }
tr:nth-child(even) td { background: var(--c-surface-soft); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--c-brand-soft); }
.not-supported { color: var(--c-text-4); font-style: italic; }


/* ============ Footer ============ */
.page-footer { max-width: 1080px; margin: 0 auto; padding: 0 20px 40px; text-align: center; color: var(--c-text-4); font-size: 12px; }


/* ============ Platform tabs (multi-platform aggregated report) ============ */
.platform-tabs {
  display: flex; gap: 0; margin: 18px 0 0;
  border-bottom: 2px solid var(--c-border);
}
.platform-tab {
  padding: 10px 18px; font-size: 14px; font-weight: 600;
  color: var(--c-text-3); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -2px;
  transition: all 0.2s;
}
.platform-tab.active { color: var(--c-brand); border-bottom-color: var(--c-brand); }
.platform-tab:hover { color: var(--c-brand); background: var(--c-brand-soft); border-radius: 8px 8px 0 0; }
.platform-content { display: none; padding: 18px 0; }
.platform-content.active { display: block; }

/* ============ Platform badges (neutral: 店铺不用平台品牌色) ============ */
.platform-badge {
  font-size: 12.5px; font-weight: 600; padding: 2px 10px;
  border-radius: 999px; display: inline-block; white-space: nowrap;
  background: #f1f5f9; color: var(--c-text); border: none;
}
.badge-taobao, .badge-tmall, .badge-p1688, .badge-jd, .badge-pdd, .badge-doudian {
  background: #f1f5f9; color: var(--c-text); border: none;
}

/* ============ Platform summary strip ============ */
.platform-strip {
  display: grid; gap: 12px; margin: 0 0 var(--gap-5);
}
.platform-strip-card {
  background: var(--c-surface-soft); border: 1px solid var(--c-border);
  border-radius: var(--r-md); padding: 14px 18px;
  display: flex; flex-direction: column; align-items: stretch; gap: 12px;
}
.psc-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.psc-total { font-size: var(--fs-xs); color: var(--c-text-3); }
/* 一行平铺：健康数 · 健康率（卡点数与抱怨主题看下方图表）。固定两列，不靠自由换行 */
.psc-stats { display: grid; grid-template-columns: auto auto; align-items: center; justify-content: start; column-gap: 10px; }
.psc-main { display: flex; align-items: baseline; gap: 5px; flex-wrap: nowrap; white-space: nowrap; }
.psc-num { font-size: 26px; font-weight: 700; color: var(--c-text); line-height: 1.2; }
.psc-of { font-size: 14px; font-weight: 600; color: var(--c-text-4); }
.psc-label { font-size: var(--fs-sm); color: var(--c-text-3); white-space: nowrap; }
.psc-rate {
  display: inline-block; padding: 2px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap;
  color: #065f46; background: #d1fae5; border: none;
}
.psc-media { display:flex; flex-wrap:wrap; gap:6px; padding-top:8px; border-top:1px dashed var(--c-border); color:var(--c-text-3); font-size:var(--fs-xs); }
.psc-media > span { padding:2px 7px; border-radius:6px; background:#fff; border:1px solid var(--c-border); }
.psc-media .psc-media-note { flex-basis:100%; border:0; padding:0; background:transparent; color:var(--c-text-4); }
/* 健康率分档：≥90% 绿，80%~90% 黄，<80% 红 */
.psc-stats.lv-good .psc-rate { color: #065f46; background: #d1fae5; }

<script>
function switchTab(el, targetId) {
  var tabGroup = el.closest('.platform-tabs');
  var section = el.closest('.section');
  if (!tabGroup || !section) return;
  tabGroup.querySelectorAll('.platform-tab').forEach(function (t) { t.classList.remove('active'); });
  el.classList.add('active');
  section.querySelectorAll('.platform-content').forEach(function (c) { c.classList.remove('active'); });
  var target = section.querySelector('#' + targetId);
  if (target) target.classList.add('active');
}
function toggleCaseReplay(button) {
  var replay = button.closest('.plan-replay');
  if (!replay) return;
  var body = replay.querySelector('.case-body');
  var willExpand = replay.classList.contains('is-collapsed');
  replay.classList.toggle('is-collapsed', !willExpand);
  button.setAttribute('aria-expanded', String(willExpand));
  if (body) body.hidden = !willExpand;
  var label = button.querySelector('.case-toggle-text');
  if (label) label.textContent = willExpand ? '收起' : '展开';
}
document.addEventListener('click', function (event) {
  var button = event.target.closest('.case-item-head');
  if (button) toggleCaseReplay(button);
});
document.getElementById('rpPrint').addEventListener('click', function () { window.print(); });
</script>

<script>
(function () {

  function esc(s) {

  function pad2(n) { return String(n).length < 2 ? '0' + n : String(n); }
  function tsOf(r) {
    var p = String(r.date || '').split('/');
    if (p.length < 3) return null;
    var t = String(r.time || '00:00:00').split(':');
    var d = new Date(+p[0], (+p[1]) - 1, +p[2], +(t[0] || 0), +(t[1] || 0), +(t[2] || 0));

  function toDS(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function median(a) {
    if (!a.length) return null;
    var s = a.slice().sort(function (x, y) { return x - y; });
    var m = s.length >> 1;

      re: /(质量|坏|不动|卡住|失灵|破损|瑕疵|裂缝|缝隙|尺寸|规格|少发|漏发|发错|错发|不能用|装不上|不合适|压痕|划痕|变形|松动)/ },
    { key: 'trust', name: '信任/售后/风险', color: '#9333ea', link: '售后规则与承诺兑现',
      re: /(退货|退款|换货|售后|投诉|差评|维权|骗|不负责|没人管|运费险)/ },
    { key: 'fit', name: '需求与商品匹配', color: '#f59e0b', link: '选型引导与适配说明',
      re: /(太挤|装不下|放不下|不搭|能不能装|适配|太大|太小|空间|格局)/ },
    { key: 'logi', name: '库存/物流/时效', color: '#10b981', link: '发货时效与物流跟进',
      re: /(发货|快递|物流|几天|多久|什么时候到|还没发|库存|现货|迟迟|到货|揽收|单号|补发)/ },
    { key: 'service', name: '客服话术/沟通', color: '#6366f1', link: '接待话术与响应机制',
      re: /(态度差|态度不好|没人回|没人理|不回|不理|回复太慢|回复慢|一直没|转人工|人工客服|没人管|怎么调)/ }
  ];

  var QUALITY_TYPES = [
    { name: '功能失效', link: '核心功能与关键组件', re: /(不动|卡住|失灵|不能用|开不了|关不上|坏了|失效|不通电|不工作)/ },
    { name: '配件缺失或数量不足', link: '装箱清单与出货复核', re: /(少发|漏发|少了|只发了|缺|没配|不够数|数量不对)/ },
    { name: '错发、规格或结构适配问题', link: 'SKU、尺寸、结构与安装适配性', re: /(发错|错发|尺寸不对|规格不对|装不上|不合适|适配|有问题.*门|门.*有问题|不匹配)/ },
    { name: '外观瑕疵与运输破损', link: '包装防护与出厂检验', re: /(瑕疵|划痕|压痕|磕|破损|摔|裂|变形|掉漆|毛刺)/ },
    { name: '异响与晃动', link: '结构紧固与安装说明', re: /(异响|响声|噪音|吱|晃|松|不稳)/ },
    { name: '安装与说明不清', link: '说明书与安装指引', re: /(不会装|怎么装|装不上|安装|说明书|图纸|孔位|螺丝)/ }
  ];

  /* 问题部位：从命中质量的买家原话里抽取已知部件名 */
  var PARTS = ['猫爬架', '猫柜', '中间的门', '左边的门', '右边的门', '门', '踏板', '小踏板', '层板', '背板', '侧板', '顶板', '底板',
    '隔板', '面板', '柱子', '圆柱', '楼梯', '跳板', '猫抓板', '窝', '垫', '螺丝', '钉子', '洞洞板', '纸箱', '包装'];

  var LOSS_SIGNALS = [
    { key: 'refund', label: '已申请退货', re: /(退货|退款|退了|退回去|退回来)/, cls: 'badge-emotion' },
    { key: 'cancel', label: '已要求取消', re: /(不要了|不想要|不买了|取消|算了)/, cls: 'badge-emotion' },
    { key: 'price', label: '价格敏感流失', re: /(太贵|贵了|价格|优惠|包邮|运费)/, cls: 'badge' },
    { key: 'quality', label: '质量问题抱怨', re: /(坏了|卡住|不动|少发|发错|瑕疵|破损|不合适)/, cls: 'badge' },
    { key: 'logi', label: '时效不满', re: /(还没发|迟迟|快递|物流|什么时候到|几天)/, cls: 'badge' }
  ];

  /* ================= 会话构建与分析 ================= */
  function buildSessions(rows) {
    var map = {}, order = [];
    rows.forEach(function (r) {
      var k = (r.store || '?') + '||' + ((r.customerId || '').trim() || '?');
      if (!map[k]) {
        map[k] = { store: r.store || '未知店铺', cid: (r.customerId || '').trim() || '未知客户', raw: [] };
        order.push(k);
      }
      map[k].raw.push(r);
    });
    var out = [];
    order.forEach(function (k) {
      var s = map[k];
      var items = s.raw.map(function (r) { return { r: r, t: tsOf(r) }; })
        .filter(function (x) { return x.t != null; })
        .sort(function (a, b) { return a.t - b.t; });
      if (!items.length) return;
      /* 按 12 小时静默切分会话 */
      var chunks = [], cur = [];
      items.forEach(function (x) {
        if (cur.length && (x.t - cur[cur.length - 1].t) / 1000 > SESSION_SPLIT_SEC) { chunks.push(cur); cur = []; }
        cur.push(x);
      });
      if (cur.length) chunks.push(cur);
      chunks.forEach(function (c, i) {
        out.push({ store: s.store, cid: s.cid, items: c, key: k + '#' + i });
      });
    });
    return out;
  }

  function analyzeSession(s) {
    var items = s.items;
    var real = items.filter(function (x) {
      return isBuyerRole(x.r) ? isRealMsg(x.r) : true;
    });

    var maxGap = null;
    var gapByHour = [];
    for (var i = 1; i < real.length; i++) {
      var g = (real[i].t - real[i - 1].t) / 1000;
      if (g < 0 || g > MAX_GAP_SEC) continue;
      if (maxGap == null || g > maxGap) maxGap = g;
      if (g > SLOW_SEC) gapByHour.push(new Date(real[i - 1].t).getHours());
    }

    var buyerReal = items.filter(function (x) { return isBuyerRole(x.r) && isRealMsg(x.r); });
    var agentMsgs = items.filter(function (x) { return isAgentRole(x.r); });

    /* 配对「真实买家消息 → 客服回复」算响应时长 */
    var firsts = [], alls = [], slow = 0, asked = 0, answered = 0;
    var lastBuyer = null;
    items.forEach(function (x) {
      if (isBuyerRole(x.r)) {
        if (isRealMsg(x.r)) { lastBuyer = x.t; asked++; }
        return;
      }
      if (!isAgentRole(x.r)) return;           // 机器人自动回复不计入客服响应
      if (lastBuyer == null) return;
      var gap = (x.t - lastBuyer) / 1000;
      lastBuyer = null;
      if (gap < 0 || gap > MAX_GAP_SEC) return;
      alls.push(gap);
      if (firsts.length === 0) firsts.push(gap);
      if (gap > SLOW_SEC) slow++;
      answered++;
    });

    var lastItem = items[items.length - 1];
    var unanswered = !!lastItem && isBuyerRole(lastItem.r) && isRealMsg(lastItem.r);

    var neg = false, themes = {}, evidences = [];
    buyerReal.forEach(function (x) {
      var c = x.r.content || '';
      var isNeg = NEG_RE.test(c);
      if (isNeg) neg = true;
      THEMES.forEach(function (t) {
        if (!t.re.test(c)) return;
        /* 只有带负面信号的原话才算「抱怨证据」，
           否则「客服」「发货」这类中性词会把主题榜带偏。 */
        if (!isNeg) return;
        themes[t.key] = (themes[t.key] || 0) + 1;
        evidences.push({ theme: t.key, text: c, t: x.t });
      });
    });

    var gap2h = maxGap != null && maxGap > GAP2H;
    s.m = {
      msgs: items.length,
      buyerReal: buyerReal.length,
      agentMsgs: agentMsgs.length,
      agentNames: uniq(agentMsgs.map(function (x) { return (x.r.agent || '').trim(); }).filter(Boolean)),
      maxGap: maxGap, gapByHour: gapByHour,
      firsts: firsts, alls: alls, slow: slow, asked: asked, answered: answered,
      unanswered: unanswered, neg: neg, gap2h: gap2h,
      themes: themes, evidences: evidences,
      blocked: unanswered || neg || gap2h,
      start: items[0].t, end: items[items.length - 1].t
    };
    return s;
  }

  function uniq(a) {
    var seen = {}, out = [];
    a.forEach(function (x) { if (!seen[x]) { seen[x] = 1; out.push(x); } });
    return out;
  }

  function computeAll(sessions) {
    var st = {
      sessions: sessions, n: sessions.length,
      msgs: 0, buyerReal: 0, agentMsgs: 0,
      firsts: [], alls: [], slow: 0, maxGap: null,
      gap2h: 0, unanswered: 0, neg: 0, blocked: 0,
      byStore: {}, byAgent: {}, themes: {}, evidences: [],
      msgByHour: new Array(24).fill(0), gapHour: new Array(24).fill(0)
    };
    sessions.forEach(function (s) {
      var m = s.m;
      st.msgs += m.msgs;
      st.buyerReal += m.buyerReal;
      st.agentMsgs += m.agentMsgs;
      st.slow += m.slow;
      m.firsts.forEach(function (x) { st.firsts.push(x); });
      m.alls.forEach(function (x) { st.alls.push(x); });
      if (m.maxGap != null && (st.maxGap == null || m.maxGap > st.maxGap)) st.maxGap = m.maxGap;
      if (m.gap2h) st.gap2h++;
      if (m.unanswered) st.unanswered++;
      if (m.neg) st.neg++;
      if (m.blocked) st.blocked++;

      var bs = st.byStore[s.store] = st.byStore[s.store] || {
        store: s.store, n: 0, blocked: 0, firsts: [], alls: [], slow: 0,
        maxGap: null, unanswered: 0, gap2h: 0, msgs: 0, agentMsgs: 0, buyerReal: 0, agents: {}
      };
      bs.n++; bs.msgs += m.msgs; bs.agentMsgs += m.agentMsgs; bs.buyerReal += m.buyerReal;
      bs.blocked += m.blocked ? 1 : 0;
      bs.unanswered += m.unanswered ? 1 : 0;
      bs.gap2h += m.gap2h ? 1 : 0;
      bs.slow += m.slow;
      m.firsts.forEach(function (x) { bs.firsts.push(x); });
      m.alls.forEach(function (x) { bs.alls.push(x); });
      if (m.maxGap != null && (bs.maxGap == null || m.maxGap > bs.maxGap)) bs.maxGap = m.maxGap;
      m.agentNames.forEach(function (a) { bs.agents[a] = 1; });

      m.agentNames.forEach(function (a) {
        var ba = st.byAgent[a] = st.byAgent[a] || {
          name: a, n: 0, msgs: 0, firsts: [], alls: [], slow: 0, asked: 0, answered: 0, stores: {}
        };
        ba.n++; ba.stores[s.store] = 1;
      });
      /* 客服维度：会话内出现过的客服分摊该会话 */
      var owners = m.agentNames.length ? m.agentNames : ['未识别客服'];
      owners.forEach(function (a) {
        var ba = st.byAgent[a] = st.byAgent[a] || {
          name: a, n: 0, msgs: 0, firsts: [], alls: [], slow: 0, asked: 0, answered: 0, stores: {}
        };
        ba.stores[s.store] = 1;
      });

      Object.keys(m.themes).forEach(function (k) { st.themes[k] = (st.themes[k] || 0) + m.themes[k]; });
      m.evidences.forEach(function (e) {
        st.evidences.push({ theme: e.theme, text: e.text, t: e.t, store: s.store, cid: s.cid });
      });
    });

    /* 客服消息数 / 响应：单独按消息归属统计，避免分摊虚高 */
    var agentMsg = {};
    sessions.forEach(function (s) {
      s.items.forEach(function (x) {
        if (!isAgentRole(x.r)) return;
        var a = (x.r.agent || '').trim() || '未识别客服';
        agentMsg[a] = agentMsg[a] || { msgs: 0, firsts: [], alls: [], slow: 0, asked: 0, answered: 0 };
        agentMsg[a].msgs++;
      });
      /* 每个会话内的响应时长归给实际回复的客服（无法逐条归属时归给会话内客服） */
      var owners = s.m.agentNames.length ? s.m.agentNames : ['未识别客服'];
      var per = owners.length;
      s.m.alls.forEach(function (g) {
        owners.forEach(function (a) {
          agentMsg[a] = agentMsg[a] || { msgs: 0, firsts: [], alls: [], slow: 0, asked: 0, answered: 0 };
          agentMsg[a].alls.push(g);
        });
      });
      s.m.firsts.forEach(function (g) {
        owners.forEach(function (a) {
          agentMsg[a] = agentMsg[a] || { msgs: 0, firsts: [], alls: [], slow: 0, asked: 0, answered: 0 };
          agentMsg[a].firsts.push(g);
        });
      });
      owners.forEach(function (a) {
        agentMsg[a] = agentMsg[a] || { msgs: 0, firsts: [], alls: [], slow: 0, asked: 0, answered: 0 };
        agentMsg[a].slow += s.m.slow / per;
        agentMsg[a].answered += s.m.answered / per;
        agentMsg[a].asked += s.m.asked / per;
      });
    });
    Object.keys(agentMsg).forEach(function (a) {
      var g = agentMsg[a];
      var ba = st.byAgent[a] = st.byAgent[a] || { name: a, n: 0, msgs: 0, stores: {} };
      ba.msgs = g.msgs; ba.firsts = g.firsts; ba.alls = g.alls;
      ba.slow = Math.round(g.slow); ba.asked = Math.round(g.asked); ba.answered = Math.round(g.answered);
    });

    /* 24 小时分布：买家真实消息量 + 超 30 分钟断档次数 */
    sessions.forEach(function (s) {
      s.items.forEach(function (x) {
        if (isBuyerRole(x.r) && isRealMsg(x.r)) st.msgByHour[new Date(x.t).getHours()]++;
      });
      s.m.gapByHour.forEach(function (h) { st.gapHour[h]++; });
    });

    st.firstMed = median(st.firsts);
    st.allMed = median(st.alls);
    st.allP90 = pct(st.alls, 0.9);
    st.fast5 = st.alls.filter(function (x) { return x <= 300; }).length;
    st.rate = st.askedTotal = 0;
    var askedTotal = 0;
    sessions.forEach(function (s) { askedTotal += s.m.asked; });
    st.askedTotal = askedTotal;
    st.answeredTotal = st.alls.length;
    st.rate = askedTotal ? st.answeredTotal / askedTotal : 0;
    return st;
  }

  function qualityScan(sessions) {
    var types = {}, parts = {};
    sessions.forEach(function (s) {
      var hitType = {};
      s.items.forEach(function (x) {
        if (!isBuyerRole(x.r) || !isRealMsg(x.r)) return;
        var c = x.r.content || '';
        QUALITY_TYPES.forEach(function (t) {
          if (!t.re.test(c)) return;
          hitType[t.name] = true;
          var ty = types[t.name] = types[t.name] || { name: t.name, link: t.link, sessions: {}, voices: [] };
          ty.sessions[s.store + '||' + s.cid] = 1;
          if (ty.voices.length < 3) ty.voices.push(c);
          /* 部位抽取 */
          PARTS.forEach(function (p) {
            if (c.indexOf(p) < 0) return;
            var key = p + '||' + t.name;
            var pk = parts[key] = parts[key] || { part: p, type: t.name, sessions: {}, voice: c, store: s.store };
            pk.sessions[s.store + '||' + s.cid] = 1;
          });
        });
      });
    });
    return { types: types, parts: parts };
  }

  function lossScan(sessions) {
    var out = [];
    sessions.forEach(function (s) {
      var hit = null, quote = '';
      for (var i = 0; i < s.items.length; i++) {
        var x = s.items[i];
        if (!isBuyerRole(x.r) || !isRealMsg(x.r)) continue;
        var c = x.r.content || '';
        for (var j = 0; j < LOSS_SIGNALS.length; j++) {
          if (LOSS_SIGNALS[j].re.test(c)) { hit = LOSS_SIGNALS[j]; quote = c; break; }
        }
        if (hit) break;
      }
      if (!hit) return;
      var reason = quote;
      out.push({
        store: s.store, cid: s.cid, signal: hit, quote: quote, reason: reason,
        session: s, score: (s.m.blocked ? 2 : 0) + (s.m.unanswered ? 2 : 0) + s.m.evidences.length
      });
    });
    out.sort(function (a, b) { return b.score - a.score; });
    return out;
  }

  function scriptFor(sigKey, quote) {
    var head = '【人工审核草稿，未发送】亲，看到您提到“' + quote + '”，';
    var mid;
    if (sigKey === 'refund') mid = '很抱歉给您带来不好的体验。这边已为您登记，退换货流程与运费承担会按后台实际规则确认后一次性回复您，不让您反复说明。';
    else if (sigKey === 'cancel') mid = '理解您的顾虑，我先确认您真正的需求和使用场景，能调整的方案（尺寸、搭配、数量）会一次给您列清楚。';
    else if (sigKey === 'price') mid = '关于价格与优惠，我先核对当前可使用的活动与赠品方案，能争取的部分会直接给您明确答复。';
    else if (sigKey === 'quality') mid = '关于您反馈的商品问题，我先登记具体现象并安排复核，确认后给您换新 / 补发 / 补偿的明确方案。';
    else if (sigKey === 'logi') mid = '关于发货与时效，我先帮您核实订单当前状态和预计送达时间，有异常会第一时间给您处理方案。';
    else mid = '我先按当前记录核对您遇到的具体问题和期望方案，涉及退换、运费、时效或补偿的内容，会以后台实际规则确认后一次回复您，避免让您重复说明。';
    return head + mid + '您目前更希望优先解决继续使用、换新还是退货？';
  }

  /* ================= SVG 图形 ================= */
  function arcPath(cx, cy, r, a0, a1) {
    var large = (a1 - a0) > Math.PI ? 1 : 0;
    var x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    var x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    return 'M ' + cx.toFixed(2) + ' ' + cy.toFixed(2) +
      ' L ' + x0.toFixed(2) + ' ' + y0.toFixed(2) +
      ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' Z';
  }
  function pie(items, total, centerNum, centerLabel) {
    if (!total) {
      return '<svg viewBox="0 0 260 260" role="img"><circle cx="130" cy="130" r="100" fill="#f1f5f9"/>' +
        '<text x="130" y="130" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#94a3b8">暂无数据</text></svg>';
    }
    var a = -Math.PI / 2, out = [];
    if (items.length === 1) {
      out.push('<circle cx="130" cy="130" r="100" fill="' + items[0].color + '"><title>' +
        esc(items[0].label) + ' 100.0%</title></circle>');
    } else {
      items.forEach(function (it) {
        if (!it.v) return;
        var sweep = it.v / total * Math.PI * 2;
        out.push('<path d="' + arcPath(130, 130, 100, a, a + sweep) + '" fill="' + it.color + '"><title>' +
          esc(it.label) + ' ' + pctStr(it.v, total) + '</title></path>');
        a += sweep;
      });
    }
    out.push('<circle cx="130" cy="130" r="55" fill="#fff"/>');
    out.push('<text x="130" y="120" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="700" fill="#0f172a">' + esc(centerNum) + '</text>');
    out.push('<text x="130" y="146" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#64748b">' + esc(centerLabel) + '</text>');
    return '<svg viewBox="0 0 260 260" role="img">' + out.join('') + '</svg>';
  }

  function hourChart(msgByHour, gapHour) {
    var W = 1080, H = 430, x0 = 70, yBase = 340, plotH = 260, slot = (W - x0 - 40) / 24;
    var maxMsg = Math.max.apply(null, msgByHour.concat([1]));
    var maxGap = Math.max.apply(null, gapHour.concat([1]));
    var o = [];
    o.push('<text x="' + x0 + '" y="22" fill="#0f172a" font-size="15" font-weight="700">24 小时接待全景：浅柱 = 买家消息量，红柱 = 该小时发生的超 30 分钟断档</text>');
    /* 时段底纹 */
    o.push('<rect x="' + (x0 + 0).toFixed(1) + '" y="60" width="' + (slot * 8).toFixed(1) + '" height="' + plotH + '" fill="#f8fafc"/>');
    o.push('<text x="' + (x0 + 6) + '" y="76" fill="#94a3b8" font-size="11">凌晨 00:00–08:00</text>');
    o.push('<text x="' + (x0 + slot * 8 + 6) + '" y="76" fill="#94a3b8" font-size="11">白天 08:00–18:00</text>');
    o.push('<text x="' + (x0 + slot * 18 + 6) + '" y="76" fill="#94a3b8" font-size="11">晚间 18:00–24:00</text>');
    /* 网格线 */
    for (var gi = 0; gi <= 4; gi++) {
      var gy = yBase - plotH * gi / 4;
      o.push('<line x1="' + x0 + '" y1="' + gy.toFixed(1) + '" x2="' + (W - 40) + '" y2="' + gy.toFixed(1) + '" stroke="#eef2f7"/>');
    }
    var bw = Math.min(13, slot / 2 - 3);
    for (var h = 0; h < 24; h++) {
      var cx = x0 + slot * h;
      var hm = msgByHour[h] / maxMsg * plotH;
      var hg = gapHour[h] / maxGap * plotH;
      o.push('<rect x="' + (cx + 4).toFixed(1) + '" y="' + (yBase - hm).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(hm, 1).toFixed(1) + '" fill="#cbd5e1"><title>' + h + ' 点：买家消息 ' + msgByHour[h] + ' 条</title></rect>');

        o.push('<rect x="' + (cx + 6 + bw).toFixed(1) + '" y="' + (yBase - hg).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(hg, 2).toFixed(1) + '" fill="#ef4444"><title>' + h + ' 点：超 30 分钟断档 ' + gapHour[h] + ' 次</title></rect>');
      }
      if (h % 3 === 0) {
        o.push('<text x="' + (cx + slot / 2).toFixed(1) + '" y="' + (yBase + 18) + '" text-anchor="middle" fill="#64748b" font-size="11">' + pad2(h) + '</text>');
      }
    }
    o.push('<line x1="' + x0 + '" y1="' + yBase + '" x2="' + (W - 40) + '" y2="' + yBase + '" stroke="#cbd5e1"/>');
    /* 图例 */
    o.push('<rect x="' + x0 + '" y="378" width="12" height="12" fill="#cbd5e1"/><text x="' + (x0 + 18) + '" y="388" fill="#64748b" font-size="11.5">买家消息量（峰值 ' + maxMsg + ' 条/小时）</text>');
    o.push('<rect x="' + (x0 + 250) + '" y="378" width="12" height="12" fill="#ef4444"/><text x="' + (x0 + 268) + '" y="388" fill="#64748b" font-size="11.5">超 30 分钟断档次数（峰值 ' + maxGap + ' 次/小时）</text>');

    return '<div class="diagram"><svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,\'PingFang SC\',sans-serif">' + o.join('') + '</svg></div>';
  }

      parts.forEach(function (p) {
        o.push('<tr><td>' + storeBadge(p.store) + '</td><td><strong>' + esc(p.part) + '</strong></td>' +
          '<td>' + esc(p.type) + '</td><td class="num-cell"><strong>' + p.sessions.length + '</strong></td>' +
          '<td><div class="rk-voices"><span class="plan-voice">“' + esc(clip(p.voice, 40)) + '”</span></div></td></tr>');
      });
    }
    o.push('</table></div>');
    o.push('<div class="evidence-scope-note">口径：本章为<strong>关键词近似估算</strong>——用买家原话中的质量问题词与已知部件名匹配，' +
      '没有经过人工或模型逐条标注，可能存在误判与漏判；否定句、假设咨询不计入。同一会话同一类型只计一次，同一会话可命中多个不同类型，故各列不可直接相加。</div>');
    o.push('</section>');
    return o.join('');
  }

  function ch5(st, losses) {
    var o = [];
    o.push('<section class="section" id="followup"><h2><span class="num-badge">5</span>客户挽留与回复话术</h2>');
    o.push('<div class="callout"><div class="callout-title">结论：共识别 ' + losses.length + ' 个流失信号会话，按严重程度排序</div>');
    o.push('<p>· 流失信号来自买家原话中的退货 / 取消 / 价格敏感 / 质量抱怨 / 时效不满等关键词。</p>');
    o.push('<p>· 下面给出<strong>人工审核草稿话术</strong>（未发送），需商家确认后台规则后再使用。</p>');
    o.push('</div>');

    if (!losses.length) {
      o.push('<p class="not-supported">本次筛选范围内没有识别到流失信号。</p></section>');
      return o.join('');
    }

    losses.slice(0, 8).forEach(function (L) {
      var pri = L.score >= 4 ? 'P0' : (L.score >= 2 ? 'P1' : 'P2');
      var color = pri === 'P0' ? '#ef4444' : (pri === 'P1' ? '#f59e0b' : '#64748b');
      o.push('<div class="plan-card"><div class="plan-head">' +
        '<span class="plan-priority" style="background:' + color + '">' + pri + '</span>' +
        storeBadge(L.store) +
        '<span class="plan-title">' + esc(L.cid) + '</span>' +
        '<span class="badge ' + L.signal.cls + '">' + esc(L.signal.label) + '</span></div>');
      o.push('<div class="plan-row"><div class="plan-row-label">流失原因</div><div class="plan-row-body">' + esc(clip(L.reason, 80)) + '</div></div>');
      o.push('<div class="plan-row"><div class="plan-row-label">挽回话术</div><div class="plan-row-body plan-script">' + esc(scriptFor(L.signal.key, clip(L.quote, 40))) + '</div></div>');
      o.push(timeline(L.session));
      o.push('</div>');
    });
    o.push('<div class="rp-scope">最多展示 8 个会话（按「卡点 + 未接话 + 证据条数」综合排序）。话术为模板草稿，未发送、未调用任何生产写接口。</div>');
    o.push('</section>');
    return o.join('');
  }

  function timeline(s) {
    var items = s.items.slice(-40);
    var o = ['<div class="case-item plan-replay is-collapsed">' +
      '<button type="button" class="case-item-head" aria-expanded="false">' +
      '<span class="case-idx">会话还原</span><span class="case-counterpart">👤 ' + esc(s.cid) + '</span>' +
      '<span class="badge">' + s.items.length + ' 条消息</span>' +
      '<span class="case-toggle"><span class="case-toggle-text">展开</span></span></button>' +
      '<div class="case-body" hidden>'];
    var prev = null;
    items.forEach(function (x) {
      var r = x.r;
      var cls = isBuyerRole(r) ? 'tl-user' : (isAgentRole(r) ? 'tl-agent' : 'tl-note');
      var real = isBuyerRole(r) ? isRealMsg(r) : true;
      var evi = isBuyerRole(r) && real && NEG_RE.test(r.content || '');
      if (evi) cls += ' tl-evidence tl-emotion';
      var gapHtml = '';
      if (prev != null) {
        var g = (x.t - prev) / 1000;
        if (g >= SLOW_SEC && g <= MAX_GAP_SEC) {
          gapHtml = '<span class="tl-gap ' + (g > GAP2H ? 'is-bad' : 'is-warn') + '">+' + fmtSec(g) + '</span>';
        }
      }
      prev = x.t;
      o.push('<div class="tl-step ' + cls + '"><div class="tl-dot">' + (isBuyerRole(r) ? '买' : '客') + '</div>' +
        '<span class="tl-time">' + fmtTime(x.t) + gapHtml + '</span>' +
        '<div class="tl-bubble"><span class="b-label">' + esc(r.role || '') + '</span>' +
        (evi ? tagOf(r.content || '') : '') +
        '<div class="tl-text">' + esc(r.content || '') + '</div></div></div>');
    });
    o.push('</div></div>');
    return o.join('');
  }
  function tagOf(text) {
    var hit = THEMES.filter(function (t) { return t.re.test(text); })[0];
    return hit ? '<span class="tl-tag tag-evidence">' + esc(hit.name) + '</span><span class="tl-tag tag-emotion">卡点信号</span>' : '';
  }
  function fmtTime(t) {
    var d = new Date(t);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' +
      pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }
  function clip(s, n) {
    s = String(s || '').replace(/\s+/g, ' ').trim();
    return s.length > n ? s.slice(0, n) + '…' : s;
  }

  function ch6(st) {
    var o = [];
    var evs = st.evidences.slice().sort(function (a, b) { return b.t - a.t; });
    var byTheme = {};
    evs.forEach(function (e) { byTheme[e.theme] = (byTheme[e.theme] || 0) + 1; });
    var order = THEMES.filter(function (t) { return byTheme[t.key]; })
      .sort(function (a, b) { return byTheme[b.key] - byTheme[a.key]; });

    o.push('<section class="section" id="voice-wall"><h2><span class="num-badge">6</span>客户原声墙：一眼看到问题全貌</h2>');
    o.push('<div class="callout"><div class="callout-title">结论：' + evs.length + ' 句原话里，' +
      (order.length ? esc(order[0].name) + '最多（' + byTheme[order[0].key] + ' 句）' : '暂无命中') + '</div>');
    o.push('<p>· 共 ' + evs.length + ' 句原话：' + (order.length ? order.map(function (t) {
      return esc(t.name) + ' <strong>' + byTheme[t.key] + ' 句</strong>';
    }).join('、') : '无') + '。</p>');
    o.push('<p>· 与第 1 章抱怨主题互为印证；识别方式为关键词近似，仅供参考。</p>');
    o.push('</div>');

    o.push('<div class="voice-wall">');
    evs.slice(0, 60).forEach(function (e) {
      var t = THEMES.filter(function (x) { return x.key === e.theme; })[0];
      o.push('<div class="voice-card"><div class="voice-text">“' + esc(clip(e.text, 60)) + '”</div>' +
        '<div class="voice-meta"><span class="voice-dim">' + esc(t ? t.name : e.theme) + '</span>' +
        '<span>' + esc(e.store) + ' · ' + esc(e.cid) + '</span></div></div>');
    });
    o.push('</div>');
    if (evs.length > 60) o.push('<div class="rank-note">原声较多，仅展示最近 60 句（共 ' + evs.length + ' 句）。</div>');
    o.push('</section>');
    return o.join('');
  }

  /* ================= 筛选 ================= */
  function inRange(r) {
    if (!filters.start && !filters.end) return true;
    var d = dsOf(r);
    if (!d) return false;
    if (filters.start && d < filters.start) return false;
    if (filters.end && d > filters.end) return false;
    return true;
  }
  function applyFilter() {
    return allRecords.filter(function (r) {
      if (filters.store && r.store !== filters.store) return false;
      if (filters.agent) {
        if (isAgentRole(r) && (r.agent || '').trim() !== filters.agent) return false;
      }
      return inRange(r);
    });
  }
  function computePreset(name) {
    var now = new Date();
    var y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
    if (name === 'today') return { s: toDS(new Date(y, m, d)), e: toDS(new Date(y, m, d)) };
    if (name === 'yesterday') return { s: toDS(new Date(y, m, d - 1)), e: toDS(new Date(y, m, d - 1)) };
    if (name === '7d') return { s: toDS(new Date(y, m, d - 6)), e: toDS(new Date(y, m, d)) };
    if (name === '30d') return { s: toDS(new Date(y, m, d - 29)), e: toDS(new Date(y, m, d)) };
    if (name === 'month') return { s: toDS(new Date(y, m, 1)), e: toDS(new Date(y, m + 1, 0)) };
    return { s: dataMin, e: dataMax };
  }
  function syncDateUI() {
    var btns = document.querySelectorAll('#dateQuick button');
    Array.prototype.forEach.call(btns, function (b) {
      b.classList.toggle('active', b.getAttribute('data-range') === filters.preset);
    });
    $('dateStart').value = filters.start || '';
    $('dateEnd').value = filters.end || '';
  }
  function setDate(preset) {
    var r = computePreset(preset);
    filters.preset = preset;
    filters.start = r.s; filters.end = r.e;
    syncDateUI();
  }
  function onManualDate() {
    var s = $('dateStart').value, e = $('dateEnd').value;
    if (s && e && s > e) { var t = s; s = e; e = t; }
    filters.start = s; filters.end = e;
    filters.preset = '';
    syncDateUI();
  }
  function renderHint() {
    var parts = [];
    parts.push((filters.start || dataMin) + ' ~ ' + (filters.end || dataMax));
    if (filters.store) parts.push(filters.store);
    if (filters.agent) parts.push('客服 ' + filters.agent);
    $('filterHint').textContent = '当前：' + parts.join(' · ');
  }

  /* ================= 主流程 ================= */
  function renderReport() {
    var btn = $('btnGen');
    btn.disabled = true;
    btn.textContent = '生成中…';
    setTimeout(function () {
      try {
        var rows = applyFilter();
        var sessions = buildSessions(rows).map(analyzeSession);
        var st = computeAll(sessions);
        var q = qualityScan(sessions);
        var losses = lossScan(sessions);

        var hint = {
          range: (filters.start || dataMin) + ' ~ ' + (filters.end || dataMax),
          store: filters.store || '全部店铺',
          agent: filters.agent || '全部客服'
        };
        $('rpPeriod').textContent = hint.range + ' · ' + rows.length + ' 条消息 · ' + st.n + ' 个会话';

        if (!rows.length) {
          bodyEl.innerHTML = '<div class="rp-empty"><h3>没有符合条件的数据</h3><p>当前筛选：' +
            esc(hint.range + ' · ' + hint.store + ' · ' + hint.agent) + '<br>请放宽时间范围或清空店铺 / 客服条件后重新生成。</p></div>';
        } else {
          bodyEl.innerHTML = [
            renderHero(st, hint),
            ch1(st), ch2(st), ch3(st), ch4(st, q), ch5(st, losses), ch6(st)
          ].join('');
        }
        renderHint();
      } catch (err) {
        bodyEl.innerHTML = '<div class="rp-error">生成报告失败：' + esc(err && err.message ? err.message : err) + '</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = '生成报告';
      }
    }, 20);
  }

  function fillSel(id, allLabel, list) {
    var el = $(id);
    el.innerHTML = '<option value="">' + allLabel + '</option>' +
      list.map(function (v) { return '<option value="' + esc(v) + '">' + esc(v) + '</option>'; }).join('');
  }

  function bind() {
    Array.prototype.forEach.call(document.querySelectorAll('#dateQuick button'), function (b) {
      b.addEventListener('click', function () { setDate(b.getAttribute('data-range')); });
    });
    $('dateStart').addEventListener('change', onManualDate);
    $('dateEnd').addEventListener('change', onManualDate);
    $('selStore').addEventListener('change', function () { filters.store = this.value; renderHint(); });
    $('selAgent').addEventListener('change', function () { filters.agent = this.value; renderHint(); });
    $('btnGen').addEventListener('click', renderReport);
    $('btnClearFilter').addEventListener('click', function () {
      filters.store = ''; filters.agent = '';
      $('selStore').value = ''; $('selAgent').value = '';
      setDate('all');
      renderHint();
      renderReport();
    });
  }

  function loadData() {
    fetch('/api/qianniu-chat').then(function (r) { return r.json(); }).then(function (j) {
      allRecords = (j && j.records) || [];
      if (!allRecords.length) {
        bodyEl.innerHTML = '<div class="rp-empty"><h3>暂无聊天数据</h3><p>请先在「千牛聊天记录 / 千牛聊天分析」页导入聊天数据。</p></div>';
        $('rpPeriod').textContent = '无数据';
        return;
      }
      var ds = allRecords.map(dsOf).filter(Boolean).sort();
      dataMin = ds[0] || ''; dataMax = ds[ds.length - 1] || '';

      var stores = uniq(allRecords.map(function (r) { return r.store; }).filter(Boolean));
      var agents = uniq(allRecords.filter(isAgentRole).map(function (r) { return (r.agent || '').trim(); }).filter(Boolean))
        .sort(function (a, b) { return a.localeCompare(b, 'zh'); });
      fillSel('selStore', '全部店铺', stores);
      fillSel('selAgent', '全部客服', agents);

      setDate('all');
      bind();
      renderHint();
      renderReport();
    }).catch(function (e) {
      bodyEl.innerHTML = '<div class="rp-error">读取聊天数据失败：' + esc(e && e.message ? e.message : e) + '</div>';
      $('rpPeriod').textContent = '读取失败';
    });
  }

  loadData();
})();
</script>

</body>
</html>
