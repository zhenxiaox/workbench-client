<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客户待办</title>
<link rel="stylesheet" href="scrollbar.css">
<style>
  :root{
    --bg:#FAF7F5; --surface:#FFFFFF; --surface2:#F3EDE8; --surface3:#FBF8F1;
    --line:#EFE6DE; --line2:#DCD2C9; --line3:#ECECEE;
    --ink:#221813; --ink2:#4A3A30; --muted:#7B6A61; --muted2:#A99A90;
    --accent:#F97316; --accent-d:#EA580C; --accent-soft:rgba(249,115,22,0.10); --accent-line:rgba(249,115,22,0.35);
    --hi:#E5484D; --hi-soft:rgba(229,72,77,0.10);
    --ok:#30A46C; --blue:#3B82F6;
    --black:#221813;
    --shadow-sm:0 1px 3px rgba(60,50,41,0.05), 0 1px 2px rgba(60,50,41,0.04);
    --shadow-md:0 8px 28px rgba(60,50,41,0.14);
    --radius:10px;
  }
  html[data-theme="dark"]{
    --bg:#0E0F11; --surface:#17181A; --surface2:#1F2123; --surface3:#1A1B1D;
    --line:#26282B; --line2:#34363A; --line3:#2A2C2F;
    --ink:#F0F0F2; --ink2:#D6D6DA; --muted:#9A9AA0; --muted2:#6E6E73;
    --accent:#F97316; --accent-d:#FB923C; --accent-soft:rgba(249,115,22,0.16); --accent-line:rgba(249,115,22,0.4);
    --hi:#F2555A; --hi-soft:rgba(242,85,90,0.16);
    --ok:#3ECF8E; --blue:#60A5FA;
    --black:#FFFFFF;
    --shadow-sm:0 1px 3px rgba(0,0,0,0.4);
    --shadow-md:0 8px 28px rgba(0,0,0,0.5);
  }
  html[data-theme="eye"]{
    --bg:#F5F1E8; --surface:#FBF8F1; --surface2:#F0EADC; --surface3:#FBF8F1;
    --line:#E5DCCB; --line2:#D5C9B4; --line3:#E5DCCB;
    --ink:#3C3229; --ink2:#5A4B3C; --muted:#7A6E5F; --muted2:#A2957F;
    --accent:#F97316; --accent-d:#EA580C; --accent-soft:rgba(249,115,22,0.12); --accent-line:rgba(249,115,22,0.4);
    --hi:#C0392B; --hi-soft:rgba(192,57,43,0.14);
    --ok:#2F9E63; --blue:#3B82F6;
    --black:#3C3229;
    --shadow-sm:0 1px 3px rgba(60,50,41,0.05), 0 1px 2px rgba(60,50,41,0.04);
    --shadow-md:0 8px 28px rgba(60,50,41,0.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .app{padding:0 28px 20px;display:flex;flex-direction:column;min-height:100%;}

  /* ===== 头部：标题 + 日期 + 新增 ===== */
  .head{display:flex;align-items:center;justify-content:space-between;margin:0 -28px 18px;padding:16px 28px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg, rgba(249,115,10,0.06), transparent);}
  .head-left{}
  .head-title{font-size:19px;font-weight:700;letter-spacing:-0.01em;line-height:1.25;display:flex;align-items:center;}
  .head-title::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(249,115,10,0.15);margin-right:10px;flex-shrink:0;}
  .head-sub{font-size:12px;color:var(--muted);margin-top:4px;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);
    color:var(--ink);font-size:13px;padding:8px 14px;border-radius:9px;transition:.15s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .btn.primary:hover{background:var(--accent-d);color:#fff;}
  .btn.dark{background:var(--black);border-color:var(--black);color:var(--bg);font-weight:600;}
  html[data-theme="dark"] .btn.dark{color:#111;}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted);}
  .btn.ghost:hover{color:var(--accent);border-color:transparent;}
  .btn.ghost.danger:hover{color:var(--hi);}
  .btn.small{padding:5px 10px;font-size:12px;border-radius:8px;}

  /* ===== 搜索 + 状态页签 ===== */
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .search{
    position:relative;flex:1;min-width:160px;
  }
  .search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted2);font-size:13px;pointer-events:none;}
  .search input{
    width:100%;background:var(--surface2);border:1px solid transparent;border-radius:9px;color:var(--ink);
    padding:8px 12px 8px 32px;font-size:13px;outline:none;transition:.15s;
  }
  .search input:focus{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .search input::placeholder{color:var(--muted2);}
  .filter-btn{border:1px solid var(--line2);background:var(--surface);color:var(--muted);width:36px;height:36px;border-radius:9px;font-size:15px;display:flex;align-items:center;justify-content:center;}

  .tabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;}
  .tab{
    background:none;border:0;color:var(--muted);font-size:14px;font-weight:500;padding:10px 14px;position:relative;white-space:nowrap;transition:.15s;border-radius:6px 6px 0 0;
  }
  .tab .cnt{font-variant-numeric:tabular-nums;color:var(--muted2);margin-left:4px;font-weight:400;}
  .tab:hover{color:var(--ink);}
  .tab.on{color:var(--ink);font-weight:600;}
  .tab.on::after{content:'';position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px;}
  .tab.on .cnt{color:var(--accent);}

  /* ===== 任务分类面板（2026-09-18）===== */
  .cat-pop{
    position:fixed;z-index:60;width:300px;background:var(--surface);border:1px solid var(--line2);
    border-radius:12px;box-shadow:var(--shadow-md);padding:12px 14px 10px;
  }
  /* ⚠️ .cat-pop 是 position:fixed → [hidden] 对它无效，必须显式补一条（本项目反复踩的坑） */
  .cat-pop[hidden]{display:none;}
  .cat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
  .cat-head b{font-size:14px;color:var(--ink);}
  .cat-x{background:none;border:0;color:var(--muted2);font-size:14px;padding:2px 5px;border-radius:6px;line-height:1;}
  .cat-x:hover{color:var(--hi);background:var(--hi-soft);}
  .cat-sub{font-size:11.5px;color:var(--muted2);margin-bottom:9px;}
  .cat-seg{display:flex;gap:6px;background:var(--surface2);border-radius:9px;padding:3px;margin-bottom:10px;}
  .cat-seg-b{flex:1;background:none;border:0;color:var(--muted);font-size:12.5px;padding:6px 0;border-radius:7px;transition:.15s;}
  .cat-seg-b.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm);}
  .cat-list{display:flex;flex-direction:column;gap:7px;}
  .cat-row{
    display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line2);
    border-radius:9px;padding:8px 10px;min-height:40px;
  }
  .cat-row.dragging{opacity:.6;border-color:var(--accent);}
  .cat-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .cat-inp{
    flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:6px;
    color:var(--ink);font-size:13.5px;padding:3px 6px;outline:none;transition:.15s;
  }
  .cat-inp:hover{border-color:var(--line2);}
  .cat-inp:focus{border-color:var(--accent);background:var(--surface2);}
  .cat-num{font-size:12.5px;color:var(--muted2);font-variant-numeric:tabular-nums;flex:0 0 auto;}
  .cat-handle{cursor:grab;color:var(--muted2);font-size:15px;line-height:1;padding:0 2px;flex:0 0 auto;user-select:none;touch-action:none;}
  .cat-handle:active{cursor:grabbing;color:var(--accent);}
  /* 文字模式：藏起排序把手与序号；排序模式：名字只读，免得误改 */
  .cat-list.mode-text .cat-num,.cat-list.mode-text .cat-handle{display:none;}
  .cat-list.mode-order .cat-inp{pointer-events:none;}
  .cat-foot{display:flex;justify-content:flex-end;margin-top:9px;}
  .cat-reset{background:none;border:0;color:var(--muted2);font-size:11.5px;padding:2px 4px;border-radius:6px;}
  .cat-reset:hover{color:var(--accent);}

  /* ===== 列表 ===== */
  .list{flex:1;}
  .group{margin-bottom:18px;}
  .group-head{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:8px;}
  .group-head.over{color:var(--hi);}
  .group-head .g-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;}
  .group-head.over .g-dot{background:var(--hi);}
  .group-head .g-cnt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted2);font-weight:400;}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;margin-bottom:8px;
    box-shadow:var(--shadow-sm);transition:.15s;position:relative;
  }
  .card:hover{border-color:var(--line2);}
  .card.doing{border-left:3px solid var(--blue);}
  .card.done{opacity:.6;}
  .card.done .ci-title{text-decoration:line-through;color:var(--muted2);}
  .card.over{border-left:3px solid var(--hi);}
  .card.urgent{border-left:3px solid var(--accent);}

  .ci-src{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .ci-src .src-name{color:var(--accent);font-weight:500;}
  .ci-src .src-sep{color:var(--line2);}
  .ci-title{font-size:14.5px;font-weight:600;color:var(--ink);margin-top:2px;line-height:1.45;word-break:break-word;}
  .ci-note{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.55;word-break:break-word;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .ci-meta{display:flex;align-items:center;gap:7px;margin-top:3px;flex-wrap:wrap;font-size:11.5px;color:var(--muted2);}
  .chip{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap;}
  .chip.urgent{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);}
  .chip.over{color:#fff;background:var(--hi);border-color:var(--hi);}
  html[data-theme="light"] .chip.over{color:#fff;}
  .chip.doing{color:var(--blue);border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.08);}

  .ci-actions{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .ci-actions .btn{background:var(--surface);}
  .ci-actions .btn.urgent-on{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);}
  .act-spacer{margin-left:auto;}

  .empty{padding:46px 12px;text-align:center;color:var(--muted2);font-size:13px;}
  .empty .ico{font-size:34px;margin-bottom:10px;opacity:.7;}
  .ic{display:inline-flex;align-items:center;justify-content:center;vertical-align:-0.15em;}
  .ic svg{width:1em;height:1em;display:block;}

  /* ===== 底部状态栏 ===== */
  .footer{position:sticky;bottom:0;background:var(--bg);padding:12px 0 4px;margin-top:8px;border-top:1px solid var(--line);}
  .footer-inner{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);}
  .stat-dot{display:inline-flex;align-items:center;gap:6px;}
  .stat-dot i{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .stat-dot b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:1px;}
  .stat-dot.s-todo i{background:var(--accent);}
  .stat-dot.s-doing i{background:var(--blue);}
  .stat-dot.s-done i{background:var(--ok);}
  .shortcuts{margin-left:auto;color:var(--muted2);font-size:12px;}
  .shortcuts kbd{background:var(--surface2);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;font-family:inherit;font-size:11px;}

  /* ===== 弹窗 ===== */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,0.42);backdrop-filter:blur(2px);
    display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .mask.open{display:flex;}
  .dialog{
    background:var(--surface);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:500px;
    max-height:92vh;overflow:auto;box-shadow:var(--shadow-md);
  }
  .dialog-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;position:sticky;top:0;background:var(--surface);z-index:1;border-bottom:1px solid var(--line3);}
  .dialog-head h3{font-size:16px;font-weight:700;}
  .dialog-body{padding:16px 20px 8px;}
  .dialog-foot{display:flex;justify-content:flex-end;gap:9px;padding:12px 20px 18px;}
  /* 弹窗底栏左下角的删除按钮（2026-09-18 用户要求）。
     ⚠️ .btn 自带 display:inline-flex → [hidden] 对它**无效**，必须显式补 display:none，
        否则「新增待办」时这个删除按钮会一直显示（本项目踩过同类坑，见技能「陷阱 1」）。 */
  #fDelete{margin-right:auto;color:var(--hi);border-color:var(--hi-soft);}
  #fDelete:hover{background:var(--hi-soft);border-color:var(--hi);color:var(--hi);}
  #fDelete[hidden]{display:none;}

  .f-row{margin-bottom:13px;}
  .f-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500;}
  .f-row label b{color:var(--hi);font-weight:600;}
  .inp,.sel,.ta{
    width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:9px;color:var(--ink);
    padding:9px 11px;font-size:13.5px;outline:none;transition:.15s;
  }
  .ta{min-height:72px;resize:vertical;line-height:1.55;}
  .inp:focus,.sel:focus,.ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .inp::placeholder,.ta::placeholder{color:var(--muted2);}
  .f-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .f-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}

  .datebox{position:relative;}
  .datebox input::-webkit-calendar-picker-indicator{filter:grayscale(1) opacity(.6);cursor:pointer;}

  .quick-dates{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .qdate{border:1px solid var(--line2);background:var(--surface);color:var(--ink2);font-size:12px;padding:4px 11px;border-radius:999px;transition:.12s;}
  .qdate:hover{border-color:var(--accent);color:var(--accent);}
  .qdate.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;}

  .f-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer;}
  .f-check input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}

  .dropzone{
    border:1.5px dashed var(--line2);border-radius:10px;padding:18px;text-align:center;color:var(--muted);
    cursor:pointer;transition:.15s;font-size:13px;
  }
  .dropzone:hover,.dropzone.drag{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .dropzone .dz-hint{font-size:11.5px;color:var(--muted2);margin-top:5px;}
  .dz-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .dz-thumb{width:58px;height:58px;border-radius:8px;object-fit:cover;border:1px solid var(--line);position:relative;}
  .dz-thumb-wrap{position:relative;}
  .dz-thumb-x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--hi);color:#fff;border:0;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;}

  .ai-flag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);padding:4px 11px;border-radius:999px;}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);
    color:var(--bg);padding:9px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:300;box-shadow:var(--shadow-md);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* 图集 */
  .gallery{text-align:center;}
  .gallery img{max-width:100%;max-height:62vh;border-radius:10px;border:1px solid var(--line);}
  .gallery .nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;color:var(--muted);font-size:13px;}
  .gallery .nav button{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;color:var(--ink);}

  @media (max-width:640px){
    .app{padding:0 14px 12px;}
    .head{margin-left:-14px; margin-right:-14px; padding-left:14px; padding-right:14px;}
    .head-title{font-size:22px;}
    .f-grid,.f-grid-2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="app">
  <!-- 头部 -->
  <div class="head">
    <div class="head-left">
      <div class="head-title" id="headTitle">今日</div>
      <div class="head-sub" id="headSub"></div>
    </div>
    <button class="btn primary" id="addBtnTop" title="新增待办（Ctrl+N）｜也可直接按 Ctrl+V 粘贴截图或文字，会自动识别">＋ 新增</button>
  </div>

  <!-- 搜索 + 筛选 -->
  <div class="toolbar">
    <div class="search">
      <span class="mag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
      <input id="search" placeholder="搜索待办..." autocomplete="off">
    </div>
    <button class="filter-btn" id="filterBtn" title="任务分类">≡</button>
  </div>

  <!-- 任务分类面板（2026-09-18）
       背景：这个 ≡ 原来只弹一句「排序：按收到时间（新→旧）」的 toast，什么也没做，用户反馈「没什么用」。
       现在做成参考工具那种「任务分类」面板：改页签名字 + 拖动排序，存 localStorage。
       ⚠️ .cat-pop 是 position:fixed，[hidden] 对它无效 → 必须显式写 .cat-pop[hidden]{display:none}。 -->
  <div class="cat-pop" id="catPop" hidden>
    <div class="cat-head">
      <b>任务分类</b>
      <button class="cat-x" id="catClose" type="button" title="关闭" aria-label="关闭">✕</button>
    </div>
    <div class="cat-sub" id="catSub">点击文字即可修改</div>
    <div class="cat-seg">
      <button class="cat-seg-b on" type="button" data-m="text">✎ 文字</button>
      <button class="cat-seg-b" type="button" data-m="order">≡ 排序</button>
    </div>
    <div class="cat-list mode-text" id="catList"></div>
    <div class="cat-foot"><button class="cat-reset" id="catReset" type="button">恢复默认</button></div>
  </div>

  <!-- 状态页签（文字包在 .tl 里：改名时只换 .tl 的文字，不动 .cnt 计数徽标） -->
  <div class="tabs" id="tabs">
    <button class="tab on" data-v="today"><span class="tl">今日</span><span class="cnt" id="cntToday">0</span></button>
    <button class="tab" data-v="todo"><span class="tl">未完成</span><span class="cnt" id="cntTodo">0</span></button>
    <button class="tab" data-v="doing"><span class="tl">进行中</span><span class="cnt" id="cntDoing">0</span></button>
    <button class="tab" data-v="done"><span class="tl">已完成</span><span class="cnt" id="cntDone">0</span></button>
  </div>

  <!-- 列表 -->
  <div class="list" id="list"></div>

  <!-- 底部状态栏 -->
  <div class="footer">
    <div class="footer-inner">
      <span class="stat-dot s-todo"><i></i>未完成 <b id="stTodo">0</b></span>

<script>
(function(){
  'use strict';

  /* ============ 常量与状态 ============ */
  var APP = 'ctodo';
  var LS_KEY = 'wb_ctodo';
  var IS_SERVER = false;
  var state = { tasks: [] };
  var tab = 'today';
  var query = '';
  var editingId = null;
  var editAttach = [];    // 编辑中的附件 dataUrl 数组
  var galList = [];       // 图集数据
  var galIdx = 0;
  var cats = [];          // 任务分类（页签名 + 顺序），见 loadCats()
  var catMode = 'text';   // 任务分类面板当前页：text=改文字 / order=拖动排序

  /* ============ 日期工具 ============ */
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function dkey(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayMidnight(){ var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function todayKey(){ return dkey(todayMidnight()); }
  function addDays(n){ var d = new Date(); d.setDate(d.getDate() + n); return d; }
  function dateOf(s){
    if(!s) return null;
    var str = String(s);
    /* ★ 2026-09-18 修：receivedAt 存的是 ISO 时间戳（本地 00:00 → UTC 前一天 16:00）。
       以前一律 slice(0,10) 取「UTC 日期」，东八区下就会把「今天」显示成「昨天」
       （用户报障：记录时间 2026/09/18，卡片却写「收 昨天」）。
       完整时间戳必须先转成本地日期，再取年月日。dueAt 是纯日期串，走下面那条分支。 */
    if(str.indexOf('T') > 0){
      var dt = new Date(str);
      if(isNaN(dt.getTime())) return null;
      return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
    }
    var p = str.slice(0,10).split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return isNaN(d.getTime()) ? null : d;
  }
  function endOfWeekKey(){ var d = todayMidnight(); var off = d.getDay() === 0 ? 0 : 7 - d.getDay(); d.setDate(d.getDate() + off); return dkey(d); }

  function isOverdue(t){
    if(!t || t.done) return false;
    if(!t.dueAt) return false;
    return String(t.dueAt).slice(0,10) < todayKey();
  }
  function inToday(t){
    if(!t || t.done) return false;
    if(t.urgent) return true;
    if(!t.dueAt) return true;
    return String(t.dueAt).slice(0,10) <= todayKey();
  }
  function newId(){ return 'ct' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /* ============ 元素 ============ */
  var el = {
    headTitle: id('headTitle'), headSub: id('headSub'), addBtnTop: id('addBtnTop'),
    search: id('search'), filterBtn: id('filterBtn'), tabs: id('tabs'), list: id('list'),
    cntToday: id('cntToday'), cntTodo: id('cntTodo'), cntDoing: id('cntDoing'), cntDone: id('cntDone'),
    stTodo: id('stTodo'), stDoing: id('stDoing'), stDone: id('stDone'),
    editMask: id('editMask'), editTitle: id('editTitle'), aiFromClip: id('aiFromClip'),
    fCustomer: id('fCustomer'), fTitle: id('fTitle'),
    fReceived: id('fReceived'), fDue: id('fDue'), quickDates: id('quickDates'),
    fNote: id('fNote'), fUrgent: id('fUrgent'), fDoing: id('fDoing'),
    dropzone: id('dropzone'), dzFile: id('dzFile'), dzThumbs: id('dzThumbs'), aiHint: id('aiHint'),
    fCancel: id('fCancel'), fSave: id('fSave'), fDelete: id('fDelete'), custList: id('custList'),
    catPop: id('catPop'), catSub: id('catSub'), catList: id('catList'),
    catClose: id('catClose'), catReset: id('catReset'), catSeg: document.querySelector('.cat-seg'),
    galMask: id('galMask'), galTitle: id('galTitle'), galImg: id('galImg'),
    galIdx: id('galIdx'), galPrev: id('galPrev'), galNext: id('galNext'), galClose: id('galClose'),
    toast: id('toast')
  };
  function id(x){ return document.getElementById(x); }

  /* ============ 存储与同步 ============ */
  /* ★★★ 2026-09-23 重写「悬浮球角标慢一拍」：
     旧做法（09-18）是"发两次通知、赌第二次在 POST 之后到"，属于**竞态补丁**：
       · POST 未返回就 notifyParent() → 外壳立刻 GET → 读到旧列表（实测第一次 GET 返回 0 条）；
       · 再靠 POST 的 .then 补发第二次通知纠正 → 外壳**再 GET 一次**才拿到新数据。
     → 代价是「两次通知 + 两次 GET」，角标要等第二个来回才正确；
       网络稍慢（生产 8787 会比本地慢）就明显可感，用户看到的就是「过一会才同步」。

     ★ 正解：**把数据直接带在消息里**（postMessage 是结构化克隆，传数组零成本）。
       外壳收到后直接更新自己的 _mem.ctodo 并重算角标 —— 不再需要任何 GET，
       角标必然与刚保存的内容一致，也彻底消除了竞态。
       仍然带 `app` 字段，方便外壳判断该更新哪个槽位（目前只有 ctodo 用）。 */
  function notifyParent(){
    try{
      if(window.parent && window.parent !== window){
        window.parent.postMessage({
          type: 'wb-ctodo-changed',
          app: APP,
          /* ★ 传当前完整列表：外壳据此直接更新内存缓存，省掉一次 GET */
          tasks: state.tasks
        }, '*');
      }
    }catch(e){}
  }
  function normalize(){
    state.tasks.forEach(function(t){
      if(!t.status){
        t.status = t.done ? 'done' : 'todo';
      }
      t.done = (t.status === 'done');
      if(t.status === 'done' && !t.completedAt) t.completedAt = new Date().toISOString();
      if(t.status !== 'done') t.completedAt = '';
    });
  }
  function persist(){
    var arr = state.tasks;
    try{ localStorage.setItem(LS_KEY, JSON.stringify(arr)); }catch(e){}
    /* ★ 本地已就绪 → 立刻通知（带数据），角标马上正确。
       POST 落库只影响磁盘，不再需要「补发第二次通知」来纠正竞态。 */
    notifyParent();
    if(IS_SERVER){
      fetch('/api/backup?app=' + APP, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(arr) })
        .catch(function(){});
    }
  }
  function loadLocal(){
    try{ state.tasks = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }catch(e){ state.tasks = []; }
    if(!Array.isArray(state.tasks)) state.tasks = [];
    normalize(); renderAll();
  }
  function load(){
    if(IS_SERVER){
      fetch('/api/backup?app=' + APP, { cache: 'no-store' }).then(function(r){
        if(r.status === 204) return 'EMPTY';
        if(!r.ok) throw new Error('bad');
        return r.json();
      }).then(function(d){
        if(d === 'EMPTY'){
          var local = null; try{ local = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }catch(e){}
          if(local && local.length){ state.tasks = local; persist(); }
          else { state.tasks = []; }
        } else {
          state.tasks = Array.isArray(d) ? d : [];
        }
        normalize(); renderAll();
      }).catch(function(){ loadLocal(); });
    } else {
      loadLocal();
    }
  }
  function detectServer(cb){
    fetch('/__wb', { cache: 'no-store' }).then(function(r){ return r.json(); })
      .then(function(j){ if(j && j.server === 'workbench') IS_SERVER = true; cb(); })
      .catch(function(){ cb(); });
  }

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function fmtShortDate(s){
    if(!s) return '';
    var d = dateOf(s); if(!d) return String(s).slice(0,10);
    var tk = todayKey(), k = dkey(d);
    if(k === tk) return '今天';
    if(k === dkey(addDays(1))) return '明天';
    if(k === dkey(addDays(-1))) return '昨天';
    return (d.getMonth()+1) + '月' + d.getDate() + '日';
  }

  /* ============ 任务分类（页签改名 + 拖动排序）============
     2026-09-18：原来工具栏那个 ≡ 只弹一句 toast、什么都没做。
     现在做成参考工具那样的「任务分类」面板，配置存 localStorage.wb_ctodo_cats。
     只动**显示**（名字与顺序），不动 data-v 的语义 —— 今日/未完成/进行中/已完成
     背后各对应一套统计口径（今日=inToday、其余=status），改名不会改口径。 */
  var CAT_KEY = 'wb_ctodo_cats';
  var CAT_DEF = [
    { v:'today', label:'今日',   dot:'var(--blue)' },
    { v:'todo',  label:'未完成', dot:'var(--accent)' },
    { v:'doing', label:'进行中', dot:'var(--blue)' },
    { v:'done',  label:'已完成', dot:'var(--ok)' }
  ];
  function catDef(v){
    for(var i = 0; i < CAT_DEF.length; i++) if(CAT_DEF[i].v === v) return CAT_DEF[i];
    return null;
  }
  function loadCats(){
    var raw = null;
    try{ raw = JSON.parse(localStorage.getItem(CAT_KEY) || 'null'); }catch(e){ raw = null; }
    var order = (raw && Array.isArray(raw.order)) ? raw.order.filter(function(v){ return !!catDef(v); }) : [];
    CAT_DEF.forEach(function(d){ if(order.indexOf(d.v) < 0) order.push(d.v); });   // 补齐缺失项
    var labels = (raw && raw.labels && typeof raw.labels === 'object') ? raw.labels : {};
    return order.map(function(v){
      var d = catDef(v);
      var lb = labels[v];
      var label = (typeof lb === 'string' && lb.trim()) ? lb.trim().slice(0, 6) : d.label;
      return { v: v, label: label, dot: d.dot };
    });
  }
  function saveCats(){
    var order = [], labels = {};
    cats.forEach(function(c){ order.push(c.v); labels[c.v] = c.label; });
    try{ localStorage.setItem(CAT_KEY, JSON.stringify({ order: order, labels: labels })); }catch(e){}
  }
  function catLabel(v){
    for(var i = 0; i < cats.length; i++) if(cats[i].v === v) return cats[i].label;
    var d = catDef(v); return d ? d.label : v;
  }
  /* 把**内存里的 cats** 套到页签上：appendChild 会把节点移到末尾，按顺序 append 即完成重排。
     ⚠️ 这里绝不能顺手 loadCats() 重读存储 —— 改名时 input 事件只改了内存 c.label、
     还没落盘（落盘在 blur），一重载就把用户正在输入的字冲回去了（2026-09-18 探针抓到）。 */
  function applyCats(){
    cats.forEach(function(c){
      var b = el.tabs.querySelector('.tab[data-v="' + c.v + '"]');
      if(!b) return;
      var tl = b.querySelector('.tl');
      if(tl) tl.textContent = c.label;
      el.tabs.appendChild(b);
    });
  }
  function renderCatPanel(){
    el.catSub.textContent = catMode === 'text' ? '点击文字即可修改' : '从右侧把手拖动排序';
    el.catList.className = 'cat-list mode-' + catMode;
    el.catList.innerHTML = '';
    cats.forEach(function(c, i){
      var row = document.createElement('div');
      row.className = 'cat-row';
      row.setAttribute('data-v', c.v);

      var dot = document.createElement('span');
      dot.className = 'cat-dot';
      dot.style.background = c.dot;
      row.appendChild(dot);

      var inp = document.createElement('input');
      inp.className = 'cat-inp';
      inp.value = c.label;
      inp.maxLength = 6;
      inp.setAttribute('aria-label', '分类名称');
      inp.addEventListener('input', function(){
        c.label = (inp.value.trim() || catDef(c.v).label).slice(0, 6);
        applyCats(); renderHead([], 0);
        /* ★ 立刻落盘，别只等 blur：按 Esc 或点面板外关闭时不会触发 blur，
           只靠 blur 保存会让「改完名直接关面板」的改名丢失（2026-09-18 探针抓到）。 */
        saveCats();
      });
      inp.addEventListener('blur', function(){
        inp.value = c.label;      // 空值回退成默认名
        saveCats();
      });
      row.appendChild(inp);

      var num = document.createElement('span');
      num.className = 'cat-num';
      num.textContent = String(i + 1);
      row.appendChild(num);

      var hd = document.createElement('span');
      hd.className = 'cat-handle';
      hd.textContent = '≡';
      hd.title = '拖动排序';
      hd.addEventListener('pointerdown', function(e){ beginCatDrag(e, row); });
      row.appendChild(hd);

      el.catList.appendChild(row);
    });
  }
  /* 拖动排序：直接搬 DOM 节点，松手时按 DOM 顺序落盘。
     不用每次 mousemove 重渲染 —— 重渲染会把 pointer 事件的目标节点换掉，拖到一半就断。 */
  function beginCatDrag(e, row){
    if(e.button !== undefined && e.button !== 0) return;   // 只认左键（右键会误触发）
    e.preventDefault();
    row.classList.add('dragging');
    var list = el.catList;
    function onMove(ev){
      var rows = Array.prototype.slice.call(list.querySelectorAll('.cat-row'));
      var after = null;
      for(var i = 0; i < rows.length; i++){
        if(rows[i] === row) continue;
        var r = rows[i].getBoundingClientRect();
        if(ev.clientY < r.top + r.height / 2){ after = rows[i]; break; }
      }
      if(after === row) return;
      if(after) list.insertBefore(row, after); else list.appendChild(row);
    }
    function onUp(){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      row.classList.remove('dragging');
      var rows = Array.prototype.slice.call(list.querySelectorAll('.cat-row'));
      var byV = {};
      cats.forEach(function(c){ byV[c.v] = c; });
      cats = rows.map(function(r){ return byV[r.getAttribute('data-v')]; }).filter(Boolean);
      saveCats(); applyCats(); renderCatPanel(); renderAll();
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  }
  function openCatPanel(){
    /* 面板是 position:fixed：位置按触发按钮算，并夹在视口内，避免贴边跑出去 */
    var r = el.filterBtn.getBoundingClientRect();
    var w = 300, h = 330;
    var left = Math.min(r.right - w, window.innerWidth - w - 10);
    var top = r.bottom + 8;
    if(top + h > window.innerHeight - 8) top = Math.max(8, window.innerHeight - h - 8);
    el.catPop.style.left = Math.max(10, left) + 'px';
    el.catPop.style.top = top + 'px';
    el.catPop.hidden = false;
    renderCatPanel();
  }
  function closeCatPanel(){ el.catPop.hidden = true; }

  /* ============ 渲染 ============ */
  function renderAll(){
    var undone = state.tasks.filter(function(t){ return !t.done; });
    var todo = state.tasks.filter(function(t){ return t.status === 'todo'; });
    var doing = state.tasks.filter(function(t){ return t.status === 'doing'; });
    var done = state.tasks.filter(function(t){ return t.status === 'done'; });
    var today = undone.filter(inToday).length;
    var overdue = undone.filter(isOverdue).length;

    // 页签计数：今日用「今日口径」数，其余按状态
    el.cntToday.textContent = today;
    el.cntTodo.textContent = todo.length;
    el.cntDoing.textContent = doing.length;
    el.cntDone.textContent = done.length;
    // 底部状态栏
    el.stTodo.textContent = todo.length;
    el.stDoing.textContent = doing.length;
    el.stDone.textContent = done.length;

    renderHead(undone, overdue);
    renderList();
    updateCustomerList();
  }

  function renderHead(undone, overdue){
    var dn = [ '星期日','星期一','星期二','星期三','星期四','星期五','星期六' ];
    var now = new Date();
    var dateStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 ' + dn[now.getDay()];
    el.headTitle.textContent = catLabel(tab);   // 跟随「任务分类」里的改名，别写死
    el.headSub.textContent = dateStr;
  }

  function renderList(){
    el.list.innerHTML = '';
    if(query){
      renderQueryList();
      return;
    }
    if(tab === 'today') renderToday();
    else if(tab === 'todo') renderStatus('todo');
    else if(tab === 'doing') renderStatus('doing');
    else if(tab === 'done') renderStatus('done');
  }

  function renderQueryList(){
    var q = query.toLowerCase();
    var hits = state.tasks.filter(function(t){
      return [t.title, t.note, t.customer].some(function(v){ return String(v || '').toLowerCase().indexOf(q) >= 0; });
    });
    var g = document.createElement('div'); g.className = 'group';
    g.innerHTML = '<div class="group-head">搜索“' + esc(query) + '” <span class="g-cnt">' + hits.length + '</span></div>';
    if(!hits.length){ g.appendChild(emptyBox('没有匹配的结果')); }
    else { hits.forEach(function(t){ g.appendChild(cardEl(t)); }); }
    el.list.appendChild(g);
  }

  function groupToday(tasks){
    var b = { over:[], nodate:[], today:[], tomorrow:[], week:[], later:[] };
    var wkEnd = endOfWeekKey();
    tasks.forEach(function(t){
      if(isOverdue(t)) b.over.push(t);
      else if(!t.dueAt) b.nodate.push(t);
      else {
        var k = String(t.dueAt).slice(0,10), tk = todayKey();
        if(k === tk) b.today.push(t);
        else if(k === dkey(addDays(1))) b.tomorrow.push(t);
        else if(k <= wkEnd) b.week.push(t);
        else b.later.push(t);
      }
    });
    Object.keys(b).forEach(function(k){ b[k] = sortNew(b[k]); });
    return b;
  }
  function sortNew(a){ return a.slice().sort(function(x,y){ return String(y.receivedAt||y.createdAt||'').localeCompare(String(x.receivedAt||x.createdAt||'')); }); }

  function renderToday(){
    var undone = state.tasks.filter(function(t){ return !t.done; });
    var b = groupToday(undone);
    var defs = [
      { k:'over', label:'逾期', cls:'over' },

      { k:'later', label:'以后', cls:'' }

    defs.forEach(function(c){

  function renderStatus(st){

      list.sort(function(x,y){ return String(y.completedAt||'').localeCompare(String(x.completedAt||'')); });
    } else {
      list = sortNew(list);
    }
    if(!list.length){
      var txt = st === 'todo' ? '没有未完成的事项' : st === 'doing' ? '没有进行中的事项' : '还没有完成记录';

    var delBtn = document.createElement('button'); delBtn.className = 'btn small ghost danger'; delBtn.textContent = '✕'; delBtn.title = '删除';

    function cycleDone(e){
      e.stopPropagation();
      if(t.done){ t.status = 'todo'; t.done = false; t.completedAt = ''; }
      else if(t.status === 'doing'){ t.status = 'done'; t.done = true; t.completedAt = new Date().toISOString(); }
      else { t.status = 'doing'; t.done = false; }
      persist(); renderAll();
    }

  }

  function saveTask(){
    var title = el.fTitle.value.trim();
    if(!title){ toast('请填写要点'); el.fTitle.focus(); return; }
    var data = {
      title: title,
      customer: el.fCustomer.value.trim(),
      note: el.fNote.value.trim(),
      urgent: el.fUrgent.checked
    };
    var due = el.fDue.value;
    var recv = el.fReceived.value;
    var status = el.fDoing.checked ? 'doing' : 'todo';
    if(editingId){
      var i = state.tasks.findIndex(function(t){ return t.id === editingId; });
      if(i >= 0){
        var old = state.tasks[i];
        old.title = data.title; old.customer = data.customer;
        old.note = data.note; old.urgent = data.urgent;
        old.dueAt = due || '';
        if(recv) old.receivedAt = new Date(recv + 'T00:00:00').toISOString();
        // 若原来是已完成，编辑时不强制解锁；保留状态标记
        if(old.status !== 'done'){ old.status = status; old.done = false; old.completedAt = ''; }
        old.attachments = editAttach.slice();
      }
    } else {
      addTask(data, due, status, recv, editAttach.slice());
    }
    normalize();
    persist(); renderAll(); closeEdit();
  }

  /* 新建一条待办。saveTask 走这里 —— 字段集中在一处，
     免得以后加字段时漏掉某条路径（列序那种静默串位的教训）。 */
  function addTask(data, due, status, recv, attach){
    var st = status || 'todo';
    var t = {
      id: newId(),
      title: String(data.title || '').trim(),
      customer: String(data.customer || '').trim(),
      note: String(data.note || '').trim(),
      urgent: !!data.urgent,
      dueAt: due || '',
      receivedAt: recv ? new Date(recv + 'T00:00:00').toISOString() : new Date().toISOString(),
      createdAt: new Date().toISOString(),
      completedAt: '',
      status: st,
      done: st === 'done',
      attachments: attach || []
    };
    state.tasks.push(t);
    return t;
  }

  /* ============ 附件 ============ */
  function downscaleImg(img, max, q){
    var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    var ratio = Math.min(1, max / Math.max(w, h));
    var cw = Math.max(1, Math.round(w * ratio)), ch = Math.max(1, Math.round(h * ratio));
    var canvas = document.createElement('canvas'); canvas.width = cw; canvas.height = ch;
    var ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, cw, ch);
    return canvas.toDataURL('image/jpeg', q || 0.82);
  }
  function addFiles(files){
    Array.prototype.slice.call(files || []).forEach(function(file){
      if(!/^image\//.test(file.type)){ toast('只支持图片文件'); return; }
      var fr = new FileReader();
      fr.onload = function(){
        var img = new Image();
        img.onload = function(){
          try{ editAttach.push(downscaleImg(img, 1280, 0.8)); }catch(e){ editAttach.push(fr.result); }
          renderThumbs();
        };
        img.onerror = function(){ editAttach.push(fr.result); renderThumbs(); };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  function renderThumbs(){
    el.dzThumbs.innerHTML = '';
    editAttach.forEach(function(src, i){
      var w = document.createElement('div'); w.className = 'dz-thumb-wrap';
      var im = document.createElement('img'); im.className = 'dz-thumb'; im.src = src; im.title = '点查看大图';
      var x = document.createElement('button'); x.className = 'dz-thumb-x'; x.textContent = '×'; x.title = '移除';
      /* 2026-09-19 x 反馈：点图片应查看，不应弹上传。
         旧代码：缩略图没 stopPropagation → 点图片冒泡到 dropzone 的 click → 触发 dzFile.click()。
         修法：缩略图自己拦住 click → 打开单图灯箱（复用 #galMask）。 */
      im.addEventListener('click', function(e){
        e.stopPropagation();
        openEditGallery(i);
      });
      x.addEventListener('click', function(e){
        e.stopPropagation();
        editAttach.splice(i, 1); renderThumbs();
      });
      w.appendChild(im); w.appendChild(x);
      el.dzThumbs.appendChild(w);
    });
  }
  /* 编辑弹窗里点缩略图的查看 —— 跟列表的 openGallery 共用灯箱 DOM，
     但**不复用全局 galList**，免得污染列表那边的画廊状态。
     用 MutationObserver 监听 mask 关闭（来自任何路径：× 按钮、点空白、Esc 都行），
     然后还原共享状态 —— 不依赖事件冒泡 / capture 顺序，更稳。 */
  var editGallerySaved = null;
  var editGalleryObs = null;
  function openEditGallery(idx){
    var snap = editAttach.slice();
    if(!snap.length) return;
    /* ★ 只在「还没借走状态」时才备份 —— 不然连续点两张缩略图时第二次会把原始备份覆盖掉，
       关闭灯箱后只能还原成第一次的快照，列表那边的 galList 就被污染了。
       第一次进：saved = null → 备份原列表态。
       后续点（灯箱还开着）：saved 已存在 → 保留第一次的备份，只更新图片指针。 */
    if(!editGallerySaved) editGallerySaved = { list: galList, idx: galIdx };
    galList = snap;
    galIdx = Math.max(0, Math.min(idx, snap.length - 1));
    renderGallery();
    el.galMask.classList.add('open');
    if(!editGalleryObs){
      editGalleryObs = new MutationObserver(function(){
        if(!el.galMask.classList.contains('open') && editGallerySaved){
          galList = editGallerySaved.list; galIdx = editGallerySaved.idx;
          editGallerySaved = null;
        }
      });
    }
    editGalleryObs.observe(el.galMask, {attributes:true, attributeFilter:['class']});
  }

  el.dropzone.addEventListener('click', function(e){
    /* ★ 只在「没点中缩略图/删除按钮」时才弹上传。
       缩略图自己有 stopPropagation，所以到这里时 e.target 就是 dropzone 自己。 */
    if(e.target === el.dropzone && document.activeElement !== el.dzFile) el.dzFile.click();
  });
  el.dzFile.addEventListener('change', function(){ if(el.dzFile.files && el.dzFile.files.length) addFiles(el.dzFile.files); el.dzFile.value = ''; });
  el.dropzone.addEventListener('dragover', function(e){ e.preventDefault(); el.dropzone.classList.add('drag'); });
  el.dropzone.addEventListener('dragleave', function(){ el.dropzone.classList.remove('drag'); });
  el.dropzone.addEventListener('drop', function(e){ e.preventDefault(); el.dropzone.classList.remove('drag'); if(e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files); });

  /* ============ AI 识别 ============ */
  function proxifyBase(base){
    base = String(base || '').replace(/\/+$/, '');
    if(!IS_SERVER) return base;
    var m = /^(https?):\/\/([^\/]+)(\/.*)?$/i.exec(base);
    if(!m) return base;
    var proto = m[1].toLowerCase(), host = m[2], p = m[3] || '';
    var hn = host.split(':')[0];
    if(hn === 'localhost' || hn === '127.0.0.1') return base;
    return location.origin + '/px/' + proto + '/' + host + p;
  }
  function modelCfg(){
    try{ return JSON.parse(localStorage.getItem('wb_cfg') || 'null'); }catch(e){ return null; }
  }
  function extractJson(text){
    text = String(text || '').replace(/```json/gi, '').replace(/```/g, '').trim();
    var s = text.indexOf('{'), e = text.lastIndexOf('}');
    if(s < 0 || e <= s) return null;
    try{ return JSON.parse(text.slice(s, e + 1)); }catch(err){ return null; }
  }
  function normalizeDate(v){
    v = String(v || '').trim();
    if(!v) return '';
    var m = v.match(/(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})/);
    if(m) return fixupAiYear(m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]));
    if(/今天/.test(v)) return todayKey();
    if(/明天/.test(v)) return dkey(addDays(1));
    if(/后天/.test(v)) return dkey(addDays(2));
    var d = dateOf(v);
    if(d && !isNaN(d.getTime())) return fixupAiYear(dkey(d));
    return '';
  }
  /* ★ 2026-09-20 修「9月27日被记成已逾期」：
     这里的入参只来自 **AI/OCR 自动整理**（applyArranged），手动改日期根本不走本函数。
     AI 把不带年份的「9月27日」脑补成往年年份（实测填成 2023-09-27，比今天早 3 年 →
     isOverdue 判成逾期）。规则：只要年份在过往（今年之前的某年）就滚到「最近的未来」——
     今年这个月日已过 → 明年，否则 → 今年。手动选的日期不受影响。 */
  function fixupAiYear(s){
    var p = String(s).split('-');
    if(p.length < 3) return s;
    var y = +p[0], mo = +p[1], da = +p[2];
    if(!(y > 0 && mo >= 1 && mo <= 12 && da >= 1 && da <= 31)) return s;
    if(y >= new Date().getFullYear()) return s;           // 今年/未来年 → 不动
    var cand = new Date(new Date().getFullYear(), mo - 1, da);
    if(cand.getTime() < todayMidnight().getTime()) cand = new Date(new Date().getFullYear() + 1, mo - 1, da);
    return dkey(cand);
  }
  function retainScreenshot(dataUrl){
    // 识别失败也保住截图：降采样后并入附件，用户保存时随任务留档（2026-09-16 用户要求）
    var img = new Image();
    img.onload = function(){
      try{ editAttach.push(downscaleImg(img, 1280, 0.8)); }catch(e){ editAttach.push(dataUrl); }
      renderThumbs();
    };
    img.onerror = function(){ editAttach.push(dataUrl); renderThumbs(); };
    img.src = dataUrl;
  }
  /* ===== 本地规则整理（不依赖大模型）=====
     2026-09-18 用户诉求：参考工具里「粘贴并整理」不用配大模型也能用，我这边却提示要接视觉模型。
     说明：图片必须靠视觉模型（本地读不了图）；但**文字内容**完全可以用规则整理，这里补上兜底。
     规则：链接进备注、日期进完成时间、首行有意义文字当要点、其余进备注。
     没配模型时不再报错，直接走这里；配了模型时图片仍走模型，文字走本地（快且不花钱）。 */
  /* OCR 噪声的最小修复：只还原「https : / /」这类无歧义的写法。
     ⚠️ **不要**试图自动拼回被 OCR 拆行的长 URL。试过基于「吃掉后面的空格/·」的启发式，
        实测会把 URL 后面正常跟着的英文单词一起粘进去（https://a.com abc def → https://a.comabc.def），
        比不修更糟。OCR 原文整段会留在备注里，让人自己看/改更可靠。
     实测样例（canvas 文字图）：真值 https://detail.1688.com/offer/977760352528.html
       被 Windows OCR 读成 https://detail.1 688 · com/offer/977760352528 · htm 丨 */
  /* OCR 会把链接读得面目全非（2026-09-18 用户实测：
     `h ps ： / / detaiI.16 ℃ om / 0 什 er, / 9777 325228 ． htm | ？ 0 什 erld = 977760 《`）。
     逐字猜错字不可靠 —— 所以**不做通用纠错**，只做「结构化重建」：
     命中电商链接的强特征后，按固定格式 `https://<host>/offer/<数字>.html` 拼回去。
     ★ 只有商品数字 id 是从图里读的，主机名是硬编码的（不猜域名），
       所以最坏情况只是「拼不出来 → 原样返回」，不会拼出一个错的链接。 */
  function repairOcrUrls(t){
    var s = String(t == null ? '' : t);
    if(!s) return s;
    /* 协议：`https：//` / `h ps ： / / ` / `http : / /` → `https://`
       （OCR 会漏字母、插空格、把冒号读成全角） */
    s = s.replace(/h\s*t*\s*p*\s*s?\s*[：:]\s*\/\s*\/\s*/gi, 'https://');
    return s.replace(/https:\/\/[^\n]*/gi, function(seg){
      return tryRebuildOfferUrl(seg) || seg;
    });
  }

  /* 把一段「从 https:// 到行尾」的文本尝试重建为 1688 商品链接；不行就返回 null */
  function tryRebuildOfferUrl(seg){
    var s = String(seg)
      .replace(/℃\s*om/gi, 'com')          // 「℃om」→ com（Windows OCR 把 c 读成 ℃）
      .replace(/℃/g, '')
      .replace(/[．。·•]/g, '.')              // 全角点 / 中间点 → .（OCR 很爱把 . 读成 ·）
      .replace(/detai[lI1|]/gi, 'detail')    // detaiI / detai1 → detail
      .replace(/0\s*什\s*e?r?/gi, 'offer')   // 「0 什 er」→ offer（1688 的路径段）
      .replace(/of{1,2}er/gi, 'offer')
      .replace(/1\s*6\s*8\s*8/g, '1688')
      .replace(/\s+/g, '');                  // URL 内部不该有空格

    /* 1688 特征：① 路径里有 /offer/  ② 主机名是 detail./m./item. 且带 16 或 1688。
       两个都不沾 → 不是电商商品链接，不碰它。 */
    var hasOffer = /\/offer(?:[\/.,;]|$)/i.test(s);
    var has1688Host = /(?:^|\/\/)(?:detail|m|item)\./i.test(s) && /1?6|1688/.test(s);
    if(!hasOffer && !has1688Host) return null;

    /* 商品 id：.htm/.html 之前最后一段连续数字（1688 是 6~20 位） */
    var m = s.match(/(\d{6,20})\.html?/i);
    if(!m) return null;

    /* 主机名硬编码，不猜：`m.` → m.1688.com（手机端），其余 → detail.1688.com */
    var host = /^https:\/\/m[.\d]/i.test(s) ? 'm.1688.com' : 'detail.1688.com';
    return 'https://' + host + '/offer/' + m[1] + '.html';
  }

  /* 从一段文字里挑「完成时间」：完整日期 > 相对说法 > 「9月18日」这种省略年份的。 */
  function dueFromText(text){
    var m = text.match(/(\d{4})\s*[-/年.]\s*(\d{1,2})\s*[-/月.]\s*(\d{1,2})/);
    if(m) return m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);
    if(/后天/.test(text)) return dkey(addDays(2));
    if(/明天|次日/.test(text)) return dkey(addDays(1));
    if(/今天|今日/.test(text)) return todayKey();
    var m2 = text.match(/(\d{1,2})\s*[月./]\s*(\d{1,2})\s*[日号]?/);
    if(m2 && +m2[1] >= 1 && +m2[1] <= 12 && +m2[2] >= 1 && +m2[2] <= 31){
      return new Date().getFullYear() + '-' + pad(+m2[1]) + '-' + pad(+m2[2]);
    }
    return '';
  }

  function arrangeTextLocal(raw){
    var text = repairOcrUrls(String(raw == null ? '' : raw)).replace(/\r\n?/g, '\n').trim();
    if(!text) return null;

    var urls = text.match(/https?:\/\/[^\s，。；、）)】\]]+/gi) || [];

    var due = dueFromText(text);

    /* 去掉链接与纯符号行之后，剩下的才是「人话」 */
    var lines = text.split('\n').map(function(s){
      return s.replace(/https?:\/\/\S+/gi, '').replace(/[\s·|,，、;；:：-]+$/, '').trim();
    }).filter(function(s){ return s && !/^[-—=*#>\s]+$/.test(s); });

    var title = '';
    for(var i = 0; i < lines.length; i++){
      /* 必须含中英文 —— 纯数字/符号行多半是 OCR 噪音，不当要点 */
      if(lines[i].length >= 2 && lines[i].length <= 60 && /[\u4e00-\u9fffA-Za-z]/.test(lines[i])){
        title = lines[i]; break;
      }
    }
    if(!title && urls.length){
      /* 只有一条链接：用域名 + 路径末段当要点，总比留空强 */
      try{
        var u = new URL(urls[0]);
        var seg = (u.pathname || '').split('/').filter(Boolean).pop() || '';
        title = seg ? ('查看链接：' + seg) : ('查看链接（' + u.hostname + '）');
      }catch(e){ title = '查看链接'; }
    }
    if(!title && lines.length) title = lines[0].slice(0, 60);
    if(!title) return null;

    /* 备注里只放「修复后的链接」+「没当标题的那些行」。
       2026-09-18 用户反馈「全部堆在备注里面」—— 以前链接修不好就剥不掉，
       整段原文连带乱码一起进了备注，变成一堵墙。链接修好后这里自然就短了。
       再加一道限长：超过 300 字只留前几行，宁可少放也别堆墙。 */
    var parts = [];
    if(urls.length) parts.push(urls.join('\n'));
    var rest = lines.filter(function(s){ return s !== title; });
    var buf = [];
    for(var k = 0; k < rest.length; k++){
      var next = buf.concat([rest[k]]).join('\n');
      if((parts.join('\n') + '\n' + next).length > 300) break;
      buf.push(rest[k]);
    }
    if(buf.length) parts.push(buf.join('\n'));
    var note = parts.join('\n').trim();

    return { customer: '', title: title, note: note, due: due, rows: lines.length };
  }

  /* 把整理结果填进表单。只填空字段，不覆盖用户已经填好的内容。返回填了几项。 */
  function applyArranged(obj){
    if(!obj) return 0;
    var n = 0;
    if(!el.fTitle.value && obj.title){ el.fTitle.value = String(obj.title).trim(); n++; }
    if(!el.fCustomer.value && obj.customer){ el.fCustomer.value = String(obj.customer).trim(); n++; }
    if(!el.fNote.value && obj.note){ el.fNote.value = String(obj.note).trim(); n++; }
    var d = normalizeDate(obj.due);
    if(d && !el.fDue.value){ el.fDue.value = d; syncQuickDates(); n++; }
    return n;
  }

  /* 本地整理的统一入口（文字走这里，不调用大模型） */
  function runLocalArrange(text){
    var obj = arrangeTextLocal(text);
    if(!applyArranged(obj)){
      toast('没能从这段内容里提取到可用信息，请手动填写');
      return;
    }
    /* 一段文字里有好几条时明说 —— 不然用户会以为「后面的丢了」 */
    var tail = (obj && obj.rows > 1)
      ? '（这段里有 ' + obj.rows + ' 条内容，先把第 1 条填进表单，其余放在备注里；其余的可手动新增。）'
      : '';
    el.aiHint.textContent = '已用本地规则整理（未调用大模型）：链接进备注、日期进完成时间，请确认后保存。' + tail;
    toast('已按本地规则整理，请确认后保存');
  }

  /* 本机离线 OCR 兜底（2026-09-18）
     背景：用户问「参考工具没配视觉模型也能识别截图，为什么」。
     查下来参考工具其实也要配模型；真正能做到「不配模型也认图」的是 **Windows 自带的 OCR 引擎**
     （Windows.Media.Ocr）—— 离线、免费、不要 Key，实测 1440x900 截图约 250ms。
     实现放在 wb-server 的 POST /api/ocr 里（浏览器拿不到 WinRT，放服务端网页版和客户端都能用）。
     流程：截图 → 离线 OCR 出文字 → 复用本地规则整理成字段。
     ⚠️ 密集界面截图的 OCR 结果会比较碎（正常，OCR 不是语义理解）；聊天/商品截图会好很多。
        文字全部落进「备注」，不丢信息；配了视觉模型时仍优先走模型（质量更好）。 */
  function localOcrArrange(imageDataUrl){
    if(!IS_SERVER){
      el.aiHint.textContent = '未配置模型，且离线 OCR 需要本地服务。请用「启动工作台.bat」打开，或到「设置」填 API。截图已保留为附件。';
      toast('离线 OCR 需要本地服务；截图已留档');
      return;
    }
    /* 先量一下图有多大。2026-09-18 实测：一张 442×558 的图（微信/QQ 转发会压），
       字只有 8~10 像素高，放大 2/3/4/6 倍都只能救回一点点 —— **乱码的根因是输入太小**。
       这种时候必须把话说明白，否则用户只会觉得「你这识别不行」。 */
    measureImage(imageDataUrl, function(dim){
    el.fSave.disabled = true;
    var sizeTip = (dim && dim.w > 0 && Math.min(dim.w, dim.h) < 600)
      ? '　⚠️ 这张图只有 ' + dim.w + '×' + dim.h + '，字太小，识别会不准；建议截「原始大小」的图再试。'
      : '';
    el.aiHint.textContent = '未配置模型，正在用本机离线 OCR 识别截图（不联网、不需要 Key）…' + sizeTip;
    fetch('/api/ocr', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: imageDataUrl })
    }).then(function(r){ return r.json(); }).then(function(j){
      if(!j || !j.ok || !j.text || !j.text.trim()) throw new Error((j && j.error) || '没识别出文字');
      /* 先过一遍链接修复再当原文用 —— 否则备注里留的还是 `· com/offer/...` 这种乱码 */
      var raw = repairOcrUrls(j.text.trim());
      var obj = arrangeTextLocal(raw) || {};
      if(!applyArranged({ title: obj.title, customer: obj.customer, due: obj.due })){
        /* 一个字段都整理不出来 → 别再往备注里倒原文。
           2026-09-18 用户反馈：「全部堆在备注里面」—— 以前是无条件倒原文，
           结果识别质量差时备注变成一堵乱码墙。 */
        el.aiHint.textContent = '离线 OCR 读到了文字，但没能整理出要点（识别质量不够）。截图已留档；可换用视觉模型，或用更清晰 / 更大的截图重试。' + sizeTip;
        toast('识别质量不够，没能整理出要点');
        return;
      }
      /* 整理成功了才把原文放备注供核对；原文太长就不放，免得备注变成一堵墙 */
      if(!el.fNote.value && raw.length <= 400) el.fNote.value = raw;
      el.aiHint.textContent = '已用「本机离线 OCR + 本地规则」整理（全程没调用任何模型）；识别质量取决于截图清晰度，请核对后保存。' + sizeTip;
      toast('已按离线识别整理，请确认后保存');
    }).catch(function(err){
      var msg = (err && err.message) ? err.message : String(err);
      el.aiHint.textContent = '未配置模型，本机离线 OCR 也没成功（' + msg + '）。截图已保留为附件；可到「设置」填 API 用视觉模型识别。' + sizeTip;
      toast('离线 OCR 没成功：' + msg);
    }).then(function(){
      el.fSave.disabled = false;
    });
    });
  }

  /* 量图片原始尺寸（同步拿不到，只能等 onload）。失败就当「没量到」，不影响主流程。 */
  function measureImage(dataUrl, cb){
    try{
      var im = new Image();
      im.onload = function(){ cb({ w: im.naturalWidth, h: im.naturalHeight }); };
      im.onerror = function(){ cb(null); };
      im.src = dataUrl;
    }catch(e){ cb(null); }
  }

  function callModel(imageDataUrl){
    if(editAttach.indexOf(imageDataUrl) < 0) retainScreenshot(imageDataUrl);
    var cfg = modelCfg();
    if(!cfg || !cfg.base || !cfg.key || !cfg.model){
      /* 没配模型：先试**本机离线 OCR**（Windows 自带引擎，不联网、不要 Key）。
         还不行才提示去配模型 —— 截图已在上一步 retainScreenshot 留档，不会丢。 */
      localOcrArrange(imageDataUrl);
      return;
    }
    el.fSave.disabled = true;
    var img = new Image();
    img.onload = function(){
      var b64;
      try{ b64 = downscaleImg(img, 1568, 0.85).split(',')[1]; }
      catch(e){ b64 = imageDataUrl.split(',')[1] || ''; }
      var base = proxifyBase(cfg.base).replace(/\/chat\/completions\/?$/i, '');
      var url = base + '/chat/completions';
      var prompt = [
        '你是资深电商运营助理。请从这张截图/图片识别待办信息，只输出一个 JSON 对象，不要输出 JSON 以外的文字。',
        '字段：customer（事项名称，识别不到为空字符串）、title（任务要点，一句话概括）、note（截图里的补充说明、要求、细节，识别不到为空字符串）、due（交付/截止日期，规范化为 YYYY-MM-DD，识别不到为空字符串）。',
        '严格按此格式输出：{"customer":"","title":"","note":"","due":""}'
      ].join('\n');
      var body = {
        model: cfg.model,
        messages: [{ role: 'user', content: [
          { type: 'text', text: prompt },
          { type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + b64 } }
        ]}],
        temperature: 0.2
      };
      el.aiHint.textContent = '正在调用「' + cfg.model + '」识别…';
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
        body: JSON.stringify(body)
      }).then(function(resp){
        if(!resp.ok){ return resp.text().then(function(t){ throw new Error('接口返回 ' + resp.status + '：' + (t || '').slice(0, 200)); }); }
        return resp.json();
      }).then(function(j){
        var content = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
        var obj = extractJson(content);
        if(!obj) throw new Error('未能解析识别结果');
        if(applyArranged(obj)) toast('已整理，请确认后保存');
        else toast('识别完成，未提取到明显内容');
        el.aiHint.textContent = '粘贴或上传截图后，可用「粘贴并整理」自动识别事项 / 要点 / 备注 / 完成时间';
      }).catch(function(err){
        var msg = (err && err.message) ? err.message : String(err);
        /* ★ 模型失败就自动回落到本机离线 OCR（2026-09-18）：
           最常见的失败原因就是「配的是文本模型」（如智谱 glm-4-flash），喂图片必然报错；
           网络抖动也一样。与其让用户看着报错，不如直接换离线 OCR 再试一次。 */
        toast('模型识别失败，改用本机离线 OCR 重试…');
        el.aiHint.textContent = '模型识别失败（' + msg + '），已自动改用本机离线 OCR 重试…';
        localOcrArrange(imageDataUrl);
        return;
      }).then(function(){
        el.fSave.disabled = false;
      });
    };
    img.onerror = function(){ toast('图片读取失败'); el.fSave.disabled = false; };
    img.src = imageDataUrl;
  }
  function pasteAndOrganize(){
    /* 优先用已上传的附件图；否则读剪贴板 —— 图片走模型，文字走本地规则 */
    if(editAttach.length){
      callModel(editAttach[editAttach.length - 1]);
      return;
    }
    if(!(navigator.clipboard && navigator.clipboard.read)){
      toast('当前浏览器不支持读剪贴板，请手动上传截图，或把文字粘进「备注」后点这里');
      return;
    }
    navigator.clipboard.read().then(function(items){
      var imgIt = null, txtIt = null;
      items.forEach(function(it){
        if(!imgIt && it.types.indexOf('image/png') >= 0) imgIt = it;
        if(!txtIt && it.types.indexOf('text/plain') >= 0) txtIt = it;
      });
      if(imgIt){
        imgIt.getType('image/png').then(function(blob){
          var fr = new FileReader(); fr.onload = function(){ callModel(fr.result); }; fr.readAsDataURL(blob);
        });
        return;
      }
      if(txtIt){
        txtIt.getType('text/plain').then(function(blob){
          var fr2 = new FileReader();
          fr2.onload = function(){ runLocalArrange(String(fr2.result || '')); };
          fr2.readAsText(blob);
        });
        return;
      }
      toast('剪贴板里既没有图片也没有文字，可先复制内容再点这里');
    }).catch(function(){ toast('无法读取剪贴板，请手动上传截图后再识别'); });
  }

  });
  /* Ctrl+V 一键整理（2026-09-18 重写）
     以前第一行就是「弹窗没开就 return」→ 必须先点「新增」再粘贴。用户报障：
     参考工具在待办主页直接按 Ctrl+V 就能「新增 + 自动识别剪贴板图片」，没图片还会提示。
     参考实现（PomeTodo `TodoPage.tsx` 的 handleTodoClipboardShortcut）：
       intent=native（焦点在输入框）→ 放行；intent=ignore（正忙）→ 忽略；
       否则 `if (!dialogOpen) openCreateDialog()` **自动打开新增**，再识别 / 加附件。
     我们这里：焦点在输入框 → 放行原生粘贴；剪贴板空 → 提示；
       有图 → 自动开新增并走识别（模型 → 离线 OCR）；只有文字 → 自动开新增并走本地规则整理。 */
  document.addEventListener('paste', function(e){
    var tag = (document.activeElement && document.activeElement.tagName || '').toLowerCase();
    if(tag === 'input' || tag === 'textarea') return;   // 输入框内粘贴放行，别抢原生粘贴
    if(!el.galMask.hidden && el.galMask.classList.contains('open')) return;   // 图集开着时不抢

    var items = (e.clipboardData && e.clipboardData.items) || [];
    var imgFile = null;
    for(var i = 0; i < items.length; i++){
      if(items[i].type.indexOf('image') === 0){
        var f = items[i].getAsFile();
        if(f){ imgFile = f; break; }
      }
    }
    var txt = (e.clipboardData && e.clipboardData.getData) ? e.clipboardData.getData('text/plain') : '';

    if(!imgFile && !txt.trim()){
      /* 剪贴板里没东西：给个提示，别默默无反应（也不弹一个空的新增窗） */
      if(!el.editMask.classList.contains('open')){
        toast('剪贴板里没有图片或文字，先复制内容再按 Ctrl+V');
      }
      return;
    }
    e.preventDefault();

    if(!el.editMask.classList.contains('open')) openEdit(null);   // ★ 主页直接 Ctrl+V 也能新增

    if(imgFile){
      var fr = new FileReader();
      fr.onload = function(){ callModel(fr.result); };
      fr.readAsDataURL(imgFile);
      return;
    }
    /* 只有文字：走本地规则整理（不调用模型） */
    runLocalArrange(txt);
  });

  /* ============ 主题 ============ */
  function applyTheme(t){
    var map = { dark:'dark', light:'light', auto:'light', eye:'eye' };
    document.documentElement.setAttribute('data-theme', map[t] || 'light');
  }
  try{ var st = null; try{ st = localStorage.getItem('wb_theme'); }catch(e){} applyTheme(st || 'light'); }catch(e){}
  window.addEventListener('message', function(ev){ var d = ev && ev.data; if(d && d.type === 'wb-theme'){ try{ applyTheme(d.theme); }catch(e){} } });

  function toast(msg){
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.toast.classList.remove('show'); }, 2400);
  }

  /* ============ 启动 ============ */
  cats = loadCats();    // 先从存储读出「任务分类」配置
  applyCats();          // 再套到页签上，之后才首屏渲染（否则会闪一下默认名）
  detectServer(load);
  window.__ctodoApi = { state: state, persist: persist, renderAll: renderAll,
    cats: function(){ return cats; }, loadCats: loadCats, applyCats: applyCats };
})();
</script>
