name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 安装前端依赖
        run: npm ci

      - name: 注入更新端点（用当前仓库名替换占位符）
        shell: pwsh
        run: |
          $conf = 'src-tauri\tauri.conf.json'
          $j = (Get-Content $conf -Raw).Replace('REPLACE_WITH_OWNER/REPLACE_WITH_REPO', '${{ github.repository }}')
          Set-Content -Path $conf -Value $j -NoNewline

      - name: 构建并签名
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri -- build

      - name: 生成 latest.json
        shell: pwsh
        run: |
          $nsis = 'src-tauri\target\release\bundle\nsis'
          $exe = Get-ChildItem $nsis -Filter '*-setup.exe' | Select-Object -First 1
          $sig = Get-ChildItem $nsis -Filter '*.exe.sig' | Select-Object -First 1
          $conf = Get-Content 'src-tauri\tauri.conf.json' -Raw | ConvertFrom-Json
          $version = $conf.version
          $signature = (Get-Content $sig.FullName -Raw).Trim()
          $encoded = [uri]::EscapeDataString($exe.Name)
          $repo = '${{ github.repository }}'
          $tag = '${{ github.ref_name }}'
          $latest = [ordered]@{
            version    = $version
            notes      = 'GitHub Actions 自动发布'
            pub_date   = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms  = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $signature
                url       = "https://github.com/$repo/releases/download/$tag/$encoded"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 6 | Set-Content -Path 'latest.json' -Encoding UTF8NoBOM
          Write-Host "latest.json 已生成："
          Get-Content 'latest.json'

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            latest.json